name: Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Verify consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: scripts/.node-version
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts

      # The same installed checker and the same governance/content-debt-baseline.json that
      # `npm run setup:all` uses: recorded pre-existing content debt does not block, new or
      # increased content findings fail this PR, and the baseline may only shrink.
      - name: Provider-neutral governance check (hooks-off)
        run: npm run governance:check

      - name: Type-check
        run: npm run typecheck

      - name: Lint DS internal imports(防 consumer 用 internal path)
        run: npm run lint:imports

      - name: Build all apps
        run: npm run build
