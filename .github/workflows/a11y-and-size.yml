name: Bundle Size

on:
  workflow_dispatch:
  schedule:
    # Non-blocking drift monitor; merge safety is owned by the single CI gate.
    - cron: '0 2 * * *'

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  # a11y-axe(axe-core WCAG 2A+AA 基線回歸閘)2026-11-26 搬進 ci.yml 的 verify-browser-a11y(地基修正 F4):
  # 指令逐字相同(npm run a11y:check -- --gate),PR 與 push main 都跑(暫不在 verify 必過總關卡、紅了不擋合併,理由與何時接上寫在 ci.yml 該 job 檔頭)。同一棵樹在這裡每晚再掃一次是同一支閘跑兩次 ——
  # 依賴(含 Chromium)由 lockfile 釘死,夜間這趟量不到 PR 量不到的東西 —— 所以退役,不是放寬。
  size-limit:
    name: Monitor bundle size drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24.14.0', cache: 'npm' }
      - run: npm run --silent setup:dependencies
      - name: Build DS lib + types(含 storybook-config,supply .storybook/main.ts 型別)
        run: npm run build:lib 2>&1 | tail -10
      - name: Build production app(for aggregate budget)
        run: npm run build 2>&1 | tail -10
      - name: Run size-limit
        run: npx --no-install size-limit 2>&1 | tail -60
