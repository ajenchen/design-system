name: Mirror published product template

# A published GitHub Release is the only handoff. This workflow never blocks the
# release path and exposes the existing cross-repository credential only after all
# release assets are verified.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-published-template-mirror-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  mirror-published-release:
    name: Verify the published release and open the mirror PR
    if: github.event.release.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout protected workflow source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout the published release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Bind release identity to main and package version
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|next|rc)\.[0-9]+)?$ ]]
          /usr/bin/git -C source fetch --force --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          release_commit="$(/usr/bin/git -C source rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          release_tree="$(/usr/bin/git -C source rev-parse "$release_commit^{tree}")"
          /usr/bin/git -C source merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
          release_version="${RELEASE_TAG#v}"
          for manifest in \
            source/packages/design-system/package.json \
            source/packages/storybook-config/package.json \
            source/packages/governance/package.json
          do
            test "$(node -p "require('./$manifest').version")" = "$release_version"
          done
          test "$RELEASE_TARGET" = "main" -o "$RELEASE_TARGET" = "$release_commit"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "tree=$release_tree" >> "$GITHUB_OUTPUT"

      - name: Set up locked Node toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          package-manager-cache: false

      - name: Install source dependencies
        working-directory: source
        run: npm run --silent setup:dependencies

      - name: Download the exact published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-artifacts

      - name: Verify six-file release set, BOM, and npm readback
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_TREE: ${{ steps.identity.outputs.tree }}
        run: |
          set -euo pipefail
          node source/scripts/release-set.mjs --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          node source/scripts/build-release-bom.mjs --verify \
            --repo "$GITHUB_WORKSPACE/source" \
            --artifacts "$GITHUB_WORKSPACE/release-artifacts" \
            --bom "$GITHUB_WORKSPACE/release-artifacts/release-bom.json" \
            --tag "$RELEASE_TAG" \
            --git-head "$RELEASE_COMMIT" \
            --git-tree "$RELEASE_TREE" \
            --repository "$GITHUB_REPOSITORY" \
            --main-ref refs/remotes/origin/main \
            --require-sbom
          node source/scripts/release-npm-readback.mjs \
            --artifacts "$GITHUB_WORKSPACE/release-artifacts" \
            --bom "$GITHUB_WORKSPACE/release-artifacts/release-bom.json" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --git-head "$RELEASE_COMMIT"

      - name: Build and verify the published template mirror
        id: mirror
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mirror="$RUNNER_TEMP/published-template"
          test -f source/scripts/published-template-mirror-policy.json
          node source/scripts/build-published-template-mirror.mjs --out="$mirror"
          node source/scripts/product-template-scaffold-lock.mjs --verify \
            --root "$mirror" \
            --lock "$GITHUB_WORKSPACE/release-artifacts/product-template-scaffold.lock.json" \
            --phase source
          node source/scripts/generate-product-template-package-lock.mjs --prefix "$mirror"
          node source/scripts/product-template-scaffold-lock.mjs --verify \
            --root "$mirror" \
            --lock "$GITHUB_WORKSPACE/release-artifacts/product-template-scaffold.lock.json" \
            --phase published
          echo "path=$mirror" >> "$GITHUB_OUTPUT"

      - name: Prepare a deterministic mirror branch without credentials
        id: prepare
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MIRROR: ${{ steps.mirror.outputs.path }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/ds-product-template"
          git clone --depth=1 https://github.com/ajenchen/ds-product-template.git "$target"
          rsync -a --delete --exclude=.git/ "$MIRROR/" "$target/"
          /usr/bin/git -C "$target" add --all
          if /usr/bin/git -C "$target" diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="automation/release-${RELEASE_TAG//[^A-Za-z0-9._-]/-}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Push mirror branch and open or update pull request
        if: steps.prepare.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          GH_PROMPT_DISABLED: '1'
          GIT_TERMINAL_PROMPT: '0'
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SOURCE_SHA: ${{ steps.identity.outputs.commit }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          TARGET: ${{ steps.prepare.outputs.target }}
        run: |
          set -euo pipefail
          /usr/bin/git -C "$TARGET" config user.name design-system-release-bot
          /usr/bin/git -C "$TARGET" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          /usr/bin/git -C "$TARGET" config credential.helper '!gh auth git-credential'
          /usr/bin/git -C "$TARGET" commit -m "chore: mirror design system $RELEASE_TAG"
          expected="$(/usr/bin/git -C "$TARGET" ls-remote --refs origin "refs/heads/$BRANCH" | awk 'NR == 1 { print $1 }')"
          if [ -n "$expected" ]; then
            /usr/bin/git -C "$TARGET" push --force-with-lease="refs/heads/$BRANCH:$expected" origin "HEAD:refs/heads/$BRANCH"
          else
            /usr/bin/git -C "$TARGET" push origin "HEAD:refs/heads/$BRANCH"
          fi
          existing="$(gh pr list --repo ajenchen/ds-product-template --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --repo ajenchen/ds-product-template \
              --head "$BRANCH" \
              --base main \
              --title "chore: mirror design system $RELEASE_TAG" \
              --body "Generated from published design-system release $RELEASE_TAG at $SOURCE_SHA."
          fi
