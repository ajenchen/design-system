name: Release

# Ordinary release trust binding: GitHub ajenchen/design-system + workflow
# release.yml + environment npm-release publish exact tarballs through npm
# Trusted Publishing (OIDC) with provenance, then read back the registry.
# The extra high-assurance lane (Ed25519 tag authorization, App-identity and
# ruleset observation, immutable-release evidence) is opt-in via the
# RELEASE_HIGH_ASSURANCE repository variable and never blocks this default path.

on:
  # repository_dispatch always loads this privileged workflow from protected
  # default. A pushed tag is data only and can never supply its own workflow.
  repository_dispatch:
    types: [stage-protected-release]

permissions: {}

# The payload tag must resolve to the current protected-main HEAD before any
# untrusted code, OIDC, attestation, or npm authority is used.
concurrency:
  group: ${{ github.repository }}-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.client_payload.tag }}
  RELEASE_DISPATCH_TAG: ${{ github.event.client_payload.tag }}

jobs:
  resolve-release-request:
    name: Bind dispatch request to current protected main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      release_commit: ${{ steps.identity.outputs.commit }}
      release_tree: ${{ steps.identity.outputs.tree }}
    steps:
      - name: Checkout protected default workflow source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact tag and reject stale or off-main dispatch
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|next|rc)\.[0-9]+)?$ ]] || {
            echo "release dispatch requires vX.Y.Z or vX.Y.Z-(beta|next|rc).N"
            exit 1
          }
          /usr/bin/git fetch --force --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          /usr/bin/git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          main_commit="$(/usr/bin/git rev-parse refs/remotes/origin/main^{commit})"
          event_commit="$(/usr/bin/git rev-parse "$GITHUB_SHA^{commit}")"
          tag_commit="$(/usr/bin/git rev-parse "refs/tags/$tag^{commit}")"
          test "$event_commit" = "$main_commit" || {
            echo "stale dispatch workflow source: event $event_commit, current main $main_commit"
            exit 1
          }
          test "$tag_commit" = "$main_commit" || {
            echo "release tag $tag points to $tag_commit, not current protected main $main_commit"
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "tree=$(/usr/bin/git rev-parse "$tag_commit^{tree}")" >> "$GITHUB_OUTPUT"

  trust-preflight:
    name: Read-only GitHub release trust preflight(opt-in high-assurance lane)
    if: vars.RELEASE_HIGH_ASSURANCE == 'true'
    needs: resolve-release-request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      deployments: read
    outputs:
      evidence_digest: ${{ steps.resolve_trust.outputs.evidence_digest }}
      evidence_file_sha256: ${{ steps.resolve_trust.outputs.evidence_file_sha256 }}
      authorization_digest: ${{ steps.resolve_trust.outputs.authorization_digest }}
      tag_object: ${{ steps.resolve_trust.outputs.tag_object }}
      artifact_digest: ${{ steps.retain_trust.outputs.artifact-digest }}
    steps:
      - name: Checkout exact protected release commit without stored credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.resolve-release-request.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up verification-only Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          package-manager-cache: false

      - name: Install the locked read-only verifier dependencies
        run: npm run --silent setup:dependencies

      - name: Resolve actual GitHub trust state before any privileged job can start
        id: resolve_trust
        env:
          # A separately provisioned fine-grained read-only token may be needed
          # for ruleset/environment/secret-metadata/immutable-release readback.
          # Missing observation permission is a hard failure, never a bypass.
          GH_TOKEN: ${{ secrets.RELEASE_TRUST_PREFLIGHT_TOKEN || github.token }}
        run: >-
          node scripts/release-trust-preflight.mjs
          --repository "$GITHUB_REPOSITORY"
          --release-tag "${{ needs.resolve-release-request.outputs.tag }}"
          --release-commit "${{ needs.resolve-release-request.outputs.release_commit }}"
          --release-tree "${{ needs.resolve-release-request.outputs.release_tree }}"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --event "$GITHUB_EVENT_PATH"
          --output "$RUNNER_TEMP/release-trust/release-trust-preflight.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Retain attempt-unique trust evidence
        id: retain_trust
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-trust-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-trust/release-trust-preflight.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  smoke-shard:
    name: Storybook full smoke ${{ matrix.shard }}/4
    needs: resolve-release-request
    runs-on: ubuntu-24.04
    env:
      # setup:playwright 以 PLAYWRIGHT_BROWSERS_PATH=0 安裝到 repo-local
      # node_modules/playwright-core/.local-browsers;消費步驟必須帶同一 pin,
      # 否則 playwright 落回 ~/.cache/ms-playwright 找不到瀏覽器(2026-07-28 CI 錨例)。
      PLAYWRIGHT_BROWSERS_PATH: '0'
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout exact protected release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.resolve-release-request.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          package-manager-cache: false

      - name: Install dependencies with the lock-bound npm runtime
        run: node scripts/setup-authority-governance.mjs --dependencies-only

      - name: Install Playwright Chromium
        run: npm run --silent setup:playwright -- --with-deps

      - name: Build library and Storybook
        run: |
          npm run --silent build:lib
          npm run --silent build-storybook

      - name: Run every Storybook story in shard ${{ matrix.shard }}/4
        run: node scripts/storybook-smoke-test.mjs --full --shard=${{ matrix.shard }}/4

  build-release-evidence:
    name: Build and verify exact release evidence(no publish authority)
    needs: [resolve-release-request, smoke-shard]
    runs-on: ubuntu-24.04
    env:
      # setup:playwright 以 PLAYWRIGHT_BROWSERS_PATH=0 安裝到 repo-local
      # node_modules/playwright-core/.local-browsers;消費步驟必須帶同一 pin,
      # 否則 playwright 落回 ~/.cache/ms-playwright 找不到瀏覽器(2026-07-28 CI 錨例)。
      PLAYWRIGHT_BROWSERS_PATH: '0'
    timeout-minutes: 330
    permissions:
      contents: read
    outputs:
      release_commit: ${{ steps.release-identity.outputs.commit }}
      release_tree: ${{ steps.release-identity.outputs.tree }}
      release_set_sha256: ${{ steps.release_set.outputs.sha256 }}
      actions_artifact_digest: ${{ steps.retain_evidence.outputs.artifact-digest }}
    steps:
      - name: Checkout exact protected release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.resolve-release-request.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch protected main ref
        env:
          PATH: /usr/bin:/bin
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

      - name: Resolve immutable release identity
        id: release-identity
        shell: bash
        env:
          PATH: /usr/bin:/bin
        run: |
          set -euo pipefail
          commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          tree="$(git rev-parse "${commit}^{tree}")"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"

      - name: Fail closed unless the tag is still current protected main
        shell: bash
        env:
          PATH: /usr/bin:/bin
        run: |
          set -euo pipefail
          test "${{ steps.release-identity.outputs.commit }}" = "$(git rev-parse refs/remotes/origin/main^{commit})"

      - name: Set up Node and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies with the lock-bound npm runtime
        run: |
          node scripts/setup-authority-governance.mjs --verify-runtime
          node scripts/setup-authority-governance.mjs --dependencies-only

      - name: Build publishable workspaces
        run: npm run --silent build:lib

      - name: Provision exact Playwright Chromium runtime for isolated Harnesses
        run: npm run --silent setup:playwright -- --with-deps

      # 同 ci.yml:harness member test-review-capability-selection 驗真實 provider CLI
      # runtime binding,缺 linux-x64 toolchain content 即 GOV-PROVIDER-CLI-TOOLCHAIN-001。
      - name: Provision provider CLI toolchain(lock-pinned hermetic;harness runtime-binding 驗證需要)
        run: npm run --silent setup:provider-cli

      - name: Deterministic governance and product gates
        run: |
          npm run --silent test:governance-harnesses
          npm run --silent audit:workflow-security
          npm run --silent governance:workflow-identities:check
          npx --no-install tsc -b
          npm run --silent typecheck:stories
          node scripts/audit-orphan-tokens.mjs --check
          node scripts/categorical-color-invariants.mjs
          node scripts/status-color-invariant.mjs
          node scripts/layout-space-utility-invariant.mjs
          node scripts/category-classification-invariant.mjs
          node scripts/gen-design-system-barrel.mjs --check
          node scripts/code-quality-audit.mjs --scope=packages/design-system/src/components --check
          node scripts/audit-content-quality.mjs --check
          node scripts/sync-governance-counters.mjs --check
          node scripts/gen-figma-make-artifacts.mjs --check
          node scripts/plugin-structure-validate.mjs
          npm run --silent story-quality:check
          node scripts/governance-build-graph.mjs --check
          node scripts/check-src-republish.mjs --check
          node scripts/sync-template-canonical-app.mjs --check
          node scripts/gen-llms-txt.mjs --check
          node scripts/check-field-cascade-resolve.mjs
          node scripts/audit-motion-delay-invariants.mjs
          node scripts/item-content-leading-coherence.mjs
          node scripts/checkbox-group-handcraft-invariant.mjs
          node scripts/layout-space-story-coherence.mjs
          node scripts/overlay-density-lock-placement.mjs
          ( cd apps/template && npm run build )

      - name: Fresh-consumer packaging dogfood
        run: node scripts/dogfood-prepublish-verify.mjs

      - name: Pack the release archives exactly once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          node scripts/run-verified-npm.mjs -- pack ./packages/design-system --pack-destination release-artifacts --json --ignore-scripts
          node scripts/run-verified-npm.mjs -- pack ./packages/storybook-config --pack-destination release-artifacts --json --ignore-scripts
          node scripts/run-verified-npm.mjs -- pack ./packages/governance --pack-destination release-artifacts --json --ignore-scripts

      - name: Generate deterministic release SBOM
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-verified-npm.mjs -- sbom --workspaces --package-lock-only --sbom-format=cyclonedx > "$RUNNER_TEMP/release.sbom.raw.json"
          # 確定性 serialNumber:actions/attest 的 CycloneDX 判定硬性要求 serialNumber
          # (attest src/sbom.ts checkIsCycloneDX),直接刪除會 Unsupported SBOM format;
          # 改為由 tag+tree 導出的 UUIDv5 —— 逐位確定、跨重跑穩定、可證明來源。
          sbom_serial="$(RELEASE_TREE='${{ needs.resolve-release-request.outputs.release_tree }}' node -p '
            const c = require("crypto");
            const h = c.createHash("sha1").update(`${process.env.RELEASE_TAG}:${process.env.RELEASE_TREE}`).digest();
            h[6] = (h[6] & 0x0f) | 0x50; h[8] = (h[8] & 0x3f) | 0x80;
            const x = h.subarray(0, 16).toString("hex");
            `urn:uuid:${x.slice(0,8)}-${x.slice(8,12)}-${x.slice(12,16)}-${x.slice(16,20)}-${x.slice(20,32)}`')"
          /usr/bin/jq --arg sn "$sbom_serial" '.serialNumber = $sn | del(.metadata.timestamp)' "$RUNNER_TEMP/release.sbom.raw.json" > release-artifacts/release.sbom.cdx.json

      - name: Lock every published product-template scaffold path and mode
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-published-template-mirror.mjs --out="$RUNNER_TEMP/release-product-template"
          node scripts/product-template-scaffold-lock.mjs \
            --root "$RUNNER_TEMP/release-product-template" \
            --output "$GITHUB_WORKSPACE/release-artifacts/product-template-scaffold.lock.json" \
            --version "${RELEASE_TAG#v}"

      - name: Build release BOM from the exact archives
        run: >-
          node scripts/build-release-bom.mjs
          --repo "$GITHUB_WORKSPACE"
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --output "$GITHUB_WORKSPACE/release-artifacts/release-bom.json"
          --tag "$RELEASE_TAG"
          --git-head "${{ steps.release-identity.outputs.commit }}"
          --git-tree "${{ steps.release-identity.outputs.tree }}"
          --repository "$GITHUB_REPOSITORY"
          --main-ref refs/remotes/origin/main
          --require-sbom
          --require-clean
          --require-release-ref
          --allow-repository-dispatch

      - name: Canonical read-only release verification
        run: >-
          npm run --silent release:verify --
          --repo "$GITHUB_WORKSPACE"
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --bom "$GITHUB_WORKSPACE/release-artifacts/release-bom.json"
          --tag "$RELEASE_TAG"
          --git-head "${{ steps.release-identity.outputs.commit }}"
          --git-tree "${{ steps.release-identity.outputs.tree }}"
          --repository "$GITHUB_REPOSITORY"
          --main-ref refs/remotes/origin/main
          --require-sbom
          --require-clean
          --require-release-ref
          --allow-repository-dispatch

      - name: Bind the exact six-file release set to a job output
        id: release_set
        run: >-
          node scripts/release-set.mjs
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --github-output "$GITHUB_OUTPUT"

      - name: Retain the exact release evidence
        id: retain_evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.event.client_payload.tag }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  attest-release:
    name: Attest exact release set(no npm or repository write authority)
    needs: [resolve-release-request, build-release-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact protected release commit without stored credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.resolve-release-request.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch protected main ref
        run: /usr/bin/git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

      - name: Set up verification-only Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          package-manager-cache: false

      - name: Download evidence produced by the unprivileged job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.event.client_payload.tag }}
          path: release-artifacts

      - name: Fail closed on artifact substitution
        run: >-
          node scripts/release-set.mjs
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --expected "${{ needs.build-release-evidence.outputs.release_set_sha256 }}"

      # build-release-bom --verify 載入 consumer-upgrade-protocol(ajv schema 驗證)
      # → 需要 lock-bound node_modules;缺裝依賴 = MODULE_NOT_FOUND(2026-07-28 發版錨例)。
      - name: Install the locked verification dependencies
        run: npm run --silent setup:dependencies

      - name: Re-verify exact BOM before attestation
        run: >-
          node scripts/build-release-bom.mjs --verify
          --repo "$GITHUB_WORKSPACE"
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --bom "$GITHUB_WORKSPACE/release-artifacts/release-bom.json"
          --tag "$RELEASE_TAG"
          --git-head "${{ needs.build-release-evidence.outputs.release_commit }}"
          --git-tree "${{ needs.build-release-evidence.outputs.release_tree }}"
          --repository "$GITHUB_REPOSITORY"
          --main-ref refs/remotes/origin/main
          --require-sbom
          --require-clean
          --require-release-ref
          --allow-repository-dispatch

      - name: Recheck remote tag through GitHub API immediately before attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release-remote-tag.mjs
          --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --expected "${{ needs.build-release-evidence.outputs.release_commit }}"
          --token-env GH_TOKEN

      - name: Attest release provenance
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            release-artifacts/*.tgz
            release-artifacts/release-bom.json
            release-artifacts/release.sbom.cdx.json
            release-artifacts/product-template-scaffold.lock.json

      - name: Recheck the same verified annotated tag immediately before SBOM attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release-remote-tag.mjs
          --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --expected "${{ needs.build-release-evidence.outputs.release_commit }}"
          --token-env GH_TOKEN

      - name: Attest release SBOM
        id: sbom-attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release-artifacts/*.tgz
          sbom-path: release-artifacts/release.sbom.cdx.json

  publish-npm:
    name: Publish npm packages(OIDC Trusted Publishing with provenance)
    needs: [resolve-release-request, build-release-evidence, attest-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact protected release commit without stored credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.resolve-release-request.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch protected main ref
        run: /usr/bin/git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

      - name: Set up publish Node and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify the committed npm runtime authority
        run: node scripts/setup-authority-governance.mjs --verify-runtime

      - name: Download exact release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.event.client_payload.tag }}
          path: release-artifacts

      - name: Fail closed on artifact substitution
        run: >-
          node scripts/release-set.mjs
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --expected "${{ needs.build-release-evidence.outputs.release_set_sha256 }}"

      # build-release-bom --verify 載入 consumer-upgrade-protocol(ajv schema 驗證)
      # → 需要 lock-bound node_modules;缺裝依賴 = MODULE_NOT_FOUND(2026-07-28 發版錨例)。
      - name: Install the locked verification dependencies
        run: npm run --silent setup:dependencies

      - name: Re-verify exact BOM before npm authority is used
        run: >-
          node scripts/build-release-bom.mjs --verify
          --repo "$GITHUB_WORKSPACE"
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --bom "$GITHUB_WORKSPACE/release-artifacts/release-bom.json"
          --tag "$RELEASE_TAG"
          --git-head "${{ needs.build-release-evidence.outputs.release_commit }}"
          --git-tree "${{ needs.build-release-evidence.outputs.release_tree }}"
          --repository "$GITHUB_REPOSITORY"
          --main-ref refs/remotes/origin/main
          --require-sbom
          --require-clean
          --require-release-ref
          --allow-repository-dispatch

      - name: Recheck remote tag through GitHub API immediately before staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release-remote-tag.mjs
          --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --expected "${{ needs.build-release-evidence.outputs.release_commit }}"
          --token-env GH_TOKEN

      - name: Publish each exact archive through npm Trusted Publishing with provenance
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=("$GITHUB_WORKSPACE"/release-artifacts/*.tgz)
          test "${#tarballs[@]}" -gt 0 || { echo "no release tarballs found"; exit 1; }
          # prerelease 必須顯式 --tag(npm 硬性要求;2026-07-28 attempt-6 錨例)。
          # 本專案歷史慣例 latest 與 beta 皆指最新 beta(npm view 實證 beta.84/93),照舊。
          # 冪等 rerun 合約(2026-07-29 attempt-7 錨例):npm 版本不可覆蓋發布,
          # 多包 loop 部分成功後的重跑必須能越過已發包,否則整個 release tag 永久卡死。
          # 已發版本只有位元組完全一致(registry integrity == 本地 tarball sha512)才 skip;
          # 同版不同位元組 = 外來 artifact,fail-closed。
          version="${RELEASE_TAG#v}"
          for tarball in "${tarballs[@]}"; do
            verdict="$(node scripts/release-published-integrity.mjs --tarball "$tarball" --version "$version")"
            if test "$verdict" = "identical"; then
              echo "skip ${tarball##*/}: already published with identical integrity"
              continue
            fi
            test "$verdict" = "absent" || { echo "unexpected integrity verdict: ${verdict}"; exit 1; }
            echo "publishing ${tarball##*/}"
            npm publish "$tarball" --provenance --access public --tag latest
          done

      - name: Read back the exact published versions from the registry
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for name in @qijenchen/design-system @qijenchen/storybook-config @qijenchen/governance; do
            observed="$(npm view "${name}@${version}" version)"
            test "$observed" = "$version" || {
              echo "registry readback failed for ${name}: observed '${observed}', expected '${version}'"
              exit 1
            }
            echo "registry readback OK: ${name}@${version}"
          done
          # beta channel 指標不在此變異:release 合約禁 workflow 內 dist-tag mutation
          # (test-release-bom L240;promotion 走獨立受治理 helper,含互動 session +
          # tag 重讀驗證)。publish --tag latest 是 npm 對 prerelease 的必要 publish
          # 參數,非事後 channel 變異;與歷史慣例(latest=最新 beta)一致。

  github-release:
    name: Publish the GitHub Release for the exact tag
    needs: [resolve-release-request, build-release-evidence, publish-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download exact release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.event.client_payload.tag }}
          path: release-artifacts

      - name: Create the GitHub Release bound to the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes "Exact release set SHA-256: ${{ needs.build-release-evidence.outputs.release_set_sha256 }} (commit ${{ needs.resolve-release-request.outputs.release_commit }})" \
            release-artifacts/*.tgz \
            release-artifacts/release-bom.json \
            release-artifacts/release.sbom.cdx.json
