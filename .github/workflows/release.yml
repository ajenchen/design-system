name: Release

# The privileged workflow is always loaded from protected default. The dispatch tag is
# untrusted data until it is proven to be the exact current protected-main HEAD.
on:
  repository_dispatch:
    # Keep the existing dispatch contract; the implementation now publishes directly.
    types: [stage-protected-release]

permissions: {}

concurrency:
  group: ${{ github.repository }}-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.client_payload.tag }}
  RELEASE_DISPATCH_TAG: ${{ github.event.client_payload.tag }}

jobs:
  resolve-release-request:
    name: Bind release tag to current protected main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      release_commit: ${{ steps.identity.outputs.commit }}
      release_tree: ${{ steps.identity.outputs.tree }}
    steps:
      - name: Checkout protected default workflow source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact tag and reject stale or off-main dispatch
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|next|rc)\.[0-9]+)?$ ]] || {
            echo "release dispatch requires vX.Y.Z or vX.Y.Z-(beta|next|rc).N"
            exit 1
          }
          /usr/bin/git fetch --force --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          /usr/bin/git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          main_commit="$(/usr/bin/git rev-parse refs/remotes/origin/main^{commit})"
          event_commit="$(/usr/bin/git rev-parse "$GITHUB_SHA^{commit}")"
          tag_commit="$(/usr/bin/git rev-parse "refs/tags/$tag^{commit}")"
          test "$event_commit" = "$main_commit" || {
            echo "stale dispatch workflow source: event $event_commit, current main $main_commit"
            exit 1
          }
          test "$tag_commit" = "$main_commit" || {
            echo "release tag $tag points to $tag_commit, not current protected main $main_commit"
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "tree=$(/usr/bin/git rev-parse "$tag_commit^{tree}")" >> "$GITHUB_OUTPUT"

  build-and-publish-npm:
    name: Build once and publish exact npm packages with provenance
    needs: resolve-release-request
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: npm-release
    permissions:
      contents: read
      id-token: write
    outputs:
      release_set_sha256: ${{ steps.release_set.outputs.sha256 }}
    steps:
      - name: Checkout exact protected release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.resolve-release-request.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact main and tag identities
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/git fetch --force --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          /usr/bin/git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(/usr/bin/git rev-parse HEAD^{commit})" = "${{ needs.resolve-release-request.outputs.release_commit }}"
          test "$(/usr/bin/git rev-parse refs/remotes/origin/main^{commit})" = "${{ needs.resolve-release-request.outputs.release_commit }}"
          test "$(/usr/bin/git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "${{ needs.resolve-release-request.outputs.release_commit }}"

      - name: Set up Node and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install locked dependencies once
        run: npm run --silent setup:dependencies

      - name: Build and typecheck publishable workspaces once
        run: |
          npm run --silent build:lib
          npx --no-install tsc -b

      - name: Pack the exact three-package release train
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          node scripts/run-verified-npm.mjs -- pack ./packages/design-system --pack-destination release-artifacts --json --ignore-scripts
          node scripts/run-verified-npm.mjs -- pack ./packages/storybook-config --pack-destination release-artifacts --json --ignore-scripts
          node scripts/run-verified-npm.mjs -- pack ./packages/governance --pack-destination release-artifacts --json --ignore-scripts

      - name: Generate deterministic release SBOM
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-verified-npm.mjs -- sbom --workspaces --package-lock-only --sbom-format=cyclonedx > "$RUNNER_TEMP/release.sbom.raw.json"
          node scripts/release-sbom.mjs \
            --input "$RUNNER_TEMP/release.sbom.raw.json" \
            --output "$GITHUB_WORKSPACE/release-artifacts/release.sbom.cdx.json" \
            --tag "$RELEASE_TAG" \
            --git-tree "${{ needs.resolve-release-request.outputs.release_tree }}"

      - name: Build product-template scaffold lock
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-published-template-mirror.mjs --out="$RUNNER_TEMP/release-product-template"
          node scripts/product-template-scaffold-lock.mjs \
            --root "$RUNNER_TEMP/release-product-template" \
            --output "$GITHUB_WORKSPACE/release-artifacts/product-template-scaffold.lock.json" \
            --version "${RELEASE_TAG#v}"

      - name: Build and verify the release BOM
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-release-bom.mjs \
            --repo "$GITHUB_WORKSPACE" \
            --artifacts "$GITHUB_WORKSPACE/release-artifacts" \
            --output "$GITHUB_WORKSPACE/release-artifacts/release-bom.json" \
            --tag "$RELEASE_TAG" \
            --git-head "${{ needs.resolve-release-request.outputs.release_commit }}" \
            --git-tree "${{ needs.resolve-release-request.outputs.release_tree }}" \
            --repository "$GITHUB_REPOSITORY" \
            --main-ref refs/remotes/origin/main \
            --require-sbom \
            --require-clean \
            --require-release-ref \
            --allow-repository-dispatch
          node scripts/build-release-bom.mjs --verify \
            --repo "$GITHUB_WORKSPACE" \
            --artifacts "$GITHUB_WORKSPACE/release-artifacts" \
            --bom "$GITHUB_WORKSPACE/release-artifacts/release-bom.json" \
            --tag "$RELEASE_TAG" \
            --git-head "${{ needs.resolve-release-request.outputs.release_commit }}" \
            --git-tree "${{ needs.resolve-release-request.outputs.release_tree }}" \
            --repository "$GITHUB_REPOSITORY" \
            --main-ref refs/remotes/origin/main \
            --require-sbom \
            --require-clean \
            --require-release-ref \
            --allow-repository-dispatch

      - name: Bind the exact six-file release set
        id: release_set
        run: >-
          node scripts/release-set.mjs
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish through npm Trusted Publishing and verify registry provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release-npm-publish.mjs
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --bom "$GITHUB_WORKSPACE/release-artifacts/release-bom.json"
          --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --git-head "${{ needs.resolve-release-request.outputs.release_commit }}"
          --github-token-env GH_TOKEN

      - name: Retain exact release assets for the contents-only writer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-github-release:
    name: Publish and read back exact GitHub Release assets
    needs: [resolve-release-request, build-and-publish-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact release commit without stored credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.resolve-release-request.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up verification-only Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          package-manager-cache: false

      - name: Download exact release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts

      - name: Reject artifact substitution
        run: >-
          node scripts/release-set.mjs
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --expected "${{ needs.build-and-publish-npm.outputs.release_set_sha256 }}"

      - name: Create, publish, and verify exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release-github-release.mjs
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --repository "$GITHUB_REPOSITORY"
          --tag "${{ needs.resolve-release-request.outputs.tag }}"
          --git-head "${{ needs.resolve-release-request.outputs.release_commit }}"
