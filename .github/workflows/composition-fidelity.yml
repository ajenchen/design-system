name: Composition Fidelity (DS canonical vs product pilot)

# The product pilot lives in apps/template and is built from the same reviewed
# commit as the DS. This avoids executing mutable code from another repository
# in a privileged DS workflow and validates changes before they are mirrored.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  composition-fidelity:
    name: Composition Fidelity Diff
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Install and audit with the lock-verified npm runtime
        run: npm run --silent setup:dependencies

      - name: Install Playwright Chromium explicitly
        run: npm run --silent setup:playwright -- --with-deps

      - name: Require at least one non-vacuous fidelity mapping
        run: |
          if ! grep -R -E --include='*.tsx' --include='*.ts' \
            '@composition-fidelity-mode:[[:space:]]*(pixel|shell-only|structural)' apps/template/src; then
            echo '❌ product pilot has no composition-fidelity mapping; refusing a vacuous required check.'
            exit 1
          fi

      - name: Build DS library and shared Storybook configuration
        run: npm run build:lib

      - name: Build canonical and product-pilot stories from this commit
        run: npm run build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Compare product pilot with DS canonical
        run: |
          node scripts/composition-fidelity-visual-diff.mjs \
            --ds-static=storybook-static \
            --consumer-static=storybook-static \
            --consumer-root=apps/template \
            --require-mappings \
            --threshold-pct=0.5

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: composition-fidelity-artifacts
          path: |
            .git/governance-runtime/evidence/visual/composition-fidelity/baseline/
            .git/governance-runtime/evidence/visual/composition-fidelity/consumer/
            .git/governance-runtime/evidence/visual/composition-fidelity/diff/
            .git/governance-runtime/evidence/visual/composition-fidelity/report.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
