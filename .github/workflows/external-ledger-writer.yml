name: Apply reviewed external-ledger handoff

# repository_dispatch is loaded only from the protected default branch. The
# compressed client_payload is untrusted reviewed data until the credential-free
# job reconstructs and revalidates its exact handoff/base/ledger identities.
on:
  repository_dispatch:
    types: [external-ledger-write-request]

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.repository }}-external-ledger-writer
  cancel-in-progress: false

jobs:
  certify-handoff:
    name: Certify reviewed handoff(no write authority)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      protected_sha: ${{ steps.protected.outputs.sha }}
      protected_tree: ${{ steps.protected.outputs.tree }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout exact protected-default workflow source without stored credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reprove live protected main commit and tree
        id: protected
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          sha=$(/usr/bin/git rev-parse HEAD^{commit})
          tree=$(/usr/bin/git rev-parse HEAD^{tree})
          test "$sha" = "$GITHUB_SHA"
          test "$sha" = "$(/usr/bin/git rev-parse refs/remotes/origin/main^{commit})"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Set up protected verifier runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          package-manager-cache: false

      - name: Install protected verifier dependencies without candidate execution
        run: node scripts/setup-authority-governance.mjs --dependencies-only

      - name: Validate handoff signatures expiry base ledger and deterministic PR plan
        run: >-
          node infra/governance/bin/external-ledger-writer.mjs verify-dispatch
          --event "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --head-sha "${{ steps.protected.outputs.sha }}"
          --output-dir "$RUNNER_TEMP/external-ledger-artifact"

      - name: Upload exact credential-free handoff artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: external-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-ledger-artifact
          if-no-files-found: error
          retention-days: 1
          overwrite: false
          include-hidden-files: false

  write-ledger-pr:
    name: Open one protected Writer App PR
    if: needs.certify-handoff.result == 'success'
    needs: certify-handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: governance-external-ledger
    permissions:
      actions: read
      contents: read
    outputs:
      receipt_artifact_id: ${{ steps.upload-receipt.outputs.artifact-id }}
      receipt_artifact_digest: ${{ steps.upload-receipt.outputs.artifact-digest }}
    steps:
      - name: Checkout the same protected-default source without stored credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.certify-handoff.outputs.protected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reprove protected main before reading the same-run artifact
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(/usr/bin/git rev-parse HEAD^{commit})" = "${{ needs.certify-handoff.outputs.protected_sha }}"
          test "$(/usr/bin/git rev-parse HEAD^{tree})" = "${{ needs.certify-handoff.outputs.protected_tree }}"
          test "$(/usr/bin/git rev-parse refs/remotes/origin/main^{commit})" = "${{ needs.certify-handoff.outputs.protected_sha }}"

      - name: Set up protected writer verifier runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          package-manager-cache: false

      - name: Install protected verifier dependencies without candidate execution
        run: node scripts/setup-authority-governance.mjs --dependencies-only

      - name: Resolve exact same-run workflow and artifact identity without credentials
        run: >-
          node infra/governance/bin/external-ledger-writer.mjs verify-run-artifact
          --repository "$GITHUB_REPOSITORY"
          --head-sha "${{ needs.certify-handoff.outputs.protected_sha }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --artifact-id "${{ needs.certify-handoff.outputs.artifact_id }}"
          --artifact-digest "${{ needs.certify-handoff.outputs.artifact_digest }}"
          --output "$RUNNER_TEMP/external-ledger-artifact-identity.json"

      - name: Independently reconstruct the canonical artifact from protected source and event
        run: >-
          node infra/governance/bin/external-ledger-writer.mjs verify-dispatch
          --event "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --head-sha "${{ needs.certify-handoff.outputs.protected_sha }}"
          --output-dir "$RUNNER_TEMP/external-ledger-artifact"

      - name: Revalidate artifact bytes handoff plan expiry and live base before credentials
        run: >-
          node infra/governance/bin/external-ledger-writer.mjs verify-artifact
          --event "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --head-sha "${{ needs.certify-handoff.outputs.protected_sha }}"
          --artifact-dir "$RUNNER_TEMP/external-ledger-artifact"

      - name: Mint exact selected-repository Governance Writer App token
        id: writer-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.GOVERNANCE_WRITER_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or reuse exact one-parent branch and Writer App PR then read back all identities
        env:
          GOVERNANCE_WRITER_APP_TOKEN: ${{ steps.writer-token.outputs.token }}
          GOVERNANCE_WRITER_APP_ID: ${{ secrets.GOVERNANCE_WRITER_APP_ID }}
        run: >-
          node infra/governance/bin/external-ledger-writer.mjs write-pr
          --repository "$GITHUB_REPOSITORY"
          --head-sha "${{ needs.certify-handoff.outputs.protected_sha }}"
          --artifact-dir "$RUNNER_TEMP/external-ledger-artifact"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --artifact-id "${{ needs.certify-handoff.outputs.artifact_id }}"
          --artifact-digest "${{ needs.certify-handoff.outputs.artifact_digest }}"
          --artifact-identity "$RUNNER_TEMP/external-ledger-artifact-identity.json"
          --token-env GOVERNANCE_WRITER_APP_TOKEN
          --app-id-env GOVERNANCE_WRITER_APP_ID
          --app-slug "${{ steps.writer-token.outputs.app-slug }}"
          --installation-id "${{ steps.writer-token.outputs.installation-id }}"
          --action-sha fee1f7d63c2ff003460e3d139729b119787bc349
          --output "$RUNNER_TEMP/external-ledger-writer-receipt.json"

      - name: Upload exact PR identity readback receipt
        id: upload-receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: external-ledger-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-ledger-writer-receipt.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
