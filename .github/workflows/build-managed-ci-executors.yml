          BUNDLE_PATH: ${{ steps.sbom.outputs.bundle-path }}
          EXECUTION_CLASS: ${{ matrix.execution-class }}
        run: |
          set -euo pipefail
          test -f "$BUNDLE_PATH"
          install -m 0400 "$BUNDLE_PATH" "$RUNNER_TEMP/managed-ci-sbom-$EXECUTION_CLASS.sigstore.json"

