          INVENTORY_SHA256: ${{ steps.image.outputs.inventory_sha256 }}
          MANIFEST_SHA256: ${{ steps.image.outputs.manifest_sha256 }}
          PROVENANCE_ATTESTATION_ID: ${{ steps.provenance.outputs.attestation-id }}
          PROVENANCE_ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
          SBOM_ATTESTATION_ID: ${{ steps.sbom.outputs.attestation-id }}
          SBOM_ATTESTATION_URL: ${{ steps.sbom.outputs.attestation-url }}
          SBOM_DIGEST: ${{ steps.image.outputs.sbom_digest }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_TREE: ${{ steps.image.outputs.source_tree }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          PROVENANCE_BUNDLE="$RUNNER_TEMP/managed-ci-provenance-$EXECUTION_CLASS.sigstore.json"
          SBOM_BUNDLE="$RUNNER_TEMP/managed-ci-sbom-$EXECUTION_CLASS.sigstore.json"
          HANDOFF_BUNDLE="$RUNNER_TEMP/managed-ci-handoff-$EXECUTION_CLASS.sigstore.json"
          PROVENANCE_PREDICATE="$RUNNER_TEMP/managed-ci-provenance-$EXECUTION_CLASS.json"
          SBOM_PREDICATE="$RUNNER_TEMP/managed-ci-image-set/sboms/$EXECUTION_CLASS.cdx.json"
          HANDOFF_PREDICATE="$RUNNER_TEMP/managed-ci-image-handoff-$EXECUTION_CLASS.json"
          BINDING="$RUNNER_TEMP/managed-ci-image-set/bindings/$EXECUTION_CLASS.json"
          CONTEXT_ARCHIVE="$RUNNER_TEMP/managed-ci-image-set/contexts/$EXECUTION_CLASS.tar"
          INVENTORY="$RUNNER_TEMP/managed-ci-image-set/inventory.json"
          MANIFEST="$RUNNER_TEMP/managed-ci-image-set/manifest.json"
          PREIMAGE="$RUNNER_TEMP/managed-ci-image-set/manifest.preimage.json"
          RUNTIME_FILES="$RUNNER_TEMP/managed-ci-image-set/runtime-files/$EXECUTION_CLASS.json"
          EVIDENCE_SET="$RUNNER_TEMP/managed-ci-evidence-set-$EXECUTION_CLASS.json"
          test -f "$HANDOFF_BUNDLE_PATH"
          install -m 0400 "$HANDOFF_BUNDLE_PATH" "$HANDOFF_BUNDLE"
          for path in \
            "$PROVENANCE_BUNDLE" \
            "$SBOM_BUNDLE" \
            "$HANDOFF_BUNDLE" \
            "$PROVENANCE_PREDICATE" \
            "$SBOM_PREDICATE" \
            "$HANDOFF_PREDICATE" \
            "$BINDING" \
            "$CONTEXT_ARCHIVE" \
            "$INVENTORY" \
            "$MANIFEST" \
            "$PREIMAGE" \
            "$RUNTIME_FILES"
          do
            test -s "$path"
          done
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$INVENTORY_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$SBOM_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          case "$EXECUTION_CLASS" in
            dependency-acquisition|deterministic-hook-audit|model-broker|github-observer) ;;
            *) exit 1 ;;
          esac
          test "$WORKFLOW_REPOSITORY" = "ajenchen/design-system"
          test "$WORKFLOW_REF" = "ajenchen/design-system/.github/workflows/build-managed-ci-executors.yml@refs/heads/main"
          test "$WORKFLOW_SHA" = "$SOURCE_COMMIT"
          test "$(sha256sum "$INVENTORY" | cut -d' ' -f1)" = "$INVENTORY_SHA256"
          test "$(sha256sum "$MANIFEST" | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          PREIMAGE_SHA256="$(sha256sum "$PREIMAGE" | cut -d' ' -f1)"
          BINDING_SHA256="$(sha256sum "$BINDING" | cut -d' ' -f1)"
          CONTEXT_ARCHIVE_SHA256="$(sha256sum "$CONTEXT_ARCHIVE" | cut -d' ' -f1)"
          RUNTIME_FILES_SHA256="$(sha256sum "$RUNTIME_FILES" | cut -d' ' -f1)"
          NODE_BINARY_SHA256="$(jq -er '.node.sha256' "$RUNTIME_FILES")"
          RUNTIME_SOURCE_SHA256="$(jq -er '.runtimeSourceSha256' "$RUNTIME_FILES")"
          for digest in \
            "$PREIMAGE_SHA256" \
            "$BINDING_SHA256" \
            "$CONTEXT_ARCHIVE_SHA256" \
            "$RUNTIME_FILES_SHA256" \
            "$NODE_BINARY_SHA256" \
            "$RUNTIME_SOURCE_SHA256"
          do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          done
          for kind in PROVENANCE SBOM HANDOFF; do
            id_var="${kind}_ATTESTATION_ID"
            url_var="${kind}_ATTESTATION_URL"
            id="${!id_var}"
            url="${!url_var}"
            [[ "$id" =~ ^[1-9][0-9]*$ ]]
            test "$url" = "https://github.com/$GITHUB_REPOSITORY/attestations/$id"
          done
          PROVENANCE_BUNDLE_SHA256="$(sha256sum "$PROVENANCE_BUNDLE" | cut -d' ' -f1)"
          SBOM_BUNDLE_SHA256="$(sha256sum "$SBOM_BUNDLE" | cut -d' ' -f1)"
          HANDOFF_BUNDLE_SHA256="$(sha256sum "$HANDOFF_BUNDLE" | cut -d' ' -f1)"
          PROVENANCE_PREDICATE_SHA256="$(sha256sum "$PROVENANCE_PREDICATE" | cut -d' ' -f1)"
          HANDOFF_PREDICATE_SHA256="$(sha256sum "$HANDOFF_PREDICATE" | cut -d' ' -f1)"
          test "$(sha256sum "$SBOM_PREDICATE" | cut -d' ' -f1)" = "$SBOM_DIGEST"
          PROVENANCE_BUNDLE_SIZE="$(stat --format='%s' "$PROVENANCE_BUNDLE")"
          SBOM_BUNDLE_SIZE="$(stat --format='%s' "$SBOM_BUNDLE")"
          HANDOFF_BUNDLE_SIZE="$(stat --format='%s' "$HANDOFF_BUNDLE")"
          jq -nS \
            --arg artifactDigest "$ARTIFACT_DIGEST" \
            --arg artifactId "$ARTIFACT_ID" \
            --arg bindingSha256 "$BINDING_SHA256" \
            --arg contextArchiveSha256 "$CONTEXT_ARCHIVE_SHA256" \
            --arg executionClass "$EXECUTION_CLASS" \
            --arg handoffAttestationId "$HANDOFF_ATTESTATION_ID" \
            --arg handoffAttestationUrl "$HANDOFF_ATTESTATION_URL" \
            --arg handoffBundleSha256 "$HANDOFF_BUNDLE_SHA256" \
            --arg handoffBundleSize "$HANDOFF_BUNDLE_SIZE" \
            --arg handoffPredicateSha256 "$HANDOFF_PREDICATE_SHA256" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg imageSubject "$IMAGE_SUBJECT" \
            --arg inventorySha256 "$INVENTORY_SHA256" \
            --arg manifestSha256 "$MANIFEST_SHA256" \
            --arg nodeBinarySha256 "$NODE_BINARY_SHA256" \
            --arg preimageSha256 "$PREIMAGE_SHA256" \
            --arg provenanceAttestationId "$PROVENANCE_ATTESTATION_ID" \
            --arg provenanceAttestationUrl "$PROVENANCE_ATTESTATION_URL" \
            --arg provenanceBundleSha256 "$PROVENANCE_BUNDLE_SHA256" \
            --arg provenanceBundleSize "$PROVENANCE_BUNDLE_SIZE" \
            --arg provenancePredicateSha256 "$PROVENANCE_PREDICATE_SHA256" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg runtimeFilesSha256 "$RUNTIME_FILES_SHA256" \
            --arg runtimeSourceSha256 "$RUNTIME_SOURCE_SHA256" \
            --arg runAttempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg runId "$WORKFLOW_RUN_ID" \
            --arg sbomAttestationId "$SBOM_ATTESTATION_ID" \
            --arg sbomAttestationUrl "$SBOM_ATTESTATION_URL" \
            --arg sbomBundleSha256 "$SBOM_BUNDLE_SHA256" \
            --arg sbomBundleSize "$SBOM_BUNDLE_SIZE" \
            --arg sbomPredicateSha256 "$SBOM_DIGEST" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceTree "$SOURCE_TREE" \
            --arg workflowPath ".github/workflows/build-managed-ci-executors.yml" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg workflowRepository "$WORKFLOW_REPOSITORY" \
            --arg workflowSha "$WORKFLOW_SHA" \
            '{
              attestations: {
                handoff: {
                  attestationId: $handoffAttestationId,
                  attestationUrl: $handoffAttestationUrl,
                  bundleSha256: $handoffBundleSha256,
                  bundleSize: ($handoffBundleSize | tonumber),
                  predicateSha256: $handoffPredicateSha256,
                  predicateType: "https://qijenchen.dev/attestations/managed-ci-image-handoff/v2"
                },
                provenance: {
                  attestationId: $provenanceAttestationId,
                  attestationUrl: $provenanceAttestationUrl,
                  bundleSha256: $provenanceBundleSha256,
                  bundleSize: ($provenanceBundleSize | tonumber),
                  predicateSha256: $provenancePredicateSha256,
                  predicateType: "https://slsa.dev/provenance/v1"
                },
                sbom: {
                  attestationId: $sbomAttestationId,
                  attestationUrl: $sbomAttestationUrl,
                  bundleSha256: $sbomBundleSha256,
                  bundleSize: ($sbomBundleSize | tonumber),
                  predicateSha256: $sbomPredicateSha256,
                  predicateType: "https://cyclonedx.org/bom"
                }
              },
              executionClass: $executionClass,
              handoff: {
                artifactDigest: {sha256: $artifactDigest},
                artifactId: $artifactId,
                manifestSha256: $manifestSha256,
                preimageSha256: $preimageSha256,
                inventorySha256: $inventorySha256,
                classBindingSha256: $bindingSha256,
                classContextArchiveSha256: $contextArchiveSha256
              },
              image: {
                digest: $imageDigest,
                subject: $imageSubject,
                runtime: {
                  nodeVersion: "24.14.0",
                  nodeBinarySha256: $nodeBinarySha256,
                  managedRuntimeSourceSha256: $runtimeSourceSha256,
                  runtimeFilesSha256: $runtimeFilesSha256
                }
              },
              kind: "managed-ci-image-evidence-set-v2",
              schemaVersion: 2,
              source: {
                commit: $sourceCommit,
                repository: $repository,
                tree: $sourceTree
              },
              storage: {
                kind: "github-actions-artifact-operational-handoff",
                retentionDays: 90,
                externalWorm: false
              },
              workflow: {
                repository: $workflowRepository,
                path: $workflowPath,
                ref: $workflowRef,
                sha: $workflowSha,
                runAttempt: $runAttempt,
                runId: $runId
              }
            }' > "$EVIDENCE_SET"
          jq -e \
            --arg artifactDigest "$ARTIFACT_DIGEST" \
            --arg artifactId "$ARTIFACT_ID" \
            --arg bindingSha256 "$BINDING_SHA256" \
            --arg contextArchiveSha256 "$CONTEXT_ARCHIVE_SHA256" \
            --arg executionClass "$EXECUTION_CLASS" \
            --arg handoffAttestationId "$HANDOFF_ATTESTATION_ID" \
            --arg handoffAttestationUrl "$HANDOFF_ATTESTATION_URL" \
            --arg handoffBundleSha256 "$HANDOFF_BUNDLE_SHA256" \
            --arg handoffPredicateSha256 "$HANDOFF_PREDICATE_SHA256" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg imageSubject "$IMAGE_SUBJECT" \
            --arg inventorySha256 "$INVENTORY_SHA256" \
            --arg manifestSha256 "$MANIFEST_SHA256" \
            --arg nodeBinarySha256 "$NODE_BINARY_SHA256" \
            --arg preimageSha256 "$PREIMAGE_SHA256" \
            --arg provenanceAttestationId "$PROVENANCE_ATTESTATION_ID" \
            --arg provenanceAttestationUrl "$PROVENANCE_ATTESTATION_URL" \
            --arg provenanceBundleSha256 "$PROVENANCE_BUNDLE_SHA256" \
            --arg provenancePredicateSha256 "$PROVENANCE_PREDICATE_SHA256" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg runtimeFilesSha256 "$RUNTIME_FILES_SHA256" \
            --arg runtimeSourceSha256 "$RUNTIME_SOURCE_SHA256" \
            --arg runAttempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg runId "$WORKFLOW_RUN_ID" \
            --arg sbomAttestationId "$SBOM_ATTESTATION_ID" \
            --arg sbomAttestationUrl "$SBOM_ATTESTATION_URL" \
            --arg sbomBundleSha256 "$SBOM_BUNDLE_SHA256" \
            --arg sbomPredicateSha256 "$SBOM_DIGEST" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceTree "$SOURCE_TREE" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg workflowRepository "$WORKFLOW_REPOSITORY" \
            --arg workflowSha "$WORKFLOW_SHA" \
            'keys == ["attestations","executionClass","handoff","image","kind","schemaVersion","source","storage","workflow"]
              and .schemaVersion == 2
              and .kind == "managed-ci-image-evidence-set-v2"
              and .executionClass == $executionClass
              and .image == {
                digest: $imageDigest,
                subject: $imageSubject,
                runtime: {
                  nodeVersion: "24.14.0",
                  nodeBinarySha256: $nodeBinarySha256,
                  managedRuntimeSourceSha256: $runtimeSourceSha256,
                  runtimeFilesSha256: $runtimeFilesSha256
                }
              }
              and .source == {commit: $sourceCommit, repository: $repository, tree: $sourceTree}
              and .storage == {
                kind: "github-actions-artifact-operational-handoff",
                retentionDays: 90,
                externalWorm: false
              }
              and .workflow == {
                repository: $workflowRepository,
                path: ".github/workflows/build-managed-ci-executors.yml",
                ref: $workflowRef,
                sha: $workflowSha,
                runAttempt: $runAttempt,
                runId: $runId
              }
              and .handoff == {
                artifactDigest: {sha256: $artifactDigest},
                artifactId: $artifactId,
                manifestSha256: $manifestSha256,
                preimageSha256: $preimageSha256,
                inventorySha256: $inventorySha256,
                classBindingSha256: $bindingSha256,
                classContextArchiveSha256: $contextArchiveSha256
              }
              and (.attestations | keys == ["handoff","provenance","sbom"])
              and .attestations.provenance.attestationId == $provenanceAttestationId
              and .attestations.provenance.attestationUrl == $provenanceAttestationUrl
              and .attestations.provenance.bundleSha256 == $provenanceBundleSha256
              and .attestations.provenance.predicateSha256 == $provenancePredicateSha256
              and .attestations.provenance.predicateType == "https://slsa.dev/provenance/v1"
              and .attestations.sbom.attestationId == $sbomAttestationId
              and .attestations.sbom.attestationUrl == $sbomAttestationUrl
              and .attestations.sbom.bundleSha256 == $sbomBundleSha256
              and .attestations.sbom.predicateSha256 == $sbomPredicateSha256
              and .attestations.sbom.predicateType == "https://cyclonedx.org/bom"
              and .attestations.handoff.attestationId == $handoffAttestationId
              and .attestations.handoff.attestationUrl == $handoffAttestationUrl
              and .attestations.handoff.bundleSha256 == $handoffBundleSha256
              and .attestations.handoff.predicateSha256 == $handoffPredicateSha256
              and .attestations.handoff.predicateType == "https://qijenchen.dev/attestations/managed-ci-image-handoff/v2"
              and ([.attestations[].attestationId] | all(type == "string" and test("^[1-9][0-9]*$")))
              and ([.attestations[].attestationUrl] | all(type == "string" and test("^https://github[.]com/[^/]+/[^/]+/attestations/[1-9][0-9]*$")))
              and ([.attestations[].bundleSha256, .attestations[].predicateSha256]
                | all(type == "string" and test("^[a-f0-9]{64}$")))
              and ([.attestations[].bundleSize] | all(type == "number" and . > 0))' \
            "$EVIDENCE_SET" >/dev/null
          chmod 0400 "$EVIDENCE_SET"

      - name: Upload the exact offline evidence as a non-WORM GitHub handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: managed-ci-image-attestations-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.execution-class }}
          path: |
            ${{ runner.temp }}/managed-ci-provenance-${{ matrix.execution-class }}.sigstore.json
            ${{ runner.temp }}/managed-ci-sbom-${{ matrix.execution-class }}.sigstore.json
            ${{ runner.temp }}/managed-ci-handoff-${{ matrix.execution-class }}.sigstore.json
            ${{ runner.temp }}/managed-ci-provenance-${{ matrix.execution-class }}.json
            ${{ runner.temp }}/managed-ci-image-handoff-${{ matrix.execution-class }}.json
            ${{ runner.temp }}/managed-ci-image-set/bindings/${{ matrix.execution-class }}.json
            ${{ runner.temp }}/managed-ci-image-set/contexts/${{ matrix.execution-class }}.tar
            ${{ runner.temp }}/managed-ci-image-set/inventory.json
            ${{ runner.temp }}/managed-ci-image-set/manifest.json
            ${{ runner.temp }}/managed-ci-image-set/manifest.preimage.json
            ${{ runner.temp }}/managed-ci-image-set/runtime-files/${{ matrix.execution-class }}.json
            ${{ runner.temp }}/managed-ci-image-set/sboms/${{ matrix.execution-class }}.cdx.json
            ${{ runner.temp }}/managed-ci-evidence-set-${{ matrix.execution-class }}.json
          if-no-files-found: error
          # Operational GitHub retention only; external WORM activation remains separate.
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
