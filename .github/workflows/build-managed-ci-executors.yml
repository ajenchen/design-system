name: Build managed CI executors

on:
  # Privileged builder code must be loaded from the default branch; workflow_dispatch
  # is branch-selectable even when the job later checks github.ref.
  repository_dispatch:
    types: [build-managed-ci-executors-request]

permissions: {}

concurrency:
  group: build-managed-ci-executors-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        execution-class:
          - dependency-acquisition
          - deterministic-hook-audit
          - model-broker
          - github-observer
    steps:
      - name: Bind DOCKER_CONFIG to the runner-scoped temp directory
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP"
          printf 'DOCKER_CONFIG=%s/managed-ci-docker-config\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout exact protected-main builder source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          submodules: false
          clean: true

      - name: Fail closed unless the observed workflow and source identities are exact
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_REPOSITORY" = "ajenchen/design-system"
          test "$WORKFLOW_REF" = "ajenchen/design-system/.github/workflows/build-managed-ci-executors.yml@refs/heads/main"
          test "$WORKFLOW_SHA" = "$SOURCE_COMMIT"
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_COMMIT"
          test "$(git cat-file -t "$WORKFLOW_SHA:.github/workflows/build-managed-ci-executors.yml")" = "blob"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize the exact Buildx binary before any execution
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          DOWNLOAD_ROOT="$RUNNER_TEMP/managed-ci-buildx-download"
          install -d -m 0700 "$DOWNLOAD_ROOT" "$DOCKER_CONFIG" "$DOCKER_CONFIG/cli-plugins"
          printf '{"auths":{}}\n' > "$DOCKER_CONFIG/config.json"
          chmod 0600 "$DOCKER_CONFIG/config.json"
          jq -e 'keys == ["auths"] and .auths == {}' "$DOCKER_CONFIG/config.json" >/dev/null
          BUILDX_DOWNLOAD="$DOWNLOAD_ROOT/docker-buildx"
          /usr/bin/env -i \
            HOME="$DOWNLOAD_ROOT" \
            PATH="/usr/bin:/bin" \
            /usr/bin/curl \
              --fail \
              --location \
              --max-redirs 3 \
              --max-filesize 67108864 \
              --proto '=https' \
              --proto-redir '=https' \
              --show-error \
              --silent \
              --tlsv1.2 \
              --output "$BUILDX_DOWNLOAD" \
              "https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.linux-amd64"
          test -f "$BUILDX_DOWNLOAD"
          test ! -L "$BUILDX_DOWNLOAD"
          test "$(stat -c '%s' "$BUILDX_DOWNLOAD")" -gt 0
          test "$(stat -c '%s' "$BUILDX_DOWNLOAD")" -le 67108864
          test "$(sha256sum "$BUILDX_DOWNLOAD" | cut -d' ' -f1)" = "d41ece72044243b4f58b343441ae37446d9c29a7d6b5e11c61847bbcf8f7dfda"
          install -m 0555 "$BUILDX_DOWNLOAD" "$DOCKER_CONFIG/cli-plugins/docker-buildx"
          test "$(sha256sum "$DOCKER_CONFIG/cli-plugins/docker-buildx" | cut -d' ' -f1)" = "d41ece72044243b4f58b343441ae37446d9c29a7d6b5e11c61847bbcf8f7dfda"

      - name: Set up exact BuildKit from the preverified Buildx plugin
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
          buildkitd-flags: --debug=false
          install: false
          use: true
          keep-state: false
          cache-binary: false
          cleanup: true

      - name: Verify the exact Buildx binary and BuildKit daemon
        env:
          BUILDX_DRIVER: ${{ steps.buildx.outputs.driver }}
          BUILDX_NODES: ${{ steps.buildx.outputs.nodes }}
          BUILDKITD_FLAGS: ${{ steps.buildx.outputs.flags }}
        run: |
          set -euo pipefail
          BUILDX_BINARY="$DOCKER_CONFIG/cli-plugins/docker-buildx"
          test -f "$BUILDX_BINARY"
          test ! -L "$BUILDX_BINARY"
          test "$(sha256sum "$BUILDX_BINARY" | cut -d' ' -f1)" = "d41ece72044243b4f58b343441ae37446d9c29a7d6b5e11c61847bbcf8f7dfda"
          BUILDX_VERSION="$(docker buildx version)"
          [[ "$BUILDX_VERSION" == "github.com/docker/buildx v0.35.0 "* ]]
          test "$BUILDX_DRIVER" = "docker-container"
          test "$BUILDKITD_FLAGS" = "--debug=false"
          jq -e '
            length == 1
              and .[0].status == "running"
              and .[0].buildkit == "v0.31.2"
              and .[0]."buildkitd-flags" == "--debug=false"
          ' <<<"$BUILDX_NODES" >/dev/null

      - name: Authenticate only to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push without OIDC or attestation authority
        id: build
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          EXECUTION_CLASS: ${{ matrix.execution-class }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "$EXECUTION_CLASS" in
            dependency-acquisition|deterministic-hook-audit|model-broker|github-observer) ;;
            *) exit 1 ;;
          esac
          [[ "$BUILDX_BUILDER" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$WORKFLOW_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          test "$(/usr/bin/git rev-parse 'HEAD^{commit}')" = "$SOURCE_COMMIT"
          SOURCE_TREE="$(/usr/bin/git rev-parse "$SOURCE_COMMIT^{tree}")"
          SOURCE_COMMIT_TIME="$(/usr/bin/git show -s --format=%ct "$SOURCE_COMMIT")"
          [[ "$SOURCE_TREE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_COMMIT_TIME" =~ ^[0-9]+$ ]]
          test "$SOURCE_COMMIT_TIME" -gt 0
          test "$(/usr/bin/git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"

          BUILD_ROOT="$RUNNER_TEMP/managed-ci-build-input"
          test ! -e "$BUILD_ROOT"
          install -d -m 0700 "$BUILD_ROOT"
          CONTEXT_ARCHIVE="$BUILD_ROOT/$EXECUTION_CLASS.tar"
          BUILD_METADATA="$BUILD_ROOT/$EXECUTION_CLASS-metadata.json"
          IMAGE_SUBJECT="ghcr.io/ajenchen/managed-ci-$EXECUTION_CLASS"
          IMAGE_TAG="$IMAGE_SUBJECT:$SOURCE_COMMIT-$WORKFLOW_RUN_ID-$WORKFLOW_RUN_ATTEMPT"

          /usr/bin/git -c tar.umask=0022 archive --format=tar --mtime="@$SOURCE_COMMIT_TIME" \
            "$SOURCE_COMMIT:infra/governance/managed-ci-executor" \
            > "$CONTEXT_ARCHIVE"
          test -f "$CONTEXT_ARCHIVE"
          test ! -L "$CONTEXT_ARCHIVE"
          test -s "$CONTEXT_ARCHIVE"
          test "$(tar -tf "$CONTEXT_ARCHIVE")" = "$(printf '%s\n' \
            .dockerignore \
            Containerfile \
            runtime/ \
            runtime/managed-ci-runtime.mjs)"
          /usr/bin/python3 - "$CONTEXT_ARCHIVE" <<'PY'
          import sys
          import tarfile

          expected = [
              (".dockerignore", "file", 0o644, 0, 0),
              ("Containerfile", "file", 0o644, 0, 0),
              ("runtime", "directory", 0o755, 0, 0),
              ("runtime/managed-ci-runtime.mjs", "file", 0o644, 0, 0),
          ]
          with tarfile.open(sys.argv[1], mode="r:") as archive:
              actual = []
              for member in archive.getmembers():
                  kind = "file" if member.isfile() else "directory" if member.isdir() else "forbidden"
                  actual.append((member.name, kind, member.mode, member.uid, member.gid))
          if actual != expected:
              raise SystemExit(f"managed CI context archive metadata mismatch: {actual!r}")
          PY

          verify_archived_blob() {
            local archivePath="$1"
            local repositoryPath="infra/governance/managed-ci-executor/$archivePath"
            local blob expectedSha expectedSize
            blob="$(/usr/bin/git rev-parse "$SOURCE_COMMIT:$repositoryPath")"
            [[ "$blob" =~ ^[a-f0-9]{40}$ ]]
            expectedSha="$(/usr/bin/git cat-file blob "$blob" | sha256sum | cut -d' ' -f1)"
            expectedSize="$(/usr/bin/git cat-file -s "$blob")"
            test "$(tar -xOf "$CONTEXT_ARCHIVE" "$archivePath" | sha256sum | cut -d' ' -f1)" = "$expectedSha"
            test "$(tar -xOf "$CONTEXT_ARCHIVE" "$archivePath" | wc -c | tr -d ' ')" = "$expectedSize"
          }
          verify_archived_blob .dockerignore
          verify_archived_blob Containerfile
          verify_archived_blob runtime/managed-ci-runtime.mjs

          CONTEXT_ARCHIVE_SHA256="$(sha256sum "$CONTEXT_ARCHIVE" | cut -d' ' -f1)"
          [[ "$CONTEXT_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$(stat -c '%h' "$CONTEXT_ARCHIVE")" = 1
          chmod 0400 "$CONTEXT_ARCHIVE"
          CONTEXT_ARCHIVE_IDENTITY="$(stat -c '%d:%i:%s:%Y' "$CONTEXT_ARCHIVE")"
          exec {CONTEXT_ARCHIVE_FD}<"$CONTEXT_ARCHIVE"
          /usr/bin/docker buildx build \
            --builder "$BUILDX_BUILDER" \
            --file Containerfile \
            --platform linux/amd64 \
            --push \
            --tag "$IMAGE_TAG" \
            --build-arg "EXECUTION_CLASS=$EXECUTION_CLASS" \
            --network none \
            --provenance=false \
            --sbom=false \
            --no-cache \
            --metadata-file "$BUILD_METADATA" \
            - 0<&"$CONTEXT_ARCHIVE_FD"
          exec {CONTEXT_ARCHIVE_FD}<&-
          test "$(stat -c '%d:%i:%s:%Y' "$CONTEXT_ARCHIVE")" = "$CONTEXT_ARCHIVE_IDENTITY"
          test "$(sha256sum "$CONTEXT_ARCHIVE" | cut -d' ' -f1)" = "$CONTEXT_ARCHIVE_SHA256"

          test -f "$BUILD_METADATA"
          test ! -L "$BUILD_METADATA"
          IMAGE_DIGEST="$(jq -er '."containerimage.digest"' "$BUILD_METADATA")"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'context-archive-mtime-epoch=%s\n' "$SOURCE_COMMIT_TIME" >> "$GITHUB_OUTPUT"
          printf 'context-archive-sha256=%s\n' "$CONTEXT_ARCHIVE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Revoke GHCR write credentials before any binding or artifact step
        if: always()
        run: |
          set -euo pipefail
          /usr/bin/docker logout ghcr.io
          DOCKER_CONFIG_FILE="$DOCKER_CONFIG/config.json"
          if test -f "$DOCKER_CONFIG_FILE"; then
            test ! -L "$DOCKER_CONFIG_FILE"
            jq -e 'keys == ["auths"] and .auths == {}' "$DOCKER_CONFIG_FILE" >/dev/null
          fi

      - name: Validate and freeze the exact pushed subject before read-only scanning
        env:
          EXECUTION_CLASS: ${{ matrix.execution-class }}
          CONTEXT_ARCHIVE_MTIME_EPOCH: ${{ steps.build.outputs.context-archive-mtime-epoch }}
          CONTEXT_ARCHIVE_SHA256: ${{ steps.build.outputs.context-archive-sha256 }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "$EXECUTION_CLASS" in
            dependency-acquisition|deterministic-hook-audit|model-broker|github-observer) ;;
            *) exit 1 ;;
          esac
          [[ "$CONTEXT_ARCHIVE_MTIME_EPOCH" =~ ^[0-9]+$ ]]
          [[ "$CONTEXT_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$WORKFLOW_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          test "$WORKFLOW_REPOSITORY" = "ajenchen/design-system"
          test "$WORKFLOW_REF" = "ajenchen/design-system/.github/workflows/build-managed-ci-executors.yml@refs/heads/main"
          # Both are independently observed GitHub contexts. Equality is required
          # for this protected-main dispatch, but workflowSha is never derived from sourceCommit.
          test "$WORKFLOW_SHA" = "$SOURCE_COMMIT"
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_COMMIT"
          test "$(git cat-file -t "$WORKFLOW_SHA:.github/workflows/build-managed-ci-executors.yml")" = "blob"
          SOURCE_TREE="$(git rev-parse "$SOURCE_COMMIT^{tree}")"
          SOURCE_COMMIT_TIME="$(git show -s --format=%ct "$SOURCE_COMMIT")"
          [[ "$SOURCE_TREE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_COMMIT_TIME" =~ ^[0-9]+$ ]]
          test "$SOURCE_COMMIT_TIME" -gt 0
          test "$CONTEXT_ARCHIVE_MTIME_EPOCH" = "$SOURCE_COMMIT_TIME"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          IMAGE_SUBJECT="ghcr.io/ajenchen/managed-ci-$EXECUTION_CLASS"
          IMAGE_TAG="$IMAGE_SUBJECT:$SOURCE_COMMIT-$WORKFLOW_RUN_ID-$WORKFLOW_RUN_ATTEMPT"
          BINDING_ROOT="$RUNNER_TEMP/managed-ci-image-binding"
          install -d -m 0700 "$BINDING_ROOT"

          write_git_file_set() {
            local output="$1"
            shift
            printf '[]' > "$output"
            for path in "$@"; do
              local entry mode objectType blob sha size next
              entry="$(git ls-tree "$SOURCE_COMMIT" -- "$path")"
              test -n "$entry"
              test "$(printf '%s\n' "$entry" | wc -l | tr -d ' ')" = 1
              mode="$(printf '%s\n' "$entry" | awk '{print $1}')"
              objectType="$(printf '%s\n' "$entry" | awk '{print $2}')"
              test "$objectType" = "blob"
              case "$mode" in 100644|100755) ;; *) exit 1 ;; esac
              blob="$(git rev-parse "$SOURCE_COMMIT:$path")"
              [[ "$blob" =~ ^[a-f0-9]{40}$ ]]
              sha="$(git cat-file blob "$blob" | sha256sum | cut -d' ' -f1)"
              size="$(git cat-file -s "$blob")"
              [[ "$sha" =~ ^[a-f0-9]{64}$ ]]
              [[ "$size" =~ ^[0-9]+$ ]]
              next="$output.next"
              jq --arg mode "$mode" --arg path "$path" --arg sha256 "$sha" --argjson size "$size" \
                '. + [{mode: $mode, path: $path, sha256: $sha256, size: $size}]' "$output" > "$next"
              mv "$next" "$output"
            done
          }
          test "$(find infra/governance/managed-ci-executor -type l | wc -l | tr -d ' ')" = 0
          cmp -s infra/governance/managed-ci-executor/.dockerignore <(printf '%s\n' \
            '**' \
            '!.dockerignore' \
            '!Containerfile' \
            '!runtime/' \
            '!runtime/managed-ci-runtime.mjs')
          grep -Fx '# syntax=docker/dockerfile:1.7@sha256:a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e' \
            infra/governance/managed-ci-executor/Containerfile
          grep -Fx 'FROM docker.io/library/node@sha256:4bd6219054c8bebcd26a66bfd8ca0bd6e1024b4b97474c59bb7ee3bbcbef4fe8 AS runtime' \
            infra/governance/managed-ci-executor/Containerfile
          CONTEXT_FILES="$BINDING_ROOT/build-context-files.json"
          MATERIAL_FILES="$BINDING_ROOT/material-files.json"
          write_git_file_set "$CONTEXT_FILES" \
            infra/governance/managed-ci-executor/.dockerignore \
            infra/governance/managed-ci-executor/Containerfile \
            infra/governance/managed-ci-executor/runtime/managed-ci-runtime.mjs
          write_git_file_set "$MATERIAL_FILES" \
            .github/workflows/build-managed-ci-executors.yml \
            infra/governance/managed-ci-executor/.dockerignore \
            infra/governance/managed-ci-executor/Containerfile \
            infra/governance/managed-ci-executor/runtime/managed-ci-runtime.mjs \
            infra/governance/providers/managed-ci-executor-supply-chain.json \
            infra/governance/schemas/managed-ci-executor-supply-chain.schema.json
          jq -e '
            length == 3
            and ([.[].path] | length == (unique | length))
            and [.[].path] == [
              "infra/governance/managed-ci-executor/.dockerignore",
              "infra/governance/managed-ci-executor/Containerfile",
              "infra/governance/managed-ci-executor/runtime/managed-ci-runtime.mjs"
            ]
          ' "$CONTEXT_FILES" > /dev/null
          jq -e '
            length == 6
            and ([.[].path] | length == (unique | length))
            and [.[].path] == [
              ".github/workflows/build-managed-ci-executors.yml",
              "infra/governance/managed-ci-executor/.dockerignore",
              "infra/governance/managed-ci-executor/Containerfile",
              "infra/governance/managed-ci-executor/runtime/managed-ci-runtime.mjs",
              "infra/governance/providers/managed-ci-executor-supply-chain.json",
              "infra/governance/schemas/managed-ci-executor-supply-chain.schema.json"
            ]
          ' "$MATERIAL_FILES" > /dev/null
          CONTEXT_CANONICAL="$(jq -cS . "$CONTEXT_FILES")"
          MATERIAL_CANONICAL="$(jq -cS . "$MATERIAL_FILES")"
          CONTEXT_DIGEST="$(printf '%s\n' "$CONTEXT_CANONICAL" | sha256sum | cut -d' ' -f1)"
          MATERIALS_DIGEST="$(printf '%s\n' "$MATERIAL_CANONICAL" | sha256sum | cut -d' ' -f1)"
          RECIPE_DIGEST="$(jq -r '.[] | select(.path == "infra/governance/managed-ci-executor/Containerfile") | .sha256' "$CONTEXT_FILES")"
          BASE_IMAGE_DIGEST="sha256:4bd6219054c8bebcd26a66bfd8ca0bd6e1024b4b97474c59bb7ee3bbcbef4fe8"
          DOCKERFILE_FRONTEND_DIGEST="sha256:a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e"
          BUILDX_BINARY_SHA256="d41ece72044243b4f58b343441ae37446d9c29a7d6b5e11c61847bbcf8f7dfda"
          BUILDKIT_IMAGE_DIGEST="sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec"
          TOOLCHAIN="$(jq -cnS \
            --arg baseImageDigest "$BASE_IMAGE_DIGEST" \
            --arg buildkitImageDigest "$BUILDKIT_IMAGE_DIGEST" \
            --arg buildxBinarySha256 "$BUILDX_BINARY_SHA256" \
            --arg dockerfileFrontendDigest "$DOCKERFILE_FRONTEND_DIGEST" \
            '{
              baseImage: {
                subjectName: "docker.io/library/node",
                version: "24.14.0-bookworm-slim",
                subjectDigest: $baseImageDigest
              },
              dockerfileFrontend: {
                subjectName: "docker.io/docker/dockerfile",
                version: "1.7",
                subjectDigest: $dockerfileFrontendDigest
              },
              buildx: {
                version: "v0.35.0",
                linuxAmd64Sha256: $buildxBinarySha256
              },
              buildkit: {
                version: "v0.31.2",
                driver: "docker-container",
                daemonFlags: "--debug=false",
                subjectName: "docker.io/moby/buildkit",
                subjectDigest: $buildkitImageDigest
              },
              syft: {
                version: "v1.42.3",
                linuxAmd64ArchiveUrl: "https://github.com/anchore/syft/releases/download/v1.42.3/syft_1.42.3_linux_amd64.tar.gz",
                linuxAmd64ArchiveSha256: "0d6be741479eddd2c8644a288990c04f3df0d609bbc1599a005532a9dff63509",
                linuxAmd64BinarySha256: "6c1eb5c6f15c177fa3dd727ee186c61a660a3939a4e1dc1bc4b3e00eafec098e"
              }
            }')"
          TOOLCHAIN_DIGEST="$(printf '%s' "$TOOLCHAIN" | sha256sum | cut -d' ' -f1)"
          [[ "$CONTEXT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$MATERIALS_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$RECIPE_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$TOOLCHAIN_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          jq -nS \
            --slurpfile contextFiles "$CONTEXT_FILES" \
            --slurpfile materialFiles "$MATERIAL_FILES" \
            --arg contextArchiveMtimeEpoch "$CONTEXT_ARCHIVE_MTIME_EPOCH" \
            --arg contextArchiveSha256 "$CONTEXT_ARCHIVE_SHA256" \
            --arg contextDigest "$CONTEXT_DIGEST" \
            --arg executionClass "$EXECUTION_CLASS" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg imageSubject "$IMAGE_SUBJECT" \
            --arg imageTag "$IMAGE_TAG" \
            --arg materialsDigest "$MATERIALS_DIGEST" \
            --arg recipeDigest "$RECIPE_DIGEST" \
            --arg runAttempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg runId "$WORKFLOW_RUN_ID" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceTree "$SOURCE_TREE" \
            --arg toolchainDigest "$TOOLCHAIN_DIGEST" \
            --arg workflowPath ".github/workflows/build-managed-ci-executors.yml" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg workflowRepository "$WORKFLOW_REPOSITORY" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --argjson toolchain "$TOOLCHAIN" \
            '{
              schemaVersion: 2,
              build: {
                buildType: "https://actions.github.io/buildtypes/workflow/v1",
                platform: "linux/amd64",
                runnerArchitecture: "x86_64",
                network: "none",
                recipe: {
                  path: "infra/governance/managed-ci-executor/Containerfile",
                  sha256: $recipeDigest
                },
                context: {
                  sha256: $contextDigest,
                  archiveMtimeEpoch: $contextArchiveMtimeEpoch,
                  archiveSha256: $contextArchiveSha256,
                  files: $contextFiles[0]
                },
                materials: {sha256: $materialsDigest, files: $materialFiles[0]},
                toolchain: ($toolchain + {sha256: $toolchainDigest})
              },
              executionClass: $executionClass,
              imageDigest: $imageDigest,
              imageSubject: $imageSubject,
              imageTag: $imageTag,
              runAttempt: $runAttempt,
              runId: $runId,
              sourceCommit: $sourceCommit,
              sourceTree: $sourceTree,
              workflow: {
                path: $workflowPath,
                ref: $workflowRef,
                repository: $workflowRepository,
                sha: $workflowSha
              }
            }' > "$BINDING_ROOT/$EXECUTION_CLASS.json"
          jq -e \
            --arg contextDigest "$CONTEXT_DIGEST" \
            --arg contextArchiveMtimeEpoch "$CONTEXT_ARCHIVE_MTIME_EPOCH" \
            --arg contextArchiveSha256 "$CONTEXT_ARCHIVE_SHA256" \
            --arg executionClass "$EXECUTION_CLASS" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg imageSubject "$IMAGE_SUBJECT" \
            --arg imageTag "$IMAGE_TAG" \
            --arg materialsDigest "$MATERIALS_DIGEST" \
            --arg recipeDigest "$RECIPE_DIGEST" \
            --arg runAttempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg runId "$WORKFLOW_RUN_ID" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceTree "$SOURCE_TREE" \
            --arg toolchainDigest "$TOOLCHAIN_DIGEST" \
            --arg workflowPath ".github/workflows/build-managed-ci-executors.yml" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg workflowRepository "$WORKFLOW_REPOSITORY" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --argjson toolchain "$TOOLCHAIN" \
            'keys == ["build","executionClass","imageDigest","imageSubject","imageTag","runAttempt","runId","schemaVersion","sourceCommit","sourceTree","workflow"]
              and .schemaVersion == 2
              and .build.buildType == "https://actions.github.io/buildtypes/workflow/v1"
              and .build.platform == "linux/amd64"
              and .build.runnerArchitecture == "x86_64"
              and .build.network == "none"
              and .build.recipe == {path: "infra/governance/managed-ci-executor/Containerfile", sha256: $recipeDigest}
              and .build.context.sha256 == $contextDigest
              and .build.context.archiveMtimeEpoch == $contextArchiveMtimeEpoch
              and .build.context.archiveSha256 == $contextArchiveSha256
              and .build.materials.sha256 == $materialsDigest
              and .build.toolchain == ($toolchain + {sha256: $toolchainDigest})
              and .executionClass == $executionClass
              and .imageDigest == $imageDigest
              and .imageSubject == $imageSubject
              and .imageTag == $imageTag
              and .runAttempt == $runAttempt
              and .runId == $runId
              and .sourceCommit == $sourceCommit
              and .sourceTree == $sourceTree
              and .workflow == {
                path: $workflowPath,
                ref: $workflowRef,
                repository: $workflowRepository,
                sha: $workflowSha
              }' \
            "$BINDING_ROOT/$EXECUTION_CLASS.json" >/dev/null
          CONTEXT_ARCHIVE_SOURCE="$RUNNER_TEMP/managed-ci-build-input/$EXECUTION_CLASS.tar"
          test -f "$CONTEXT_ARCHIVE_SOURCE"
          test ! -L "$CONTEXT_ARCHIVE_SOURCE"
          test "$(sha256sum "$CONTEXT_ARCHIVE_SOURCE" | cut -d' ' -f1)" = "$CONTEXT_ARCHIVE_SHA256"
          install -m 0444 "$CONTEXT_ARCHIVE_SOURCE" "$BINDING_ROOT/$EXECUTION_CLASS.tar"
          test "$(sha256sum "$BINDING_ROOT/$EXECUTION_CLASS.tar" | cut -d' ' -f1)" = "$CONTEXT_ARCHIVE_SHA256"
          rm "$CONTEXT_FILES" "$MATERIAL_FILES"

      - name: Retain the pre-scan image binding as a non-WORM GitHub handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: managed-ci-image-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.execution-class }}
          path: |
            ${{ runner.temp }}/managed-ci-image-binding/${{ matrix.execution-class }}.json
            ${{ runner.temp }}/managed-ci-image-binding/${{ matrix.execution-class }}.tar
          if-no-files-found: error
          # Operational GitHub retention only; external WORM activation remains separate.
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  generate-sbom:
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      packages: read
    strategy:
      fail-fast: true
      matrix:
        execution-class:
          - dependency-acquisition
          - deterministic-hook-audit
          - model-broker
          - github-observer
    steps:
      - name: Fail closed unless the observed workflow identity is exact
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_REPOSITORY" = "ajenchen/design-system"
          test "$WORKFLOW_REF" = "ajenchen/design-system/.github/workflows/build-managed-ci-executors.yml@refs/heads/main"
          test "$WORKFLOW_SHA" = "$SOURCE_COMMIT"

      - name: Download the exact pre-scan image binding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: managed-ci-image-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.execution-class }}
          path: ${{ runner.temp }}/managed-ci-image-build
          digest-mismatch: error

      - name: Materialize exact Syft bytes without any registry credential
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          DOWNLOAD_ROOT="$RUNNER_TEMP/managed-ci-syft-download"
          TOOL_ROOT="$RUNNER_TEMP/managed-ci-tools"
          install -d -m 0700 "$DOWNLOAD_ROOT" "$TOOL_ROOT"
          ARCHIVE="$DOWNLOAD_ROOT/syft.tar.gz"
          /usr/bin/env -i \
            HOME="$DOWNLOAD_ROOT" \
            PATH="/usr/bin:/bin" \
            /usr/bin/curl \
              --fail \
              --location \
              --max-redirs 3 \
              --max-filesize 67108864 \
              --proto '=https' \
              --proto-redir '=https' \
              --show-error \
              --silent \
              --tlsv1.2 \
              --output "$ARCHIVE" \
              "https://github.com/anchore/syft/releases/download/v1.42.3/syft_1.42.3_linux_amd64.tar.gz"
          test -f "$ARCHIVE"
          test ! -L "$ARCHIVE"
          test "$(stat -c '%s' "$ARCHIVE")" -gt 0
          test "$(stat -c '%s' "$ARCHIVE")" -le 67108864
          test "$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" = "0d6be741479eddd2c8644a288990c04f3df0d609bbc1599a005532a9dff63509"
          test "$(tar -tzf "$ARCHIVE" | LC_ALL=C sort)" = $'CHANGELOG.md\nLICENSE\nREADME.md\nsyft'
          test "$(tar -tzvf "$ARCHIVE" | cut -c1 | LC_ALL=C sort -u)" = "-"
          tar -xzf "$ARCHIVE" \
            --directory "$DOWNLOAD_ROOT" \
            --no-same-owner \
            --no-same-permissions \
            syft
          test -f "$DOWNLOAD_ROOT/syft"
          test ! -L "$DOWNLOAD_ROOT/syft"
          test "$(stat -c '%s' "$DOWNLOAD_ROOT/syft")" -gt 0
          test "$(stat -c '%s' "$DOWNLOAD_ROOT/syft")" -le 134217728
          test "$(sha256sum "$DOWNLOAD_ROOT/syft" | cut -d' ' -f1)" = "6c1eb5c6f15c177fa3dd727ee186c61a660a3939a4e1dc1bc4b3e00eafec098e"
          install -m 0555 "$DOWNLOAD_ROOT/syft" "$TOOL_ROOT/syft"
          test "$(sha256sum "$TOOL_ROOT/syft" | cut -d' ' -f1)" = "6c1eb5c6f15c177fa3dd727ee186c61a660a3939a4e1dc1bc4b3e00eafec098e"

      - name: Validate the exact binding and prepare the verified Syft invocation
        env:
          EXECUTION_CLASS: ${{ matrix.execution-class }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "$EXECUTION_CLASS" in
            dependency-acquisition|deterministic-hook-audit|model-broker|github-observer) ;;
            *) exit 1 ;;
          esac
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$WORKFLOW_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          test "$WORKFLOW_REPOSITORY" = "ajenchen/design-system"
          test "$WORKFLOW_REF" = "ajenchen/design-system/.github/workflows/build-managed-ci-executors.yml@refs/heads/main"
          test "$WORKFLOW_SHA" = "$SOURCE_COMMIT"
          BINDING_SOURCE="$RUNNER_TEMP/managed-ci-image-build/$EXECUTION_CLASS.json"
          test -f "$BINDING_SOURCE"
          test ! -L "$BINDING_SOURCE"
          IMAGE_SUBJECT="ghcr.io/ajenchen/managed-ci-$EXECUTION_CLASS"
          IMAGE_TAG="$IMAGE_SUBJECT:$SOURCE_COMMIT-$WORKFLOW_RUN_ID-$WORKFLOW_RUN_ATTEMPT"
          jq -e \
            --arg executionClass "$EXECUTION_CLASS" \
            --arg imageSubject "$IMAGE_SUBJECT" \
            --arg imageTag "$IMAGE_TAG" \
            --arg runAttempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg runId "$WORKFLOW_RUN_ID" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg workflowRepository "$WORKFLOW_REPOSITORY" \
            --arg workflowSha "$WORKFLOW_SHA" \
            'keys == ["build","executionClass","imageDigest","imageSubject","imageTag","runAttempt","runId","schemaVersion","sourceCommit","sourceTree","workflow"]
              and .schemaVersion == 2
              and .executionClass == $executionClass
              and .imageSubject == $imageSubject
              and .imageTag == $imageTag
              and .runAttempt == $runAttempt
              and .runId == $runId
              and .sourceCommit == $sourceCommit
              and .workflow == {
                path: ".github/workflows/build-managed-ci-executors.yml",
                ref: $workflowRef,
                repository: $workflowRepository,
                sha: $workflowSha
              }
              and (.sourceTree | type == "string" and test("^[a-f0-9]{40}$"))
              and (.imageDigest | type == "string" and test("^sha256:[a-f0-9]{64}$"))
              and .build.buildType == "https://actions.github.io/buildtypes/workflow/v1"
              and .build.platform == "linux/amd64"
              and .build.runnerArchitecture == "x86_64"
              and (.build.context.archiveMtimeEpoch | type == "string" and test("^[0-9]+$"))
              and (.build.context.archiveSha256 | type == "string" and test("^[a-f0-9]{64}$"))
              and .build.toolchain.syft == {
                version: "v1.42.3",
                linuxAmd64ArchiveUrl: "https://github.com/anchore/syft/releases/download/v1.42.3/syft_1.42.3_linux_amd64.tar.gz",
                linuxAmd64ArchiveSha256: "0d6be741479eddd2c8644a288990c04f3df0d609bbc1599a005532a9dff63509",
                linuxAmd64BinarySha256: "6c1eb5c6f15c177fa3dd727ee186c61a660a3939a4e1dc1bc4b3e00eafec098e"
              }' \
            "$BINDING_SOURCE" >/dev/null
          SYFT="$RUNNER_TEMP/managed-ci-tools/syft"
          test -f "$SYFT"
          test ! -L "$SYFT"
          test "$(sha256sum "$SYFT" | cut -d' ' -f1)" = "6c1eb5c6f15c177fa3dd727ee186c61a660a3939a4e1dc1bc4b3e00eafec098e"
          IMAGE_DIGEST="$(jq -r '.imageDigest' "$BINDING_SOURCE")"
          SBOM_ROOT="$RUNNER_TEMP/managed-ci-image-binding"
          SBOM_PATH="$SBOM_ROOT/$EXECUTION_CLASS.cdx.json"
          SYFT_HOME="$RUNNER_TEMP/managed-ci-syft-home"
          SCAN_REF="$RUNNER_TEMP/managed-ci-syft-image-ref"
          install -d -m 0700 "$SBOM_ROOT" "$SYFT_HOME"
          printf '%s\n' "registry:$IMAGE_SUBJECT@$IMAGE_DIGEST" > "$SCAN_REF"
          chmod 0400 "$SCAN_REF"

      - name: Execute only verified Syft with read-only registry authority
        env:
          GHCR_READ_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SYFT="$RUNNER_TEMP/managed-ci-tools/syft"
          SCAN_REF="$RUNNER_TEMP/managed-ci-syft-image-ref"
          read -r IMAGE_REF < "$SCAN_REF"
          [[ "$IMAGE_REF" =~ ^registry:ghcr\.io/ajenchen/managed-ci-(dependency-acquisition|deterministic-hook-audit|model-broker|github-observer)@sha256:[a-f0-9]{64}$ ]]
          exec /usr/bin/env -i \
            HOME="$RUNNER_TEMP/managed-ci-syft-home" \
            PATH="/usr/bin:/bin" \
            SYFT_CHECK_FOR_APP_UPDATE="false" \
            SYFT_REGISTRY_AUTH_AUTHORITY="ghcr.io" \
            SYFT_REGISTRY_AUTH_USERNAME="$GHCR_READ_USERNAME" \
            SYFT_REGISTRY_AUTH_PASSWORD="$GHCR_READ_TOKEN" \
            "$SYFT" \
              "$IMAGE_REF" \
              --output "cyclonedx-json=$RUNNER_TEMP/managed-ci-image-binding/${{ matrix.execution-class }}.cdx.json"

      - name: Extract and hash the final runtime bytes without executing the image
        env:
          EXECUTION_CLASS: ${{ matrix.execution-class }}
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_READ_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "$EXECUTION_CLASS" in
            dependency-acquisition|deterministic-hook-audit|model-broker|github-observer) ;;
            *) exit 1 ;;
          esac
          BINDING_SOURCE="$RUNNER_TEMP/managed-ci-image-build/$EXECUTION_CLASS.json"
          SBOM_PATH="$RUNNER_TEMP/managed-ci-image-binding/$EXECUTION_CLASS.cdx.json"
          test -f "$BINDING_SOURCE"
          test ! -L "$BINDING_SOURCE"
          test -f "$SBOM_PATH"
          test ! -L "$SBOM_PATH"
          IMAGE_SUBJECT="$(jq -er '.imageSubject' "$BINDING_SOURCE")"
          IMAGE_DIGEST="$(jq -er '.imageDigest' "$BINDING_SOURCE")"
          IMAGE_REF="$IMAGE_SUBJECT@$IMAGE_DIGEST"
          test "$IMAGE_SUBJECT" = "ghcr.io/ajenchen/managed-ci-$EXECUTION_CLASS"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          jq -e '
            [.components[]
              | select((.name | type == "string") and (.name | ascii_downcase) == "node")]
              | length >= 1
              and all(.version == "24.14.0")
              and all(.["bom-ref"] | type == "string" and length > 0)
          ' "$SBOM_PATH" >/dev/null
          NODE_BOM_REF="$(jq -er '
            [.components[]
              | select((.name | type == "string") and (.name | ascii_downcase) == "node"
                and .version == "24.14.0")]
              | sort_by(.["bom-ref"])
              | first
              | .["bom-ref"]
          ' "$SBOM_PATH")"

          export DOCKER_CONFIG="$RUNNER_TEMP/managed-ci-runtime-byte-readback-docker-config"
          install -d -m 0700 "$DOCKER_CONFIG"
          printf '{"auths":{}}\n' > "$DOCKER_CONFIG/config.json"
          chmod 0600 "$DOCKER_CONFIG/config.json"
          CONTAINER_ID=""
          cleanup_runtime_readback() {
            set +e
            if test -n "$CONTAINER_ID"; then
              /usr/bin/docker rm -f "$CONTAINER_ID" >/dev/null 2>&1
            fi
            /usr/bin/docker logout ghcr.io >/dev/null 2>&1
            rm -rf "$DOCKER_CONFIG"
          }
          trap cleanup_runtime_readback EXIT
          printf '%s' "$GHCR_READ_TOKEN" \
            | /usr/bin/docker login ghcr.io --username "$GHCR_READ_USERNAME" --password-stdin >/dev/null
          /usr/bin/docker pull "$IMAGE_REF" >/dev/null
          IMAGE_ID="$(/usr/bin/docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          [[ "$IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]
          /usr/bin/docker image inspect "$IMAGE_REF" \
            | jq -e --arg imageRef "$IMAGE_REF" '
                length == 1
                and (.[0].Id | type == "string")
                and (.[0].RepoDigests | index($imageRef) != null)
              ' >/dev/null
          test "$(/usr/bin/docker image inspect --format '{{json .RepoDigests}}' "$IMAGE_REF" \
            | jq -r --arg imageRef "$IMAGE_REF" 'index($imageRef) != null')" = "true"

          # `docker create` and `docker cp` inspect the immutable filesystem
          # without starting the image entrypoint or any image-owned process.
          CONTAINER_ID="$(/usr/bin/docker create \
            --network none \
            --read-only \
            --entrypoint /bin/false \
            "$IMAGE_REF")"
          [[ "$CONTAINER_ID" =~ ^[a-f0-9]{64}$ ]]
          test "$(/usr/bin/docker inspect --format '{{.State.Status}} {{.State.Running}} {{.State.Pid}}' "$CONTAINER_ID")" = "created false 0"
          BYTE_ROOT="$RUNNER_TEMP/managed-ci-runtime-bytes/$EXECUTION_CLASS"
          test ! -e "$BYTE_ROOT"
          install -d -m 0700 "$BYTE_ROOT"
          copy_image_file() {
            local imagePath="$1"
            local outputPath="$2"
            test ! -e "$outputPath"
            /usr/bin/docker cp "$CONTAINER_ID:$imagePath" "$outputPath"
            test -f "$outputPath"
            test ! -L "$outputPath"
            test "$(stat -c '%h' "$outputPath")" = 1
            test "$(stat -c '%s' "$outputPath")" -gt 0
          }
          copy_image_file /usr/local/bin/node "$BYTE_ROOT/node"
          copy_image_file /opt/qijenchen/managed-ci/bin/managed-ci-runtime "$BYTE_ROOT/managed-ci-runtime"
          copy_image_file /opt/qijenchen/managed-ci/bin/run-class "$BYTE_ROOT/run-class"
          copy_image_file /opt/qijenchen/managed-ci/bin/validate-provenance "$BYTE_ROOT/validate-provenance"
          test "$(/usr/bin/docker inspect --format '{{.State.Status}} {{.State.Running}} {{.State.Pid}}' "$CONTAINER_ID")" = "created false 0"

          test "$(od -An -tx1 -N4 "$BYTE_ROOT/node" | tr -d ' \n')" = "7f454c46"
          /usr/bin/python3 - "$BYTE_ROOT/node" <<'PY'
          import pathlib
          import struct
          import sys

          header = pathlib.Path(sys.argv[1]).read_bytes()[:20]
          if len(header) != 20 or header[:4] != b"\x7fELF" or header[4] != 2 or header[5] != 1:
              raise SystemExit("node runtime is not a little-endian ELF64 binary")
          if struct.unpack_from("<H", header, 18)[0] != 62:
              raise SystemExit("node runtime is not x86_64")
          PY
          RUNTIME_SOURCE_SHA256="$(jq -er '
            [.build.context.files[]
              | select(.path == "infra/governance/managed-ci-executor/runtime/managed-ci-runtime.mjs")]
              | if length == 1 then .[0].sha256 else error("runtime source closure") end
          ' "$BINDING_SOURCE")"
          [[ "$RUNTIME_SOURCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          for file in managed-ci-runtime run-class validate-provenance; do
            test "$(sha256sum "$BYTE_ROOT/$file" | cut -d' ' -f1)" = "$RUNTIME_SOURCE_SHA256"
            test "$(head -n 1 "$BYTE_ROOT/$file")" = '#!/usr/bin/env node'
          done
          cmp -s "$BYTE_ROOT/managed-ci-runtime" "$BYTE_ROOT/run-class"
          cmp -s "$BYTE_ROOT/managed-ci-runtime" "$BYTE_ROOT/validate-provenance"

          runtime_file_projection() {
            local imagePath="$1"
            local localPath="$2"
            jq -cnS \
              --arg mode "$(stat -c '%a' "$localPath")" \
              --arg path "$imagePath" \
              --arg sha256 "$(sha256sum "$localPath" | cut -d' ' -f1)" \
              --argjson size "$(stat -c '%s' "$localPath")" \
              '{mode: $mode, path: $path, sha256: $sha256, size: $size}'
          }
          NODE_FILE="$(runtime_file_projection /usr/local/bin/node "$BYTE_ROOT/node")"
          MANAGED_RUNTIME_FILE="$(runtime_file_projection /opt/qijenchen/managed-ci/bin/managed-ci-runtime "$BYTE_ROOT/managed-ci-runtime")"
          RUN_CLASS_FILE="$(runtime_file_projection /opt/qijenchen/managed-ci/bin/run-class "$BYTE_ROOT/run-class")"
          VALIDATE_PROVENANCE_FILE="$(runtime_file_projection /opt/qijenchen/managed-ci/bin/validate-provenance "$BYTE_ROOT/validate-provenance")"
          RUNTIME_FILES="$RUNNER_TEMP/managed-ci-image-binding/$EXECUTION_CLASS.runtime-files.json"
          jq -nS \
            --arg executionClass "$EXECUTION_CLASS" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg imageId "$IMAGE_ID" \
            --arg imageSubject "$IMAGE_SUBJECT" \
            --arg nodeBomRef "$NODE_BOM_REF" \
            --arg runtimeSourceSha256 "$RUNTIME_SOURCE_SHA256" \
            --argjson managedRuntime "$MANAGED_RUNTIME_FILE" \
            --argjson node "$NODE_FILE" \
            --argjson runClass "$RUN_CLASS_FILE" \
            --argjson validateProvenance "$VALIDATE_PROVENANCE_FILE" \
            '{
              schemaVersion: 1,
              kind: "managed-ci-image-runtime-files-v1",
              executionClass: $executionClass,
              image: {subject: $imageSubject, digest: $imageDigest, imageId: $imageId},
              node: ($node + {version: "24.14.0", bomRef: $nodeBomRef}),
              runtimeSourceSha256: $runtimeSourceSha256,
              launchers: [$managedRuntime, $runClass, $validateProvenance]
            }' > "$RUNTIME_FILES"
          jq -e \
            --arg executionClass "$EXECUTION_CLASS" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg imageSubject "$IMAGE_SUBJECT" \
            --arg runtimeSourceSha256 "$RUNTIME_SOURCE_SHA256" \
            'keys == ["executionClass","image","kind","launchers","node","runtimeSourceSha256","schemaVersion"]
              and .schemaVersion == 1
              and .kind == "managed-ci-image-runtime-files-v1"
              and .executionClass == $executionClass
              and .image.subject == $imageSubject
              and .image.digest == $imageDigest
              and (.image.imageId | type == "string" and test("^sha256:[a-f0-9]{64}$"))
              and .node.path == "/usr/local/bin/node"
              and .node.version == "24.14.0"
              and (.node.bomRef | type == "string" and length > 0)
              and (.node.sha256 | type == "string" and test("^[a-f0-9]{64}$"))
              and (.node.size | type == "number" and . > 0)
              and .runtimeSourceSha256 == $runtimeSourceSha256
              and [.launchers[].path] == [
                "/opt/qijenchen/managed-ci/bin/managed-ci-runtime",
                "/opt/qijenchen/managed-ci/bin/run-class",
                "/opt/qijenchen/managed-ci/bin/validate-provenance"
              ]
              and ([.launchers[].sha256] | unique) == [$runtimeSourceSha256]
              and ([.launchers[].size] | all(type == "number" and . > 0))
              and ([.launchers[].mode] | all(type == "string" and test("^[0-7]{3,4}$")))' \
            "$RUNTIME_FILES" >/dev/null

      - name: Validate and close the exact independent CycloneDX SBOM
        env:
          EXECUTION_CLASS: ${{ matrix.execution-class }}
        run: |
          set -euo pipefail
          BINDING_SOURCE="$RUNNER_TEMP/managed-ci-image-build/$EXECUTION_CLASS.json"
          CONTEXT_ARCHIVE_SOURCE="$RUNNER_TEMP/managed-ci-image-build/$EXECUTION_CLASS.tar"
          SBOM_ROOT="$RUNNER_TEMP/managed-ci-image-binding"
          SBOM_PATH="$SBOM_ROOT/$EXECUTION_CLASS.cdx.json"
          RUNTIME_FILES_PATH="$SBOM_ROOT/$EXECUTION_CLASS.runtime-files.json"
          test -f "$CONTEXT_ARCHIVE_SOURCE"
          test ! -L "$CONTEXT_ARCHIVE_SOURCE"
          test "$(sha256sum "$CONTEXT_ARCHIVE_SOURCE" | cut -d' ' -f1)" = \
            "$(jq -r '.build.context.archiveSha256' "$BINDING_SOURCE")"
          test -f "$SBOM_PATH"
          test ! -L "$SBOM_PATH"
          test -f "$RUNTIME_FILES_PATH"
          test ! -L "$RUNTIME_FILES_PATH"
          SBOM_SIZE="$(stat -c '%s' "$SBOM_PATH")"
          [[ "$SBOM_SIZE" =~ ^[0-9]+$ ]]
          test "$SBOM_SIZE" -gt 0
          test "$SBOM_SIZE" -le 16777216
          IMAGE_SUBJECT="$(jq -r '.imageSubject' "$BINDING_SOURCE")"
          IMAGE_DIGEST="$(jq -r '.imageDigest' "$BINDING_SOURCE")"
          jq -e \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg imageSubject "$IMAGE_SUBJECT" \
            '.bomFormat == "CycloneDX"
              and .specVersion == "1.6"
              and (.serialNumber | type == "string" and test("^urn:uuid:[0-9a-fA-F-]{36}$"))
              and (.metadata.tools.components | type == "array")
              and ([.metadata.tools.components[]
                | select(.name == "syft" and (.version | type == "string" and test("^v?1\\.42\\.3$")))]
                | length == 1)
              and .metadata.component.type == "container"
              and .metadata.component.name == $imageSubject
              and .metadata.component.version == $imageDigest
              and (.metadata.component["bom-ref"] | type == "string" and length > 0)
              and (.components | type == "array" and length > 0)
              and ([.components[]
                | select((.name | type == "string") and (.name | ascii_downcase) == "node"
                  and .version == "24.14.0"
                  and (.["bom-ref"] | type == "string" and length > 0))]
                | length >= 1)
              and ([.components[]
                | select((.name | type == "string") and (.name | ascii_downcase) == "node")]
                | all(.version == "24.14.0"))
              and ([.components[] | .["bom-ref"]] | all(type == "string" and length > 0))
              and ([.components[] | .name] | all(type == "string" and length > 0))' \
            "$SBOM_PATH" >/dev/null
          SBOM_DIGEST="$(sha256sum "$SBOM_PATH" | cut -d' ' -f1)"
          COMPONENT_COUNT="$(jq '.components | length' "$SBOM_PATH")"
          METADATA_BOM_REF="$(jq -r '.metadata.component["bom-ref"]' "$SBOM_PATH")"
          NODE_COMPONENT="$(jq -cS \
            '[.components[]
              | select((.name | type == "string") and (.name | ascii_downcase) == "node"
                and .version == "24.14.0"
                and (.["bom-ref"] | type == "string" and length > 0))]
              | sort_by(.["bom-ref"]) | first | {bomRef: .["bom-ref"], name, version}' \
            "$SBOM_PATH")"
          RUNTIME_SOURCE_SHA256="$(jq -r \
            '[.build.context.files[]
              | select(.path == "infra/governance/managed-ci-executor/runtime/managed-ci-runtime.mjs")]
              | if length == 1 then .[0].sha256 else error("runtime source closure") end' \
            "$BINDING_SOURCE")"
          BASE_IMAGE_DIGEST="$(jq -r '.build.toolchain.baseImage.subjectDigest' "$BINDING_SOURCE")"
          RUNTIME_FILES_DIGEST="$(sha256sum "$RUNTIME_FILES_PATH" | cut -d' ' -f1)"
          [[ "$SBOM_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$RUNTIME_SOURCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$RUNTIME_FILES_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$COMPONENT_COUNT" =~ ^[1-9][0-9]*$ ]]
          jq -e \
            --arg executionClass "$EXECUTION_CLASS" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg imageSubject "$IMAGE_SUBJECT" \
            --arg nodeBomRef "$(jq -r '.bomRef' <<<"$NODE_COMPONENT")" \
            --arg runtimeSourceSha256 "$RUNTIME_SOURCE_SHA256" \
            '.executionClass == $executionClass
              and .image.subject == $imageSubject
              and .image.digest == $imageDigest
              and .node.path == "/usr/local/bin/node"
              and .node.version == "24.14.0"
              and .node.bomRef == $nodeBomRef
              and (.node.sha256 | type == "string" and test("^[a-f0-9]{64}$"))
              and .runtimeSourceSha256 == $runtimeSourceSha256
              and [.launchers[].path] == [
                "/opt/qijenchen/managed-ci/bin/managed-ci-runtime",
                "/opt/qijenchen/managed-ci/bin/run-class",
                "/opt/qijenchen/managed-ci/bin/validate-provenance"
              ]
              and ([.launchers[].sha256] | unique) == [$runtimeSourceSha256]' \
            "$RUNTIME_FILES_PATH" >/dev/null
          jq -S \
            --arg baseImageDigest "$BASE_IMAGE_DIGEST" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg imageSubject "$IMAGE_SUBJECT" \
            --arg metadataBomRef "$METADATA_BOM_REF" \
            --arg runtimeSourceSha256 "$RUNTIME_SOURCE_SHA256" \
            --arg runtimeFilesDigest "$RUNTIME_FILES_DIGEST" \
            --arg sbomDigest "$SBOM_DIGEST" \
            --argjson componentCount "$COMPONENT_COUNT" \
            --argjson nodeComponent "$NODE_COMPONENT" \
            --slurpfile runtimeFiles "$RUNTIME_FILES_PATH" \
            '. + {
              sbom: {
                predicateType: "https://cyclonedx.org/bom",
                format: "cyclonedx-json-1.6",
                sha256: $sbomDigest,
                componentCount: $componentCount,
                scanner: {name: "syft", version: "v1.42.3"},
                identity: {
                  scannedImage: {
                    subject: $imageSubject,
                    digest: $imageDigest,
                    metadataBomRef: $metadataBomRef
                  },
                  baseImage: {
                    subject: "docker.io/library/node",
                    digest: $baseImageDigest
                  },
                  runtime: {
                    managedRuntimePath: "/opt/qijenchen/managed-ci/bin/managed-ci-runtime",
                    managedRuntimeSourceSha256: $runtimeSourceSha256,
                    nodeComponent: $nodeComponent,
                    runtimeFiles: ($runtimeFiles[0] + {sha256: $runtimeFilesDigest})
                  }
                }
              }
            }' \
            "$BINDING_SOURCE" > "$SBOM_ROOT/$EXECUTION_CLASS.json"
          jq -e \
            --arg baseImageDigest "$BASE_IMAGE_DIGEST" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg imageSubject "$IMAGE_SUBJECT" \
            --arg runtimeSourceSha256 "$RUNTIME_SOURCE_SHA256" \
            --arg runtimeFilesDigest "$RUNTIME_FILES_DIGEST" \
            --arg sbomDigest "$SBOM_DIGEST" \
            --argjson componentCount "$COMPONENT_COUNT" \
            'keys == ["build","executionClass","imageDigest","imageSubject","imageTag","runAttempt","runId","sbom","schemaVersion","sourceCommit","sourceTree","workflow"]
              and .schemaVersion == 2
              and .imageDigest == $imageDigest
              and .imageSubject == $imageSubject
              and .sbom.predicateType == "https://cyclonedx.org/bom"
              and .sbom.format == "cyclonedx-json-1.6"
              and .sbom.sha256 == $sbomDigest
              and .sbom.componentCount == $componentCount
              and .sbom.scanner == {name: "syft", version: "v1.42.3"}
              and .sbom.identity.scannedImage.subject == $imageSubject
              and .sbom.identity.scannedImage.digest == $imageDigest
              and .sbom.identity.baseImage == {
                subject: "docker.io/library/node",
                digest: $baseImageDigest
              }
              and .sbom.identity.runtime.managedRuntimePath == "/opt/qijenchen/managed-ci/bin/managed-ci-runtime"
              and .sbom.identity.runtime.managedRuntimeSourceSha256 == $runtimeSourceSha256
              and .sbom.identity.runtime.nodeComponent.name == "node"
              and .sbom.identity.runtime.nodeComponent.version == "24.14.0"
              and (.sbom.identity.runtime.nodeComponent.bomRef | type == "string" and length > 0)
              and .sbom.identity.runtime.runtimeFiles.sha256 == $runtimeFilesDigest
              and .sbom.identity.runtime.runtimeFiles.node.version == "24.14.0"
              and (.sbom.identity.runtime.runtimeFiles.node.sha256 | type == "string" and test("^[a-f0-9]{64}$"))
              and [.sbom.identity.runtime.runtimeFiles.launchers[].path] == [
                "/opt/qijenchen/managed-ci/bin/managed-ci-runtime",
                "/opt/qijenchen/managed-ci/bin/run-class",
                "/opt/qijenchen/managed-ci/bin/validate-provenance"
              ]
              and ([.sbom.identity.runtime.runtimeFiles.launchers[].sha256] | unique) == [$runtimeSourceSha256]' \
            "$SBOM_ROOT/$EXECUTION_CLASS.json" >/dev/null
          install -m 0444 "$CONTEXT_ARCHIVE_SOURCE" "$SBOM_ROOT/$EXECUTION_CLASS.context.tar"

      - name: Retain the scanned image binding as a non-WORM GitHub handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: managed-ci-image-binding-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.execution-class }}
          path: |
            ${{ runner.temp }}/managed-ci-image-binding/${{ matrix.execution-class }}.json
            ${{ runner.temp }}/managed-ci-image-binding/${{ matrix.execution-class }}.cdx.json
            ${{ runner.temp }}/managed-ci-image-binding/${{ matrix.execution-class }}.context.tar
            ${{ runner.temp }}/managed-ci-image-binding/${{ matrix.execution-class }}.runtime-files.json
          if-no-files-found: error
          # Operational GitHub retention only; external WORM activation remains separate.
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  bind-image-set:
    if: github.ref == 'refs/heads/main'
    needs: generate-sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      artifact_id: ${{ steps.retain.outputs.artifact-id }}
      artifact_digest: ${{ steps.retain.outputs.artifact-digest }}
      inventory_sha256: ${{ steps.bind.outputs.inventory_sha256 }}
      manifest_sha256: ${{ steps.bind.outputs.manifest_sha256 }}
    steps:
      - name: Fail closed unless the observed workflow identity is exact
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_REPOSITORY" = "ajenchen/design-system"
          test "$WORKFLOW_REF" = "ajenchen/design-system/.github/workflows/build-managed-ci-executors.yml@refs/heads/main"
          test "$WORKFLOW_SHA" = "$SOURCE_COMMIT"

      - name: Download dependency-acquisition binding by exact immutable name
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: managed-ci-image-binding-${{ github.run_id }}-${{ github.run_attempt }}-dependency-acquisition
          path: ${{ runner.temp }}/managed-ci-image-bindings/dependency-acquisition
          digest-mismatch: error

      - name: Download deterministic-hook-audit binding by exact immutable name
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: managed-ci-image-binding-${{ github.run_id }}-${{ github.run_attempt }}-deterministic-hook-audit
          path: ${{ runner.temp }}/managed-ci-image-bindings/deterministic-hook-audit
          digest-mismatch: error

      - name: Download model-broker binding by exact immutable name
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: managed-ci-image-binding-${{ github.run_id }}-${{ github.run_attempt }}-model-broker
          path: ${{ runner.temp }}/managed-ci-image-bindings/model-broker
          digest-mismatch: error

      - name: Download github-observer binding by exact immutable name
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: managed-ci-image-binding-${{ github.run_id }}-${{ github.run_attempt }}-github-observer
          path: ${{ runner.temp }}/managed-ci-image-bindings/github-observer
          digest-mismatch: error

      - name: Close and content-address the four-image handoff
        id: bind
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$WORKFLOW_REPOSITORY" = "ajenchen/design-system"
          test "$WORKFLOW_REF" = "ajenchen/design-system/.github/workflows/build-managed-ci-executors.yml@refs/heads/main"
          test "$WORKFLOW_SHA" = "$SOURCE_COMMIT"
          ROOT="$RUNNER_TEMP/managed-ci-image-bindings"
          test "$(find "$ROOT" -type f | wc -l | tr -d ' ')" = 16
          test "$(find "$ROOT" -type l | wc -l | tr -d ' ')" = 0
          SET_ROOT="$RUNNER_TEMP/managed-ci-image-set"
          test ! -e "$SET_ROOT"
          install -d -m 0700 \
            "$SET_ROOT" \
            "$SET_ROOT/bindings" \
            "$SET_ROOT/contexts" \
            "$SET_ROOT/runtime-files" \
            "$SET_ROOT/sboms"
          CLASS_PROJECTIONS="$RUNNER_TEMP/managed-ci-image-set-class-projections.json"
          printf '[]' > "$CLASS_PROJECTIONS"
          for EXECUTION_CLASS in dependency-acquisition deterministic-hook-audit model-broker github-observer; do
            FILE="$ROOT/$EXECUTION_CLASS/$EXECUTION_CLASS.json"
            SBOM="$ROOT/$EXECUTION_CLASS/$EXECUTION_CLASS.cdx.json"
            CONTEXT_ARCHIVE="$ROOT/$EXECUTION_CLASS/$EXECUTION_CLASS.context.tar"
            RUNTIME_FILES="$ROOT/$EXECUTION_CLASS/$EXECUTION_CLASS.runtime-files.json"
            test -f "$FILE"
            test ! -L "$FILE"
            test -f "$SBOM"
            test ! -L "$SBOM"
            test -f "$CONTEXT_ARCHIVE"
            test ! -L "$CONTEXT_ARCHIVE"
            test -f "$RUNTIME_FILES"
            test ! -L "$RUNTIME_FILES"
            for path in "$FILE" "$SBOM" "$CONTEXT_ARCHIVE" "$RUNTIME_FILES"; do
              test "$(stat -c '%h' "$path")" = 1
              test "$(stat -c '%s' "$path")" -gt 0
            done
            test "$(sha256sum "$CONTEXT_ARCHIVE" | cut -d' ' -f1)" = \
              "$(jq -r '.build.context.archiveSha256' "$FILE")"
            test "$(sha256sum "$SBOM" | cut -d' ' -f1)" = "$(jq -r '.sbom.sha256' "$FILE")"
            test "$(sha256sum "$RUNTIME_FILES" | cut -d' ' -f1)" = \
              "$(jq -r '.sbom.identity.runtime.runtimeFiles.sha256' "$FILE")"
            IMAGE_SUBJECT="ghcr.io/ajenchen/managed-ci-$EXECUTION_CLASS"
            IMAGE_TAG="$IMAGE_SUBJECT:$SOURCE_COMMIT-$WORKFLOW_RUN_ID-$WORKFLOW_RUN_ATTEMPT"
            jq -e \
              --arg executionClass "$EXECUTION_CLASS" \
              --arg imageSubject "$IMAGE_SUBJECT" \
              --arg imageTag "$IMAGE_TAG" \
              --arg runAttempt "$WORKFLOW_RUN_ATTEMPT" \
              --arg runId "$WORKFLOW_RUN_ID" \
              --arg sourceCommit "$SOURCE_COMMIT" \
              --arg workflowRef "$WORKFLOW_REF" \
              --arg workflowRepository "$WORKFLOW_REPOSITORY" \
              --arg workflowSha "$WORKFLOW_SHA" \
              'keys == ["build","executionClass","imageDigest","imageSubject","imageTag","runAttempt","runId","sbom","schemaVersion","sourceCommit","sourceTree","workflow"]
                and .schemaVersion == 2
                and .build.buildType == "https://actions.github.io/buildtypes/workflow/v1"
                and .build.platform == "linux/amd64"
                and .build.runnerArchitecture == "x86_64"
                and .build.network == "none"
                and .build.recipe.path == "infra/governance/managed-ci-executor/Containerfile"
                and (.build.recipe.sha256 | type == "string" and test("^[a-f0-9]{64}$"))
                and (.build.context.archiveMtimeEpoch | type == "string" and test("^[0-9]+$"))
                and (.build.context.archiveSha256 | type == "string" and test("^[a-f0-9]{64}$"))
                and (.build.context.sha256 | type == "string" and test("^[a-f0-9]{64}$"))
                and ([.build.context.files[].path] == [
                  "infra/governance/managed-ci-executor/.dockerignore",
                  "infra/governance/managed-ci-executor/Containerfile",
                  "infra/governance/managed-ci-executor/runtime/managed-ci-runtime.mjs"
                ])
                and (.build.materials.sha256 | type == "string" and test("^[a-f0-9]{64}$"))
                and ([.build.materials.files[].path] == [
                  ".github/workflows/build-managed-ci-executors.yml",
                  "infra/governance/managed-ci-executor/.dockerignore",
                  "infra/governance/managed-ci-executor/Containerfile",
                  "infra/governance/managed-ci-executor/runtime/managed-ci-runtime.mjs",
                  "infra/governance/providers/managed-ci-executor-supply-chain.json",
                  "infra/governance/schemas/managed-ci-executor-supply-chain.schema.json"
                ])
                and .build.toolchain == {
                  baseImage: {
                    subjectName: "docker.io/library/node",
                    version: "24.14.0-bookworm-slim",
                    subjectDigest: "sha256:4bd6219054c8bebcd26a66bfd8ca0bd6e1024b4b97474c59bb7ee3bbcbef4fe8"
                  },
                  dockerfileFrontend: {
                    subjectName: "docker.io/docker/dockerfile",
                    version: "1.7",
                    subjectDigest: "sha256:a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e"
                  },
                  buildx: {
                    version: "v0.35.0",
                    linuxAmd64Sha256: "d41ece72044243b4f58b343441ae37446d9c29a7d6b5e11c61847bbcf8f7dfda"
                  },
                  buildkit: {
                    version: "v0.31.2",
                    driver: "docker-container",
                    daemonFlags: "--debug=false",
                    subjectName: "docker.io/moby/buildkit",
                    subjectDigest: "sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec"
                  },
                  syft: {
                    version: "v1.42.3",
                    linuxAmd64ArchiveUrl: "https://github.com/anchore/syft/releases/download/v1.42.3/syft_1.42.3_linux_amd64.tar.gz",
                    linuxAmd64ArchiveSha256: "0d6be741479eddd2c8644a288990c04f3df0d609bbc1599a005532a9dff63509",
                    linuxAmd64BinarySha256: "6c1eb5c6f15c177fa3dd727ee186c61a660a3939a4e1dc1bc4b3e00eafec098e"
                  },
                  sha256: .build.toolchain.sha256
                }
                and (.build.toolchain.sha256 | type == "string" and test("^[a-f0-9]{64}$"))
                and .executionClass == $executionClass
                and .imageSubject == $imageSubject
                and .imageTag == $imageTag
                and .runAttempt == $runAttempt
                and .runId == $runId
                and .sourceCommit == $sourceCommit
                and (.sourceTree | type == "string" and test("^[a-f0-9]{40}$"))
                and .workflow == {
                  path: ".github/workflows/build-managed-ci-executors.yml",
                  ref: $workflowRef,
                  repository: $workflowRepository,
                  sha: $workflowSha
                }
                and (.imageDigest | type == "string" and test("^sha256:[a-f0-9]{64}$"))
                and .sbom.predicateType == "https://cyclonedx.org/bom"
                and .sbom.format == "cyclonedx-json-1.6"
                and (.sbom.sha256 | type == "string" and test("^[a-f0-9]{64}$"))
                and .sbom.identity.runtime.nodeComponent.version == "24.14.0"
                and .sbom.identity.runtime.runtimeFiles.node.path == "/usr/local/bin/node"
                and .sbom.identity.runtime.runtimeFiles.node.version == "24.14.0"
                and [.sbom.identity.runtime.runtimeFiles.launchers[].path] == [
                  "/opt/qijenchen/managed-ci/bin/managed-ci-runtime",
                  "/opt/qijenchen/managed-ci/bin/run-class",
                  "/opt/qijenchen/managed-ci/bin/validate-provenance"
                ]
                and ([.sbom.identity.runtime.runtimeFiles.launchers[].sha256] | unique)
                  == [.sbom.identity.runtime.managedRuntimeSourceSha256]' \
              "$FILE" >/dev/null
            jq -e '
              .bomFormat == "CycloneDX"
                and .specVersion == "1.6"
                and (.serialNumber | type == "string" and length > 0)
                and (.components | type == "array" and length > 0)
                and ([.components[]
                  | select((.name | type == "string") and (.name | ascii_downcase) == "node")]
                  | length >= 1 and all(.version == "24.14.0"))
            ' "$SBOM" >/dev/null
            jq -e \
              --arg executionClass "$EXECUTION_CLASS" \
              --arg imageDigest "$(jq -r '.imageDigest' "$FILE")" \
              --arg imageSubject "$IMAGE_SUBJECT" \
              --arg runtimeSourceSha256 "$(jq -r '.sbom.identity.runtime.managedRuntimeSourceSha256' "$FILE")" \
              '.executionClass == $executionClass
                and .image.subject == $imageSubject
                and .image.digest == $imageDigest
                and .node.version == "24.14.0"
                and .node.path == "/usr/local/bin/node"
                and (.node.sha256 | type == "string" and test("^[a-f0-9]{64}$"))
                and .runtimeSourceSha256 == $runtimeSourceSha256
                and [.launchers[].path] == [
                  "/opt/qijenchen/managed-ci/bin/managed-ci-runtime",
                  "/opt/qijenchen/managed-ci/bin/run-class",
                  "/opt/qijenchen/managed-ci/bin/validate-provenance"
                ]
                and ([.launchers[].sha256] | unique) == [$runtimeSourceSha256]' \
              "$RUNTIME_FILES" >/dev/null

            BINDING_TARGET="$SET_ROOT/bindings/$EXECUTION_CLASS.json"
            SBOM_TARGET="$SET_ROOT/sboms/$EXECUTION_CLASS.cdx.json"
            CONTEXT_TARGET="$SET_ROOT/contexts/$EXECUTION_CLASS.tar"
            RUNTIME_TARGET="$SET_ROOT/runtime-files/$EXECUTION_CLASS.json"
            install -m 0400 "$FILE" "$BINDING_TARGET"
            install -m 0400 "$SBOM" "$SBOM_TARGET"
            install -m 0400 "$CONTEXT_ARCHIVE" "$CONTEXT_TARGET"
            install -m 0400 "$RUNTIME_FILES" "$RUNTIME_TARGET"
            NEXT_CLASS_PROJECTIONS="$CLASS_PROJECTIONS.next"
            jq \
              --arg bindingPath "bindings/$EXECUTION_CLASS.json" \
              --arg bindingSha256 "$(sha256sum "$BINDING_TARGET" | cut -d' ' -f1)" \
              --arg contextPath "contexts/$EXECUTION_CLASS.tar" \
              --arg contextSha256 "$(sha256sum "$CONTEXT_TARGET" | cut -d' ' -f1)" \
              --arg executionClass "$EXECUTION_CLASS" \
              --arg imageDigest "$(jq -r '.imageDigest' "$FILE")" \
              --arg imageSubject "$IMAGE_SUBJECT" \
              --arg runtimePath "runtime-files/$EXECUTION_CLASS.json" \
              --arg runtimeSha256 "$(sha256sum "$RUNTIME_TARGET" | cut -d' ' -f1)" \
              --arg sbomPath "sboms/$EXECUTION_CLASS.cdx.json" \
              --arg sbomSha256 "$(sha256sum "$SBOM_TARGET" | cut -d' ' -f1)" \
              --argjson bindingSize "$(stat -c '%s' "$BINDING_TARGET")" \
              --argjson contextSize "$(stat -c '%s' "$CONTEXT_TARGET")" \
              --argjson runtimeSize "$(stat -c '%s' "$RUNTIME_TARGET")" \
              --argjson sbomSize "$(stat -c '%s' "$SBOM_TARGET")" \
              '. + [{
                executionClass: $executionClass,
                image: {subject: $imageSubject, digest: $imageDigest},
                binding: {path: $bindingPath, sha256: $bindingSha256, size: $bindingSize},
                sbom: {path: $sbomPath, sha256: $sbomSha256, size: $sbomSize},
                contextArchive: {path: $contextPath, sha256: $contextSha256, size: $contextSize},
                runtimeFiles: {path: $runtimePath, sha256: $runtimeSha256, size: $runtimeSize}
              }]' "$CLASS_PROJECTIONS" > "$NEXT_CLASS_PROJECTIONS"
            mv "$NEXT_CLASS_PROJECTIONS" "$CLASS_PROJECTIONS"
          done

          jq -e '
            length == 4
              and ([.[].executionClass] == [
                "dependency-acquisition",
                "deterministic-hook-audit",
                "model-broker",
                "github-observer"
              ])
              and ([.[].executionClass] | unique | length == 4)
              and ([.[] | .binding.sha256, .sbom.sha256, .contextArchive.sha256, .runtimeFiles.sha256]
                | all(type == "string" and test("^[a-f0-9]{64}$")))
              and ([.[] | .binding.size, .sbom.size, .contextArchive.size, .runtimeFiles.size]
                | all(type == "number" and . > 0))
          ' "$CLASS_PROJECTIONS" >/dev/null
          SOURCE_TREE="$(jq -ers '[.[].sourceTree] | unique | if length == 1 then .[0] else error("source tree mismatch") end' \
            "$ROOT/dependency-acquisition/dependency-acquisition.json" \
            "$ROOT/deterministic-hook-audit/deterministic-hook-audit.json" \
            "$ROOT/model-broker/model-broker.json" \
            "$ROOT/github-observer/github-observer.json")"
          [[ "$SOURCE_TREE" =~ ^[a-f0-9]{40}$ ]]
          PREIMAGE="$SET_ROOT/manifest.preimage.json"
          jq -nS \
            --arg runAttempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg runId "$WORKFLOW_RUN_ID" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceTree "$SOURCE_TREE" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg workflowRepository "$WORKFLOW_REPOSITORY" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --slurpfile classes "$CLASS_PROJECTIONS" \
            '{
              schemaVersion: 2,
              kind: "managed-ci-image-set-preimage-v2",
              workflow: {
                repository: $workflowRepository,
                path: ".github/workflows/build-managed-ci-executors.yml",
                ref: $workflowRef,
                sha: $workflowSha,
                runId: $runId,
                runAttempt: $runAttempt
              },
              source: {commit: $sourceCommit, tree: $sourceTree},
              classes: ($classes[0] | sort_by(.executionClass))
            }' > "$PREIMAGE"
          jq -e \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceTree "$SOURCE_TREE" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg workflowRepository "$WORKFLOW_REPOSITORY" \
            --arg workflowSha "$WORKFLOW_SHA" \
            'keys == ["classes","kind","schemaVersion","source","workflow"]
              and .schemaVersion == 2
              and .kind == "managed-ci-image-set-preimage-v2"
              and .workflow.repository == $workflowRepository
              and .workflow.path == ".github/workflows/build-managed-ci-executors.yml"
              and .workflow.ref == $workflowRef
              and .workflow.sha == $workflowSha
              and .source == {commit: $sourceCommit, tree: $sourceTree}
              and [.classes[].executionClass] == [
                "dependency-acquisition",
                "deterministic-hook-audit",
                "github-observer",
                "model-broker"
              ]' "$PREIMAGE" >/dev/null
          PREIMAGE_SHA256="$(sha256sum "$PREIMAGE" | cut -d' ' -f1)"
          PREIMAGE_SIZE="$(stat -c '%s' "$PREIMAGE")"
          [[ "$PREIMAGE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PREIMAGE_SIZE" =~ ^[1-9][0-9]*$ ]]

          MANIFEST="$SET_ROOT/manifest.json"
          jq -nS \
            --arg preimageSha256 "$PREIMAGE_SHA256" \
            --arg runAttempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg runId "$WORKFLOW_RUN_ID" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceTree "$SOURCE_TREE" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg workflowRepository "$WORKFLOW_REPOSITORY" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --argjson preimageSize "$PREIMAGE_SIZE" \
            '{
              schemaVersion: 2,
              kind: "managed-ci-image-set-v2",
              workflow: {
                repository: $workflowRepository,
                path: ".github/workflows/build-managed-ci-executors.yml",
                ref: $workflowRef,
                sha: $workflowSha,
                runId: $runId,
                runAttempt: $runAttempt
              },
              source: {commit: $sourceCommit, tree: $sourceTree},
              classCount: 4,
              preimage: {
                path: "manifest.preimage.json",
                sha256: $preimageSha256,
                size: $preimageSize
              }
            }' > "$MANIFEST"
          jq -e \
            --arg preimageSha256 "$PREIMAGE_SHA256" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceTree "$SOURCE_TREE" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg workflowRepository "$WORKFLOW_REPOSITORY" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --argjson preimageSize "$PREIMAGE_SIZE" \
            'keys == ["classCount","kind","preimage","schemaVersion","source","workflow"]
              and .schemaVersion == 2
              and .kind == "managed-ci-image-set-v2"
              and .classCount == 4
              and .workflow.repository == $workflowRepository
              and .workflow.path == ".github/workflows/build-managed-ci-executors.yml"
              and .workflow.ref == $workflowRef
              and .workflow.sha == $workflowSha
              and .source == {commit: $sourceCommit, tree: $sourceTree}
              and .preimage == {
                path: "manifest.preimage.json",
                sha256: $preimageSha256,
                size: $preimageSize
              }' "$MANIFEST" >/dev/null

          EXPECTED_PATHS="$RUNNER_TEMP/managed-ci-image-set-expected-paths.txt"
          {
            for EXECUTION_CLASS in dependency-acquisition deterministic-hook-audit github-observer model-broker; do
              printf '%s\n' \
                "bindings/$EXECUTION_CLASS.json" \
                "contexts/$EXECUTION_CLASS.tar" \
                "runtime-files/$EXECUTION_CLASS.json" \
                "sboms/$EXECUTION_CLASS.cdx.json"
            done
            printf '%s\n' manifest.json manifest.preimage.json
          } | LC_ALL=C sort > "$EXPECTED_PATHS"
          ACTUAL_PATHS="$RUNNER_TEMP/managed-ci-image-set-actual-paths.txt"
          (
            cd "$SET_ROOT"
            find . -type f -print \
              | sed 's#^\./##' \
              | LC_ALL=C sort
          ) > "$ACTUAL_PATHS"
          cmp -s "$EXPECTED_PATHS" "$ACTUAL_PATHS"

          INVENTORY_ENTRIES="$RUNNER_TEMP/managed-ci-image-set-inventory-entries.json"
          printf '[]' > "$INVENTORY_ENTRIES"
          while IFS= read -r relativePath; do
            [[ "$relativePath" =~ ^[A-Za-z0-9._/-]+$ ]]
            ABSOLUTE_PATH="$SET_ROOT/$relativePath"
            test -f "$ABSOLUTE_PATH"
            test ! -L "$ABSOLUTE_PATH"
            test "$(stat -c '%h' "$ABSOLUTE_PATH")" = 1
            NEXT_INVENTORY_ENTRIES="$INVENTORY_ENTRIES.next"
            jq \
              --arg path "$relativePath" \
              --arg sha256 "$(sha256sum "$ABSOLUTE_PATH" | cut -d' ' -f1)" \
              --argjson size "$(stat -c '%s' "$ABSOLUTE_PATH")" \
              '. + [{path: $path, sha256: $sha256, size: $size}]' \
              "$INVENTORY_ENTRIES" > "$NEXT_INVENTORY_ENTRIES"
            mv "$NEXT_INVENTORY_ENTRIES" "$INVENTORY_ENTRIES"
          done < "$EXPECTED_PATHS"
          INVENTORY="$SET_ROOT/inventory.json"
          jq -nS \
            --arg manifestSha256 "$(sha256sum "$MANIFEST" | cut -d' ' -f1)" \
            --arg preimageSha256 "$PREIMAGE_SHA256" \
            --slurpfile entries "$INVENTORY_ENTRIES" \
            '{
              schemaVersion: 1,
              kind: "managed-ci-image-set-inventory-v1",
              entries: $entries[0],
              manifestSha256: $manifestSha256,
              preimageSha256: $preimageSha256
            }' > "$INVENTORY"
          jq -e \
            --arg manifestSha256 "$(sha256sum "$MANIFEST" | cut -d' ' -f1)" \
            --arg preimageSha256 "$PREIMAGE_SHA256" \
            'keys == ["entries","kind","manifestSha256","preimageSha256","schemaVersion"]
              and .schemaVersion == 1
              and .kind == "managed-ci-image-set-inventory-v1"
              and .manifestSha256 == $manifestSha256
              and .preimageSha256 == $preimageSha256
              and (.entries | length == 18)
              and ([.entries[].path] == ([.entries[].path] | sort))
              and ([.entries[].path] | unique | length == 18)
              and ([.entries[].sha256] | all(type == "string" and test("^[a-f0-9]{64}$")))
              and ([.entries[].size] | all(type == "number" and . > 0))
              and ([.entries[].path] | index("manifest.json") != null)
              and ([.entries[].path] | index("manifest.preimage.json") != null)' \
            "$INVENTORY" >/dev/null
          MANIFEST_SHA256="$(sha256sum "$MANIFEST" | cut -d' ' -f1)"
          INVENTORY_SHA256="$(sha256sum "$INVENTORY" | cut -d' ' -f1)"
          [[ "$MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$INVENTORY_SHA256" =~ ^[a-f0-9]{64}$ ]]
          echo "manifest_sha256=$MANIFEST_SHA256" >> "$GITHUB_OUTPUT"
          echo "inventory_sha256=$INVENTORY_SHA256" >> "$GITHUB_OUTPUT"

      - name: Retain one content-addressed image-set as a non-WORM GitHub handoff
        id: retain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: managed-ci-image-set-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/managed-ci-image-set/
          if-no-files-found: error
          # Operational GitHub retention only; external WORM activation remains separate.
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  attest-image:
    if: github.ref == 'refs/heads/main'
    needs: bind-image-set
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        execution-class:
          - dependency-acquisition
          - deterministic-hook-audit
          - model-broker
          - github-observer
    steps:
      - name: Checkout exact protected-main source for independent attester readback
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          submodules: false
          clean: true

      - name: Fail closed unless the observed workflow and source identities are exact
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_REPOSITORY" = "ajenchen/design-system"
          test "$WORKFLOW_REF" = "ajenchen/design-system/.github/workflows/build-managed-ci-executors.yml@refs/heads/main"
          test "$WORKFLOW_SHA" = "$SOURCE_COMMIT"
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_COMMIT"
          test "$(git cat-file -t "$WORKFLOW_SHA:.github/workflows/build-managed-ci-executors.yml")" = "blob"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Download the exact immutable image-set artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.bind-image-set.outputs.artifact_id }}
          path: ${{ runner.temp }}/managed-ci-image-set
          digest-mismatch: error

      - name: Rebind artifact ID, archive digest, manifest bytes, and image digest
        id: image
        env:
          EXECUTION_CLASS: ${{ matrix.execution-class }}
          EXPECTED_ARTIFACT_ID: ${{ needs.bind-image-set.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.bind-image-set.outputs.artifact_digest }}
          EXPECTED_INVENTORY_SHA256: ${{ needs.bind-image-set.outputs.inventory_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.bind-image-set.outputs.manifest_sha256 }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ "$EXPECTED_INVENTORY_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          case "$EXECUTION_CLASS" in
            dependency-acquisition|deterministic-hook-audit|model-broker|github-observer) ;;
            *) exit 1 ;;
          esac
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_REPOSITORY" = "ajenchen/design-system"
          test "$WORKFLOW_REF" = "ajenchen/design-system/.github/workflows/build-managed-ci-executors.yml@refs/heads/main"
          test "$WORKFLOW_SHA" = "$SOURCE_COMMIT"
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_COMMIT"
          test "$(git cat-file -t "$WORKFLOW_SHA:.github/workflows/build-managed-ci-executors.yml")" = "blob"
          FRESH_SOURCE_TREE="$(git rev-parse "$SOURCE_COMMIT^{tree}")"
          [[ "$FRESH_SOURCE_TREE" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse 'HEAD^{tree}')" = "$FRESH_SOURCE_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          ROOT="$RUNNER_TEMP/managed-ci-image-set"
          test "$(find "$ROOT" -type f | wc -l | tr -d ' ')" = 19
          test "$(find "$ROOT" -type l | wc -l | tr -d ' ')" = 0
          MANIFEST="$ROOT/manifest.json"
          PREIMAGE="$ROOT/manifest.preimage.json"
          INVENTORY="$ROOT/inventory.json"
          test -f "$MANIFEST"
          test -f "$PREIMAGE"
          test -f "$INVENTORY"
          test ! -L "$MANIFEST"
          test ! -L "$PREIMAGE"
          test ! -L "$INVENTORY"
          test "$(sha256sum "$INVENTORY" | cut -d' ' -f1)" = "$EXPECTED_INVENTORY_SHA256"
          test "$(sha256sum "$MANIFEST" | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          jq -e \
            --arg runAttempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg runId "$WORKFLOW_RUN_ID" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg workflowRepository "$WORKFLOW_REPOSITORY" \
            --arg workflowSha "$WORKFLOW_SHA" \
            'keys == ["classCount","kind","preimage","schemaVersion","source","workflow"]
              and .schemaVersion == 2
              and .kind == "managed-ci-image-set-v2"
              and .classCount == 4
              and .workflow == {
                repository: $workflowRepository,
                path: ".github/workflows/build-managed-ci-executors.yml",
                ref: $workflowRef,
                sha: $workflowSha,
                runId: $runId,
                runAttempt: $runAttempt
              }
              and .source.commit == $sourceCommit
              and (.source.tree | type == "string" and test("^[a-f0-9]{40}$"))
              and .preimage.path == "manifest.preimage.json"
              and (.preimage.sha256 | type == "string" and test("^[a-f0-9]{64}$"))
              and (.preimage.size | type == "number" and . > 0)' \
            "$MANIFEST" >/dev/null
          test "$(sha256sum "$PREIMAGE" | cut -d' ' -f1)" = "$(jq -r '.preimage.sha256' "$MANIFEST")"
          test "$(stat -c '%s' "$PREIMAGE")" = "$(jq -r '.preimage.size' "$MANIFEST")"
          jq -e \
            --arg runAttempt "$WORKFLOW_RUN_ATTEMPT" \
            --arg runId "$WORKFLOW_RUN_ID" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceTree "$(jq -r '.source.tree' "$MANIFEST")" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg workflowRepository "$WORKFLOW_REPOSITORY" \
            --arg workflowSha "$WORKFLOW_SHA" \
            'keys == ["classes","kind","schemaVersion","source","workflow"]
              and .schemaVersion == 2
              and .kind == "managed-ci-image-set-preimage-v2"
              and .workflow == {
                repository: $workflowRepository,
                path: ".github/workflows/build-managed-ci-executors.yml",
                ref: $workflowRef,
                sha: $workflowSha,
                runId: $runId,
                runAttempt: $runAttempt
              }
              and .source == {commit: $sourceCommit, tree: $sourceTree}
              and [.classes[].executionClass] == [
                "dependency-acquisition",
                "deterministic-hook-audit",
                "github-observer",
                "model-broker"
              ]' "$PREIMAGE" >/dev/null
          jq -e \
            --arg manifestSha256 "$EXPECTED_MANIFEST_SHA256" \
            --arg preimageSha256 "$(sha256sum "$PREIMAGE" | cut -d' ' -f1)" \
            'keys == ["entries","kind","manifestSha256","preimageSha256","schemaVersion"]
              and .schemaVersion == 1
              and .kind == "managed-ci-image-set-inventory-v1"
              and .manifestSha256 == $manifestSha256
              and .preimageSha256 == $preimageSha256
              and (.entries | length == 18)
              and ([.entries[].path] == ([.entries[].path] | sort))
              and ([.entries[].path] | unique | length == 18)' "$INVENTORY" >/dev/null
          while IFS=$'\t' read -r relativePath sha256 size; do
            [[ "$relativePath" =~ ^[A-Za-z0-9._/-]+$ ]]
            [[ "$sha256" =~ ^[a-f0-9]{64}$ ]]
            [[ "$size" =~ ^[1-9][0-9]*$ ]]
            case "/$relativePath/" in
              *"/../"*|*"/./"*|*//* ) exit 1 ;;
            esac
            INVENTORIED_PATH="$ROOT/$relativePath"
            test -f "$INVENTORIED_PATH"
            test ! -L "$INVENTORIED_PATH"
            test "$(stat -c '%h' "$INVENTORIED_PATH")" = 1
            test "$(stat -c '%s' "$INVENTORIED_PATH")" = "$size"
            test "$(sha256sum "$INVENTORIED_PATH" | cut -d' ' -f1)" = "$sha256"
          done < <(jq -r '.entries[] | [.path, .sha256, .size] | @tsv' "$INVENTORY")

          CLASS_PROJECTION="$(jq -c --arg executionClass "$EXECUTION_CLASS" \
            '[.classes[] | select(.executionClass == $executionClass)]
              | if length == 1 then .[0] else error("image class closure") end' \
            "$PREIMAGE")"
          BINDING_PATH="$ROOT/$(jq -r '.binding.path' <<<"$CLASS_PROJECTION")"
          ORIGINAL_CONTEXT_ARCHIVE="$ROOT/$(jq -r '.contextArchive.path' <<<"$CLASS_PROJECTION")"
          SBOM_PATH="$ROOT/$(jq -r '.sbom.path' <<<"$CLASS_PROJECTION")"
          RUNTIME_FILES_PATH="$ROOT/$(jq -r '.runtimeFiles.path' <<<"$CLASS_PROJECTION")"
          for projection in binding contextArchive sbom runtimeFiles; do
            PROJECTION_PATH="$ROOT/$(jq -r ".$projection.path" <<<"$CLASS_PROJECTION")"
            test -f "$PROJECTION_PATH"
            test ! -L "$PROJECTION_PATH"
            test "$(sha256sum "$PROJECTION_PATH" | cut -d' ' -f1)" = \
              "$(jq -r ".$projection.sha256" <<<"$CLASS_PROJECTION")"
            test "$(stat -c '%s' "$PROJECTION_PATH")" = \
              "$(jq -r ".$projection.size" <<<"$CLASS_PROJECTION")"
          done
          IMAGE="$(jq -c . "$BINDING_PATH")"
          IMAGE_SUBJECT="$(jq -r '.imageSubject' <<<"$IMAGE")"
          IMAGE_DIGEST="$(jq -r '.imageDigest' <<<"$IMAGE")"
          SOURCE_TREE="$(jq -r '.source.tree' "$MANIFEST")"
          SBOM_DIGEST="$(jq -r '.sbom.sha256' <<<"$IMAGE")"
          test "$IMAGE_SUBJECT" = "ghcr.io/ajenchen/managed-ci-$EXECUTION_CLASS"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$SOURCE_TREE" =~ ^[a-f0-9]{40}$ ]]
          test "$SOURCE_TREE" = "$FRESH_SOURCE_TREE"
          [[ "$SBOM_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          test "$(sha256sum "$RUNTIME_FILES_PATH" | cut -d' ' -f1)" = \
            "$(jq -r '.sbom.identity.runtime.runtimeFiles.sha256' <<<"$IMAGE")"
          verify_git_file_set() {
            local projection="$1"
            local expectedDigest="$2"
            local projectionCanonical
            local projectionFile="$RUNNER_TEMP/managed-ci-$EXECUTION_CLASS-$projection-files.json"
            projectionCanonical="$(jq -cS ".build.$projection.files" <<<"$IMAGE")"
            printf '%s\n' "$projectionCanonical" > "$projectionFile"
            test "$(sha256sum "$projectionFile" | cut -d' ' -f1)" = "$expectedDigest"
            while IFS=$'\t' read -r mode path sha256 size; do
              [[ "$path" =~ ^[A-Za-z0-9_@./-]+$ ]]
              [[ "$sha256" =~ ^[a-f0-9]{64}$ ]]
              [[ "$size" =~ ^[0-9]+$ ]]
              case "$mode" in 100644|100755) ;; *) exit 1 ;; esac
              ENTRY="$(git ls-tree "$SOURCE_COMMIT" -- "$path")"
              test -n "$ENTRY"
              test "$(printf '%s\n' "$ENTRY" | wc -l | tr -d ' ')" = 1
              test "$(printf '%s\n' "$ENTRY" | awk '{print $1}')" = "$mode"
              test "$(printf '%s\n' "$ENTRY" | awk '{print $2}')" = "blob"
              BLOB="$(git rev-parse "$SOURCE_COMMIT:$path")"
              [[ "$BLOB" =~ ^[a-f0-9]{40}$ ]]
              test "$(git cat-file -s "$BLOB")" = "$size"
              test "$(git cat-file blob "$BLOB" | sha256sum | cut -d' ' -f1)" = "$sha256"
            done < <(jq -r '.[] | [.mode, .path, .sha256, .size] | @tsv' "$projectionFile")
          }
          verify_git_file_set context "$(jq -r '.build.context.sha256' <<<"$IMAGE")"
          verify_git_file_set materials "$(jq -r '.build.materials.sha256' <<<"$IMAGE")"
          test "$(sha256sum "$ORIGINAL_CONTEXT_ARCHIVE" | cut -d' ' -f1)" = "$(jq -r '.build.context.archiveSha256' <<<"$IMAGE")"
          test "$(tar -tf "$ORIGINAL_CONTEXT_ARCHIVE")" = "$(printf '%s\n' \
            .dockerignore \
            Containerfile \
            runtime/ \
            runtime/managed-ci-runtime.mjs)"
          test "$(tar -tvf "$ORIGINAL_CONTEXT_ARCHIVE" | awk 'substr($1,1,1) != "-" && substr($1,1,1) != "d" {count++} END {print count+0}')" = 0
          FRESH_CONTEXT_ARCHIVE="$RUNNER_TEMP/managed-ci-$EXECUTION_CLASS-fresh-context.tar"
          SOURCE_COMMIT_TIME="$(/usr/bin/git show -s --format=%ct "$SOURCE_COMMIT")"
          [[ "$SOURCE_COMMIT_TIME" =~ ^[0-9]+$ ]]
          test "$SOURCE_COMMIT_TIME" -gt 0
          test "$SOURCE_COMMIT_TIME" = "$(jq -r '.build.context.archiveMtimeEpoch' <<<"$IMAGE")"
          /usr/bin/git -c tar.umask=0022 archive --format=tar --mtime="@$SOURCE_COMMIT_TIME" \
            "$SOURCE_COMMIT:infra/governance/managed-ci-executor" > "$FRESH_CONTEXT_ARCHIVE"
          test -f "$FRESH_CONTEXT_ARCHIVE"
          test ! -L "$FRESH_CONTEXT_ARCHIVE"
          cmp -s "$ORIGINAL_CONTEXT_ARCHIVE" "$FRESH_CONTEXT_ARCHIVE"
          test "$(jq -r \
            '[.build.context.files[] | select(.path == "infra/governance/managed-ci-executor/Containerfile")]
              | if length == 1 then .[0].sha256 else error("recipe closure") end' \
            <<<"$IMAGE")" = "$(jq -r '.build.recipe.sha256' <<<"$IMAGE")"
          test -f "$SBOM_PATH"
          test "$(sha256sum "$SBOM_PATH" | cut -d' ' -f1)" = "$SBOM_DIGEST"
          jq -e \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg imageSubject "$IMAGE_SUBJECT" \
            --argjson image "$IMAGE" \
            '.bomFormat == "CycloneDX"
              and .specVersion == "1.6"
              and .metadata.component.type == "container"
              and .metadata.component.name == $imageSubject
              and .metadata.component.version == $imageDigest
              and (.components | type == "array" and length == $image.sbom.componentCount)
              and ([.components[]
                | select((.name | type == "string") and (.name | ascii_downcase) == "node"
                  and .["bom-ref"] == $image.sbom.identity.runtime.nodeComponent.bomRef
                  and .version == $image.sbom.identity.runtime.nodeComponent.version)]
                | length >= 1)' \
            "$SBOM_PATH" >/dev/null
          BINDING_SHA256="$(sha256sum "$BINDING_PATH" | cut -d' ' -f1)"
          PREIMAGE_SHA256="$(sha256sum "$PREIMAGE" | cut -d' ' -f1)"
          RUNTIME_FILES_SHA256="$(sha256sum "$RUNTIME_FILES_PATH" | cut -d' ' -f1)"
          NODE_BINARY_SHA256="$(jq -er '.node.sha256' "$RUNTIME_FILES_PATH")"
          RUNTIME_SOURCE_SHA256="$(jq -er '.runtimeSourceSha256' "$RUNTIME_FILES_PATH")"
          for digest in \
            "$BINDING_SHA256" \
            "$PREIMAGE_SHA256" \
            "$RUNTIME_FILES_SHA256" \
            "$NODE_BINARY_SHA256" \
            "$RUNTIME_SOURCE_SHA256"
          do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          done
          PROVENANCE="$RUNNER_TEMP/managed-ci-provenance-$EXECUTION_CLASS.json"
