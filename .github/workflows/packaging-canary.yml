name: Packaging canary

# Non-blocking scheduled/manual monitor for packaging drift between releases.

on:
  schedule:
    - cron: '17 6 * * 1'   # 每週一 06:17 UTC
  workflow_dispatch:        # 手動隨時跑

permissions:
  contents: read

jobs:
  packaging-integrity:
    name: Monitor packaging integrity(dims 84/85/86/88)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # ds-canonical freshness runs governance-build-graph --check, whose
          # genesis-transition residue checker rev-parses the pinned base commit.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Install and audit with the lock-verified npm runtime
        run: npm run --silent setup:dependencies

      # Dim 85 — ds-canonical npm mirror 新鮮度(== live .claude SSOT)
      - name: ds-canonical freshness
        run: node scripts/governance-build-graph.mjs --check

      - name: Workflow trust-boundary policy
        run: |
          npm run --silent audit:workflow-security
          npm run --silent test:workflow-security
          npm run --silent test:governance-anchor

      # Dim 86 — plugin manifest + symlink-vs-source 一致
      - name: plugin structure validate
        run: node scripts/plugin-structure-validate.mjs

      # C-prime fork governance(C3 future-SSOT):classify 漏接閘 + 生成物 drift + 假 fork harness
      - name: fork-governance corpus + harness
        run: node scripts/test-fork-governance.mjs

      # Dim 84 — mirror-build integrity + 2-scenario E2E
      - name: 2-scenario architecture
        run: node scripts/test-2-scenario-architecture.mjs

      # Dim 88 — infra-self ref integrity(governance docs 引用的 hook/script / CLAUDE.md section 不死)
      - name: infra-self ref integrity
        run: |
          node scripts/check-dangling-infra-ref.mjs --check
          node scripts/check-skill-deadref.mjs --check
