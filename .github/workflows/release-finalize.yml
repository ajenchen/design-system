name: Finalize staged release

on:
  # repository_dispatch is resolved only from the protected default branch. Unlike
  # workflow_dispatch --ref, a collaborator cannot run a branch-controlled copy of this
  # contents-writer workflow. Inputs remain untrusted and are rebound below.
  repository_dispatch:
    types: [finalize-staged-release]

permissions: {}

concurrency:
  group: ${{ github.repository }}-release
  cancel-in-progress: false

jobs:
  certify-finalization:
    name: Rebuild tag and certify npm read-back(no write authority)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      release_commit: ${{ steps.identity.outputs.commit }}
      release_tree: ${{ steps.identity.outputs.tree }}
      tag_object: ${{ steps.issued_trust.outputs.tag_object }}
      release_trust_evidence_file_sha256: ${{ steps.issued_trust.outputs.evidence_file_sha256 }}
      release_set_sha256: ${{ steps.release_set.outputs.sha256 }}
      finalization_receipt_sha256: ${{ steps.final_receipt.outputs.sha256 }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Validate immutable handoff inputs before checkout
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
          STAGE_RUN_ID: ${{ github.event.client_payload.stage_run_id }}
          STAGE_RUN_ATTEMPT: ${{ github.event.client_payload.stage_run_attempt }}
          STAGE_ARTIFACT_DIGEST: ${{ github.event.client_payload.stage_artifact_digest }}
          RELEASE_SET_SHA256: ${{ github.event.client_payload.release_set_sha256 }}
          STAGE_RECEIPT_SHA256: ${{ github.event.client_payload.stage_receipt_sha256 }}
          RELEASE_AUTHORIZATION_DIGEST: ${{ github.event.client_payload.release_authorization_digest }}
          RELEASE_TRUST_EVIDENCE_DIGEST: ${{ github.event.client_payload.release_trust_evidence_digest }}
          RELEASE_TRUST_ARTIFACT_DIGEST: ${{ github.event.client_payload.release_trust_artifact_digest }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/jq -c '.client_payload | keys | sort' "$GITHUB_EVENT_PATH")" = '["release_authorization_digest","release_set_sha256","release_trust_artifact_digest","release_trust_evidence_digest","stage_artifact_digest","stage_receipt_sha256","stage_run_attempt","stage_run_id","tag"]'
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|next|rc)\.[0-9]+)?$ ]]
          [[ "$STAGE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$STAGE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$STAGE_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$STAGE_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_AUTHORIZATION_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_TRUST_EVIDENCE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_TRUST_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]

      - name: Checkout the exact remote tag without stored credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: refs/tags/${{ github.event.client_payload.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch protected main ref
        run: /usr/bin/git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

      - name: Resolve and prove exact tag identity
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          commit="$(/usr/bin/git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          tree="$(/usr/bin/git rev-parse "${commit}^{tree}")"
          test "$(/usr/bin/git rev-parse HEAD^{commit})" = "$commit"
          /usr/bin/git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"

      - name: Verify the original stage workflow run and v4 artifact before download
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release-stage-run-identity.mjs
          --repository "$GITHUB_REPOSITORY"
          --tag "${{ github.event.client_payload.tag }}"
          --git-head "${{ steps.identity.outputs.commit }}"
          --run-id "${{ github.event.client_payload.stage_run_id }}"
          --run-attempt "${{ github.event.client_payload.stage_run_attempt }}"
          --artifact-digest "${{ github.event.client_payload.stage_artifact_digest }}"
          --release-trust-artifact-digest "${{ github.event.client_payload.release_trust_artifact_digest }}"
          --token-env GH_TOKEN
          --output "$GITHUB_WORKSPACE/stage-run-evidence/stage-run-identity.json"

      - name: Download exact original release trust evidence from the successful stage run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-trust-${{ github.event.client_payload.stage_run_id }}-${{ github.event.client_payload.stage_run_attempt }}
          path: release-trust-evidence
          repository: ${{ github.repository }}
          run-id: ${{ github.event.client_payload.stage_run_id }}
          github-token: ${{ github.token }}

      - name: Revalidate issued trust evidence and authorization from the original attempt
        id: issued_trust
        run: >-
          node scripts/release-trust-preflight.mjs
          --verify-issued "$GITHUB_WORKSPACE/release-trust-evidence/release-trust-preflight.json"
          --expected-digest "${{ github.event.client_payload.release_trust_evidence_digest }}"
          --expected-authorization-digest "${{ github.event.client_payload.release_authorization_digest }}"
          --repository "$GITHUB_REPOSITORY"
          --release-tag "${{ github.event.client_payload.tag }}"
          --release-commit "${{ steps.identity.outputs.commit }}"
          --release-tree "${{ steps.identity.outputs.tree }}"
          --run-id "${{ github.event.client_payload.stage_run_id }}"
          --run-attempt "${{ github.event.client_payload.stage_run_attempt }}"
          --retain-exact "$GITHUB_WORKSPACE/finalization-evidence/release-trust-preflight.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Set up deterministic rebuild runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install repository dependencies with the lock-bound npm runtime
        run: node scripts/setup-authority-governance.mjs --dependencies-only

      - name: Rebuild publishable workspaces from the exact tag
        run: npm run --silent build:lib

      - name: Pack all three archives exactly once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          node scripts/run-verified-npm.mjs -- pack ./packages/design-system --pack-destination release-artifacts --json --ignore-scripts
          node scripts/run-verified-npm.mjs -- pack ./packages/storybook-config --pack-destination release-artifacts --json --ignore-scripts
          node scripts/run-verified-npm.mjs -- pack ./packages/governance --pack-destination release-artifacts --json --ignore-scripts

      - name: Rebuild deterministic release SBOM
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-verified-npm.mjs -- sbom --workspaces --package-lock-only --sbom-format=cyclonedx > "$RUNNER_TEMP/release.sbom.raw.json"
          node scripts/release-sbom.mjs \
            --input "$RUNNER_TEMP/release.sbom.raw.json" \
            --output "$GITHUB_WORKSPACE/release-artifacts/release.sbom.cdx.json" \
            --tag "${{ github.event.client_payload.tag }}" \
            --git-tree "${{ steps.identity.outputs.tree }}"

      - name: Rebuild every published product-template scaffold path and mode
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          node scripts/build-published-template-mirror.mjs --out="$RUNNER_TEMP/release-product-template"
          node scripts/product-template-scaffold-lock.mjs \
            --root "$RUNNER_TEMP/release-product-template" \
            --output "$GITHUB_WORKSPACE/release-artifacts/product-template-scaffold.lock.json" \
            --version "${RELEASE_TAG#v}"

      - name: Rebuild the canonical BOM from the exact remote tag
        env:
          RELEASE_DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: >-
          node scripts/build-release-bom.mjs
          --repo "$GITHUB_WORKSPACE"
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --output "$GITHUB_WORKSPACE/release-artifacts/release-bom.json"
          --tag "${{ github.event.client_payload.tag }}"
          --git-head "${{ steps.identity.outputs.commit }}"
          --git-tree "${{ steps.identity.outputs.tree }}"
          --repository "$GITHUB_REPOSITORY"
          --main-ref refs/remotes/origin/main
          --require-sbom
          --require-clean
          --require-release-ref
          --allow-repository-dispatch

      - name: Fail closed unless rebuilt bytes equal the staging run
        id: release_set
        run: >-
          node scripts/release-set.mjs
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --expected "${{ github.event.client_payload.release_set_sha256 }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Download the exact durable stage receipt from its original run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-stage-${{ github.event.client_payload.tag }}-${{ github.event.client_payload.stage_run_id }}-${{ github.event.client_payload.stage_run_attempt }}
          path: stage-evidence
          repository: ${{ github.repository }}
          run-id: ${{ github.event.client_payload.stage_run_id }}
          github-token: ${{ github.token }}

      - name: Recheck remote tag before registry certification
        id: signed_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release-remote-tag.mjs
          --repository "$GITHUB_REPOSITORY"
          --tag "${{ github.event.client_payload.tag }}"
          --expected "${{ steps.identity.outputs.commit }}"
          --expected-object "${{ steps.issued_trust.outputs.tag_object }}"
          --token-env GH_TOKEN
          --github-output "$GITHUB_OUTPUT"

      - name: Certify exact SRI, provenance, signatures, isolated tags, and target tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release-npm-finalize-verify.mjs
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --bom "$GITHUB_WORKSPACE/release-artifacts/release-bom.json"
          --repository "$GITHUB_REPOSITORY"
          --tag "${{ github.event.client_payload.tag }}"
          --git-head "${{ steps.identity.outputs.commit }}"
          --tag-object "${{ steps.issued_trust.outputs.tag_object }}"
          --stage-receipt "$GITHUB_WORKSPACE/stage-evidence/npm-stage-receipt.json"
          --stage-receipt-sha256 "${{ github.event.client_payload.stage_receipt_sha256 }}"
          --stage-run-identity "$GITHUB_WORKSPACE/stage-run-evidence/stage-run-identity.json"
          --stage-run-id "${{ github.event.client_payload.stage_run_id }}"
          --stage-run-attempt "${{ github.event.client_payload.stage_run_attempt }}"
          --stage-artifact-digest "${{ github.event.client_payload.stage_artifact_digest }}"
          --release-authorization-digest "${{ github.event.client_payload.release_authorization_digest }}"
          --release-trust-evidence-digest "${{ github.event.client_payload.release_trust_evidence_digest }}"
          --release-trust-evidence-file "$GITHUB_WORKSPACE/finalization-evidence/release-trust-preflight.json"
          --release-trust-evidence-file-sha256 "${{ steps.issued_trust.outputs.evidence_file_sha256 }}"
          --release-trust-artifact-digest "${{ github.event.client_payload.release_trust_artifact_digest }}"
          --finalizer-run-id "$GITHUB_RUN_ID"
          --finalizer-run-attempt "$GITHUB_RUN_ATTEMPT"
          --github-token-env GH_TOKEN
          --output "$GITHUB_WORKSPACE/finalization-evidence/npm-finalization-receipt.json"

      - name: Bind finalization receipt to a job output
        id: final_receipt
        shell: bash
        run: echo "sha256=$(/usr/bin/sha256sum finalization-evidence/npm-finalization-receipt.json | /usr/bin/awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Retain independently rebuilt evidence and both receipts
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-finalize-${{ github.event.client_payload.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-artifacts/
            stage-evidence/npm-stage-receipt.json
            stage-run-evidence/stage-run-identity.json
            finalization-evidence/release-trust-preflight.json
            finalization-evidence/npm-finalization-receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  publish-github-release:
    name: Publish immutable GitHub Release(contents write only)
    if: github.ref == 'refs/heads/main'
    needs: certify-finalization
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    environment:
      name: release-finalize
    steps:
      - name: Checkout exact tag without stored credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: refs/tags/${{ github.event.client_payload.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch protected main ref
        run: /usr/bin/git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

      - name: Set up verification-only Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          package-manager-cache: false

      - name: Re-resolve original stage workflow and artifact in the fresh writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release-stage-run-identity.mjs
          --repository "$GITHUB_REPOSITORY"
          --tag "${{ github.event.client_payload.tag }}"
          --git-head "${{ needs.certify-finalization.outputs.release_commit }}"
          --run-id "${{ github.event.client_payload.stage_run_id }}"
          --run-attempt "${{ github.event.client_payload.stage_run_attempt }}"
          --artifact-digest "${{ github.event.client_payload.stage_artifact_digest }}"
          --release-trust-artifact-digest "${{ github.event.client_payload.release_trust_artifact_digest }}"
          --token-env GH_TOKEN
          --output "$RUNNER_TEMP/stage-run-identity.writer.json"

      - name: Download digest-bound finalization evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-finalize-${{ github.event.client_payload.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Rebind exact release bytes before repository write authority
        run: >-
          node scripts/release-set.mjs
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --expected "${{ needs.certify-finalization.outputs.release_set_sha256 }}"

      - name: Re-verify canonical BOM in the fresh writer job
        env:
          RELEASE_DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: >-
          node scripts/build-release-bom.mjs --verify
          --repo "$GITHUB_WORKSPACE"
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --bom "$GITHUB_WORKSPACE/release-artifacts/release-bom.json"
          --tag "${{ github.event.client_payload.tag }}"
          --git-head "${{ needs.certify-finalization.outputs.release_commit }}"
          --git-tree "${{ needs.certify-finalization.outputs.release_tree }}"
          --repository "$GITHUB_REPOSITORY"
          --main-ref refs/remotes/origin/main
          --require-sbom
          --require-clean
          --require-release-ref
          --allow-repository-dispatch

      - name: Rebind certified npm finalization receipt
        run: >-
          node scripts/release-npm-finalization-receipt.mjs
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --bom "$GITHUB_WORKSPACE/release-artifacts/release-bom.json"
          --repository "$GITHUB_REPOSITORY"
          --tag "${{ github.event.client_payload.tag }}"
          --git-head "${{ needs.certify-finalization.outputs.release_commit }}"
          --tag-object "${{ needs.certify-finalization.outputs.tag_object }}"
          --receipt "$GITHUB_WORKSPACE/finalization-evidence/npm-finalization-receipt.json"
          --receipt-sha256 "${{ needs.certify-finalization.outputs.finalization_receipt_sha256 }}"
          --stage-receipt-sha256 "${{ github.event.client_payload.stage_receipt_sha256 }}"
          --stage-run-identity "$RUNNER_TEMP/stage-run-identity.writer.json"
          --stage-run-id "${{ github.event.client_payload.stage_run_id }}"
          --stage-run-attempt "${{ github.event.client_payload.stage_run_attempt }}"
          --stage-artifact-digest "${{ github.event.client_payload.stage_artifact_digest }}"
          --release-authorization-digest "${{ github.event.client_payload.release_authorization_digest }}"
          --release-trust-evidence-digest "${{ github.event.client_payload.release_trust_evidence_digest }}"
          --release-trust-evidence-file "$GITHUB_WORKSPACE/finalization-evidence/release-trust-preflight.json"
          --release-trust-evidence-file-sha256 "${{ needs.certify-finalization.outputs.release_trust_evidence_file_sha256 }}"
          --release-trust-artifact-digest "${{ github.event.client_payload.release_trust_artifact_digest }}"
          --finalizer-run-id "$GITHUB_RUN_ID"
          --finalizer-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Recheck remote tag immediately before release mutation
        env:
          TAG_READ_TOKEN: ${{ secrets.RELEASE_TAG_READ_TOKEN }}
        run: >-
          node scripts/release-remote-tag.mjs
          --repository "$GITHUB_REPOSITORY"
          --tag "${{ github.event.client_payload.tag }}"
          --expected "${{ needs.certify-finalization.outputs.release_commit }}"
          --expected-object "${{ needs.certify-finalization.outputs.tag_object }}"
          --token-env TAG_READ_TOKEN

      # External prerequisite: immutable releases must already be enabled and
      # independently read back by the governance reconciler.
      - name: Safely resume draft, publish, and verify immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_READ_TOKEN: ${{ secrets.RELEASE_TAG_READ_TOKEN }}
        run: >-
          node scripts/release-github-release.mjs
          --artifacts "$GITHUB_WORKSPACE/release-artifacts"
          --repository "$GITHUB_REPOSITORY"
          --tag "${{ github.event.client_payload.tag }}"
          --git-head "${{ needs.certify-finalization.outputs.release_commit }}"
          --tag-object "${{ needs.certify-finalization.outputs.tag_object }}"
          --tag-token-env TAG_READ_TOKEN
          --audit-evidence "$GITHUB_WORKSPACE/finalization-evidence/npm-finalization-receipt.json"
          --audit-evidence-sha256 "${{ needs.certify-finalization.outputs.finalization_receipt_sha256 }}"
          --release-trust-evidence "$GITHUB_WORKSPACE/finalization-evidence/release-trust-preflight.json"
          --release-trust-evidence-sha256 "${{ needs.certify-finalization.outputs.release_trust_evidence_file_sha256 }}"
