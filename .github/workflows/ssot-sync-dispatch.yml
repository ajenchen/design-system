name: Retired SSOT sync dispatch compatibility tombstone

# One-time Genesis compatibility file. The provider-neutral release/adoption
# workflows supersede this cross-repository token path. Keeping an inert,
# auditable file lets the A/M-only control-plane bootstrap merge before the
# distinct protected cleanup PR removes the legacy path.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Retired — no external action
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Explain retirement
        shell: bash
        run: |
          echo "This compatibility workflow is permanently inert."
