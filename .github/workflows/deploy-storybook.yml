name: Deploy Storybook

# workflow_run loads this file from the protected default branch. PR and manual
# workflow copies can never acquire Pages or OIDC authority.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-pages:
    name: Rebuild verified main for Pages
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout exact successful CI source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove source is still current protected main
        id: source
        run: |
          set -euo pipefail
          /usr/bin/git fetch --force --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          source_sha="$(/usr/bin/git rev-parse HEAD^{commit})"
          main_sha="$(/usr/bin/git rev-parse refs/remotes/origin/main^{commit})"
          test "$source_sha" = "${{ github.event.workflow_run.head_sha }}"
          test "$source_sha" = "$main_sha" || {
            echo "stale Pages deployment source $source_sha; current main is $main_sha"
            exit 1
          }
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Install and audit with the lock-verified npm runtime
        run: npm run --silent setup:dependencies

      - name: Rebuild exact Storybook
        run: |
          npm run build:lib
          npm run build-storybook

      - name: Bind deployed artifact to exact source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          /usr/bin/jq -n --arg sourceSha "$SOURCE_SHA" '{sourceSha: $sourceSha}' \
            > storybook-static/deployment.json

      - name: Refuse a stale artifact before upload
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          /usr/bin/git fetch --force --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          current_main_sha="$(/usr/bin/git rev-parse refs/remotes/origin/main^{commit})"
          test "$SOURCE_SHA" = "$current_main_sha" || {
            echo "Pages build became stale: source $SOURCE_SHA; current main is $current_main_sha"
            exit 1
          }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: storybook-static

  deploy-pages:
    name: Deploy Storybook to GitHub Pages
    needs: build-pages
    if: needs.build-pages.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact rebuilt artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Read back exact Storybook deployment
        env:
          EXPECTED_SHA: ${{ needs.build-pages.outputs.source_sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}"
          index_file="$RUNNER_TEMP/storybook-index.json"
          deployment_file="$RUNNER_TEMP/storybook-deployment.json"
          ready=0
          for attempt in $(seq 1 12); do
            cache_key="source=$EXPECTED_SHA&attempt=$attempt"
            if curl --fail --silent --show-error --location --max-time 10 \
              --header 'Cache-Control: no-cache' \
              "$base_url/deployment.json?$cache_key" --output "$deployment_file" \
              && curl --fail --silent --show-error --location --max-time 10 \
              --header 'Cache-Control: no-cache' \
              "$base_url/index.json?$cache_key" --output "$index_file" \
              && test "$(/usr/bin/jq -er '.sourceSha' "$deployment_file")" = "$EXPECTED_SHA" \
              && test "$(/usr/bin/jq '[.entries[]? | select(.type == "story")] | length' "$index_file")" -gt 0; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1 || {
            echo "Storybook Pages did not expose the exact source and a non-empty story index"
            exit 1
          }
          story_id="$(/usr/bin/jq -er '[.entries[]? | select(.type == "story")][0].id' "$index_file")"
          curl --fail --silent --show-error --location --max-time 10 \
            --header 'Cache-Control: no-cache' \
            "$base_url/iframe.html?id=$story_id&viewMode=story&source=$EXPECTED_SHA" --output /dev/null
