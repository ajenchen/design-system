name: Authority governance anchor

# This protected-base workflow is the non-spoofable authority producer for the
# App-pinned "Immutable consumer snapshot" context in the DS repository. The
# candidate is untrusted data and never executes on the fresh verdict runner.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-candidate:
    name: Verify authority candidate without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout protected base verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Checkout candidate as untrusted data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'

      - name: Install protected-base verifier dependencies without lifecycle execution
        working-directory: trusted
        env:
          # 兩個 config 不可同指一檔:npm(Node 24 bundled)對同一路徑雙載
          # 直接 error「double-loading config」(2026-07-28 anchor 首航錨例)。
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc-user-empty
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/npmrc-global-empty
        run: |
          : > "$RUNNER_TEMP/npmrc-user-empty"
          : > "$RUNNER_TEMP/npmrc-global-empty"
          # 2026-09-29(待辦總帳 OE6):這裡裝的是 protected main 的依賴樹,只為了執行下面的驗證程式。原本弱點稽核走 enforce
          # (exact-shape 認列,任何新 advisory 一律 fail closed)—— 於是上游 2026-09-28 對 npm 內建 ip-address / undici 各發新通報那天,
          # **每一個** PR 的 anchor 都紅,連「把新形狀認列進 bootstrap」的修復 PR 也過不了:anchor 跑的是 base 的腳本,base 不可能認得
          # 之後才登記的形狀(自鎖,M36(b))。完整性(lock 精確安裝 / 簽章 / attestation)照舊擋;弱點稽核在這棵樹改成只報告、進 receipt、
          # 不擋 —— 候選相對 main **新增**的弱點由下一步 install-candidate-dependencies.mjs 對兩棵樹各跑 npm audit --json 取差集來擋。
          # 政策名就是理由:report-protected-base-verifier(lib/governance-dependency-bootstrap.mjs 定義,receipt 與 log 印的是「protected main
          # 的樹只供驗證程式執行、候選新增弱點由 GOV-CANDIDATE-DEPS-002 差集擋」),不借 report-render-only-reference 的名字 —— 那個
          # 的理由是「歷史參考樹、用完即丟的渲染容器」,不是這棵樹。本 job 仍無任何 secret、persist-credentials: false、runner 用完即丟。
          npm run --silent setup:dependencies -- --vulnerability-policy=report-protected-base-verifier

      - name: Verify all other privileged closure changes structurally
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node trusted/scripts/verify-privileged-change.mjs
          --trusted trusted
          --candidate candidate
          --repository "$GITHUB_REPOSITORY"
          --base-sha "$BASE_SHA"
          --candidate-head-sha "$HEAD_SHA"

      - name: Install and audit candidate with the protected-base lock-bound npm runtime
        run: node trusted/scripts/install-candidate-dependencies.mjs --candidate candidate

      - name: Execute protected-base governance policy against candidate data
        run: |
          node trusted/infra/governance/lib/governance-anchor-version-projection.mjs \
            --trusted-root trusted \
            --candidate-root candidate
          node trusted/scripts/audit-workflow-security.mjs --root candidate
