name: Authority governance anchor

# This protected-base workflow is the non-spoofable authority producer for the
# App-pinned "Immutable consumer snapshot" context in the DS repository. The
# candidate is untrusted data and never executes on the fresh verdict runner.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-candidate:
    name: Verify authority candidate without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout protected base verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Checkout candidate as untrusted data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'

      - name: Install protected-base verifier dependencies without lifecycle execution
        working-directory: trusted
        env:
          # 兩個 config 不可同指一檔:npm(Node 24 bundled)對同一路徑雙載
          # 直接 error「double-loading config」(2026-07-28 anchor 首航錨例)。
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc-user-empty
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/npmrc-global-empty
        run: |
          : > "$RUNNER_TEMP/npmrc-user-empty"
          : > "$RUNNER_TEMP/npmrc-global-empty"
          npm run --silent setup:dependencies

      - name: Verify all other privileged closure changes structurally
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node trusted/scripts/verify-privileged-change.mjs
          --trusted trusted
          --candidate candidate
          --repository "$GITHUB_REPOSITORY"
          --base-sha "$BASE_SHA"
          --candidate-head-sha "$HEAD_SHA"

      - name: Install and audit candidate with the protected-base lock-bound npm runtime
        run: node trusted/scripts/install-candidate-dependencies.mjs --candidate candidate

      - name: Execute protected-base governance policy against candidate data
        run: |
          node trusted/infra/governance/lib/governance-anchor-version-projection.mjs \
            --trusted-root trusted \
            --candidate-root candidate
          node trusted/scripts/audit-workflow-security.mjs --root candidate
