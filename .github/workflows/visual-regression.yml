name: Visual Regression

# Scheduled/manual monitor for curated Ubuntu pixel baselines. It is not a
# required PR check, so a truthful red result does not block the five-step
# release path.

on:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: '重拍 curated baseline 並以 artifact 上傳(在釘死的容器渲染器裡);不會自動 commit'
        type: boolean
        default: false
      reference_ref:
        description: '歸因參考 commit:也在同一個容器重拍它,同渲染器下與 HEAD 逐張比;預設 = 最後一次週跑綠(2026-08-05)的 commit'
        type: string
        default: '2ec2f3fedd94aa30e9b091eac4d713374484bd05'
  schedule:
    - cron: '23 3 * * 3'

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  visual-regression:
    name: Monitor visual regression drift(curated scenarios)
    runs-on: ubuntu-24.04
    # 2026-09-22:渲染器必須釘死,否則 baseline 比的是「runner 今天裝哪個字型版本」而不是產品。
    # 實證:8/5 最後一次綠(runner 映像 20260720.247.2)→ 8/12 起連續六週紅(映像 20260810.271.1 →
    # 20260907.300.1),Playwright 鎖定版本 1.59.1 兩邊相同,25 張超標的差異圖全是字緣、零區塊變動。
    # 「截圖等於 baseline」被當成「產品沒變」,而渲染器一浮動兩者就分開(M37 同族);紅了六週沒人看,
    # 因為只排程、不進 PR —— 現在 release:status / release:auto 會印出上一次週跑的結論(不擋發布)。
    # 容器映像 tag 的版本由 infra/governance/test/ci-workflow-scope.test.mjs 對 package-lock 的
    # playwright 版本做斷言(SSOT 是 lock,這裡不是第二份)。
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    timeout-minutes: 60  # ~124 curated scenarios × screenshot + diff;update_baseline 時多一次參考 commit 的建置與重拍

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # 2026-09-22:原本開著 checkout 的 LFS 旗標(「未來可能改 LFS — 提前 enable」)。LFS 從沒啟用(無 .gitattributes 規則,
          # baseline 是真 PNG),而這個旗標在 Playwright 容器裡沒有 git-lfs 執行檔 → checkout 直接死,run #288 在 36 秒
          # 就紅在簽出階段。為不存在的未來預留的旗標,環境一換就變成硬失敗;真要改 LFS 時再一併裝 git-lfs。
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Install and audit with the lock-verified npm runtime
        run: npm run --silent setup:dependencies

      - name: Install Playwright chromium
        run: npm run --silent setup:playwright -- --with-deps

      - name: Build DS lib + types
        run: npm run build:lib 2>&1 | tail -10

      - name: Build Storybook
        run: npm run build-storybook 2>&1 | tail -5

      # 分隔線幾何是「算出來幾 px」的不變式:class 完全相同也可能算出不同長度
      # (2026-08-07 事故 — 同一條 canonical 跑出 13 / 16 / 24px)。靜態防線鎖不到,
      # 只能實際渲染量。SSOT → action-bar.spec.md「分隔線幾何」。
      - name: Measure action divider geometry
        run: node scripts/measure-action-dividers.mjs --dir storybook-static

      - name: Visual regression diff(scope=all)
        if: ${{ !inputs.update_baseline }}
        run: |
          # Auto-start storybook static server inside visual-audit.mjs
          npm run visual-audit -- --scope=all 2>&1 | tail -40

      # ── 手動重拍 baseline(update_baseline)──────────────────────────────────────────────
      # 「新拍的圖」不等於「對的圖」,重拍要證三件事(2026-09-22):
      #  1. 儀器穩:重拍完立刻再比一次,任何一張不是 0% 就整個 job 紅、不上傳 —— 儀器不穩時不該產生 baseline。
      #  2. 差異可歸因:像素形態學分不開「同一段字、不同光柵器」與「內容真的變了」(兩版實測都失敗),
      #     唯一可靠的辦法是把參考 commit 也放到同一個容器重拍,同渲染器下逐張比,差異全是真的內容變動,
      #     再以 reference_ref..HEAD 的 commit 歸因(scripts/visual-baseline-diff-report.mjs)。
      #  3. 接受與否是人的事:本 job 只有 contents:read,產物走 artifact → PR → 使用者看圖拍板。
      - name: Checkout reference commit for same-renderer attribution
        if: ${{ inputs.update_baseline }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.reference_ref }}
          path: reference
          persist-credentials: false
      - name: Recapture the reference commit in the same container
        if: ${{ inputs.update_baseline }}
        working-directory: reference
        run: |
          npm run --silent setup:dependencies
          npm run build:lib 2>&1 | tail -3
          npm run build-storybook 2>&1 | tail -3
          node scripts/visual-audit.mjs --static --scope=all --update-baseline 2>&1 | tail -5
          mkdir -p "$RUNNER_TEMP/reference-baseline"
          cp infra/governance/baseline/visual/curated/*.png "$RUNNER_TEMP/reference-baseline/"
          echo "reference baseline: $(ls "$RUNNER_TEMP/reference-baseline" | wc -l) files"
      - name: Recapture curated baselines(update_baseline)
        if: ${{ inputs.update_baseline }}
        run: |
          npm run visual-audit -- --scope=all --update-baseline 2>&1 | tail -20
      - name: Instrument stability —— re-diff right after recapture must be clean
        if: ${{ inputs.update_baseline }}
        run: |
          # 剛寫入的 baseline vs 立刻再拍一次:必須 0 張超標,否則渲染器仍在浮動,這批 baseline 不可信
          npm run visual-audit -- --scope=all 2>&1 | tail -12
      - name: Attribute recaptured baselines against the reference(same renderer)
        if: ${{ inputs.update_baseline }}
        run: |
          node scripts/visual-baseline-diff-report.mjs --selftest
          node scripts/visual-baseline-diff-report.mjs \
            --old-dir "$RUNNER_TEMP/reference-baseline" \
            --since-ref "${{ inputs.reference_ref }}" \
            --out .git/governance-runtime/evidence/visual/baseline-diff
          cat .git/governance-runtime/evidence/visual/baseline-diff/summary.md | head -60
      - name: Upload recaptured baselines + attribution report
        if: ${{ inputs.update_baseline }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines-recaptured
          path: |
            infra/governance/baseline/visual/curated/
            .git/governance-runtime/evidence/visual/baseline-diff/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload diff artifacts(on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-diffs
          path: |
            .git/governance-runtime/evidence/visual/visual-audit/
            .git/governance-runtime/evidence/visual/visual-audit/report.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
