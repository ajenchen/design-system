name: Visual Regression

# Scheduled/manual monitor for curated Ubuntu pixel baselines. It is not a
# required PR check, so a truthful red result does not block the five-step
# release path.

on:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: '重拍 curated baseline 並以 artifact 上傳(在釘死的容器渲染器裡);不會自動 commit'
        type: boolean
        default: false
      reference_ref:
        description: '歸因參考 commit:也在同一個容器重拍它,同渲染器下與 HEAD 逐張比;留空 = 預設(job env REFERENCE_REF 的 fallback:最後一次週跑綠 2026-08-05 的 commit)'
        type: string
        default: ''
      target_ref:
        description: '要拍的樹(分支名或 commit);留空 = 觸發當下的預設分支。元件修完、baseline 要跟著換時,拍即將合併的那條 PR 分支,而不是還沒修的 main'
        type: string
        default: ''
  # 2026-09-23:治理 token 沒有 Actions 寫入權限(workflow_dispatch → 403),但有 contents 寫入,能發
  # repository_dispatch(→ 204)。只監聽按鈕事件,等於把「重拍 baseline」綁在「user 親手登入 GitHub 按下去」
  # 這個代理上(M36 自鎖)。payload 三個欄位與手動輸入同名同義;能發這個事件的人本來就有 contents 寫入權,
  # 沒有比按鈕更寬的信任。觸發:POST /repos/<owner>/<repo>/dispatches
  #   {"event_type":"visual-regression-run","client_payload":{"update_baseline":true,"reference_ref":"<sha 或省略>","target_ref":"<分支或 sha 或省略>"}}
  # target_ref(同日稍晚加):repository_dispatch 永遠拿預設分支的 workflow 檔跑,checkout 不指定 ref 就只會拍 main ——
  # 於是「修了元件、要連 baseline 一起換」的 PR 分支永遠拍不到,只能先合併再補一個 baseline PR(合併時 baseline 明知是舊的)。
  # 拍哪棵樹是輸入,不是「觸發當下 main 是哪一版」這個代理(M37)。
  repository_dispatch:
    types: [visual-regression-run]
  schedule:
    - cron: '23 3 * * 3'

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  visual-regression:
    name: Monitor visual regression drift(curated scenarios)
    runs-on: ubuntu-24.04
    # 2026-09-22:渲染器必須釘死,否則 baseline 比的是「runner 今天裝哪個字型版本」而不是產品。
    # 實證:8/5 最後一次綠(runner 映像 20260720.247.2)→ 8/12 起連續六週紅(映像 20260810.271.1 →
    # 20260907.300.1),Playwright 鎖定版本 1.59.1 兩邊相同,25 張超標的差異圖全是字緣、零區塊變動。
    # 「截圖等於 baseline」被當成「產品沒變」,而渲染器一浮動兩者就分開(M37 同族);紅了六週沒人看,
    # 因為只排程、不進 PR —— 現在 release:status / release:auto 會印出上一次週跑的結論(不擋發布)。
    # 容器映像 tag 的版本由 infra/governance/test/ci-workflow-scope.test.mjs 對 package-lock 的
    # playwright 版本做斷言(SSOT 是 lock,這裡不是第二份)。
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      # 三種觸發的輸入收斂到這兩個變數,步驟只讀這裡(SSOT):按鈕 → inputs;API → client_payload;排程 → 兩邊都空
      # = 只比對、不重拍。布林用 == true 比(payload 必須送 JSON 布林,字串 'true' 另外接住),不用 truthy 猜。
      UPDATE_BASELINE: ${{ (inputs.update_baseline == true || github.event.client_payload.update_baseline == true || github.event.client_payload.update_baseline == 'true') && 'true' || 'false' }}
      REFERENCE_REF: ${{ inputs.reference_ref || github.event.client_payload.reference_ref || '2ec2f3fedd94aa30e9b091eac4d713374484bd05' }}
      # 要拍的樹:按鈕 / API 沒給就是觸發當下的 commit(github.sha;排程與空 payload 都落到這裡 = 拍預設分支)
      TARGET_REF: ${{ inputs.target_ref || github.event.client_payload.target_ref || github.sha }}
    timeout-minutes: 60  # ~124 curated scenarios × screenshot + diff;update_baseline 時多一次參考 commit 的建置與重拍

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # 2026-09-22:原本開著 checkout 的 LFS 旗標(「未來可能改 LFS — 提前 enable」)。LFS 從沒啟用(無 .gitattributes 規則,
          # baseline 是真 PNG),而這個旗標在 Playwright 容器裡沒有 git-lfs 執行檔 → checkout 直接死,run #288 在 36 秒
          # 就紅在簽出階段。為不存在的未來預留的旗標,環境一換就變成硬失敗;真要改 LFS 時再一併裝 git-lfs。
          persist-credentials: false
          # 2026-09-23 run #294:歸因要跑 `git log <reference>..HEAD -- <元件目錄>`,淺層簽出(預設 depth 1)沒有那段歷史。
          fetch-depth: 0
          # 拍 TARGET_REF 那棵樹(分支或 commit;預設 = 觸發當下的 commit)。歸因區間仍是 REFERENCE_REF..HEAD,HEAD 就是它。
          ref: ${{ env.TARGET_REF }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm

      # 這個映像(Playwright noble)沒有 jq;治理的依賴安裝走 closed 工具組,bash / git / jq / node / perl / python3
      # 缺一就停(PR #152 第一次跑就死在這裡:「No authenticated jq executable」)。從 Ubuntu 簽章過的套件庫補齊,
      # 再逐一斷言存在 —— 跟 hooks-linux 一樣「斷言而不是假設」。兩支 workflow 這一步必須逐字相同
      #(infra/governance/test/ci-workflow-scope.test.mjs 斷言),否則 PR 閘測的又是另一個環境。
      - name: Provide the closed tool profile interpreters the image lacks
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends jq perl python3
          for tool in bash git jq node perl python3; do
            command -v "$tool" >/dev/null || { echo "missing closed-profile interpreter: $tool" >&2; exit 1; }
          done

      - name: Install and audit with the lock-verified npm runtime
        run: npm run --silent setup:dependencies

      - name: Install Playwright chromium
        run: npm run --silent setup:playwright -- --with-deps

      - name: Build DS lib + types
        run: npm run build:lib 2>&1 | tail -10

      - name: Build Storybook
        run: npm run build-storybook 2>&1 | tail -5

      # 分隔線幾何是「算出來幾 px」的不變式:class 完全相同也可能算出不同長度
      # (2026-08-07 事故 — 同一條 canonical 跑出 13 / 16 / 24px)。靜態防線鎖不到,
      # 只能實際渲染量。SSOT → action-bar.spec.md「分隔線幾何」。
      - name: Measure action divider geometry
        run: node scripts/measure-action-dividers.mjs --dir storybook-static

      - name: Visual regression diff(scope=all)
        if: ${{ env.UPDATE_BASELINE != 'true' }}
        run: |
          # Auto-start storybook static server inside visual-audit.mjs
          npm run visual-audit -- --scope=all 2>&1 | tail -40

      # ── 手動重拍 baseline(update_baseline)──────────────────────────────────────────────
      # 「新拍的圖」不等於「對的圖」,重拍要證三件事(2026-09-22):
      #  1. 儀器穩:重拍完立刻再比一次,任何一張不是 0% 就整個 job 紅、不上傳 —— 儀器不穩時不該產生 baseline。
      #  2. 差異可歸因:像素形態學分不開「同一段字、不同光柵器」與「內容真的變了」(兩版實測都失敗),
      #     唯一可靠的辦法是把參考 commit 也放到同一個容器重拍,同渲染器下逐張比,差異全是真的內容變動,
      #     再以 reference_ref..HEAD 的 commit 歸因(scripts/visual-baseline-diff-report.mjs)。
      #  3. 接受與否是人的事:本 job 只有 contents:read,產物走 artifact → PR → 使用者看圖拍板。
      - name: Checkout reference commit for same-renderer attribution
        if: ${{ env.UPDATE_BASELINE == 'true' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.REFERENCE_REF }}
          path: reference
          persist-credentials: false
      - name: Recapture the reference commit in the same container
        if: ${{ env.UPDATE_BASELINE == 'true' }}
        working-directory: reference
        run: |
          # 2026-09-23 run #291:參考樹用它自己八月的治理程式裝依賴,撞到之後才登記的弱點(baseline-browser-mapping
          # 2.10.43)照設計 fail closed —— 歷史樹永遠無法滿足今天的弱點資料庫。改用 HEAD 的治理程式對參考樹安裝
          #(--root=.):完整性(lock 精確安裝 / 簽章 / attestation)照舊擋,弱點稽核在 report-render-only-reference
          # 政策下只報告不擋 —— 這棵樹只用來渲染截圖,無憑證、容器用完即丟。
          node "$GITHUB_WORKSPACE/scripts/setup-authority-governance.mjs" --dependencies-only --root=. --vulnerability-policy=report-render-only-reference
          # run #292:PLAYWRIGHT_BROWSERS_PATH=0 時瀏覽器裝在**各自的** node_modules 裡;參考樹是另一棵樹,
          # HEAD 那次安裝的 Chromium 它看不到 → visual-audit 起不了瀏覽器。兩棵樹的 playwright 版本相同
          #(lock 都是 1.59.1),同一個 Chromium build,渲染器仍然是同一個。
          npx --no-install playwright install chromium --with-deps
          npm run build:lib 2>&1 | tail -3
          npm run build-storybook 2>&1 | tail -3
          # run #293:儀器用今天的、內容用參考樹的。參考樹自己那版 visual-audit 的結束碼把「對舊 baseline 破預算」
          # 也算失敗(重拍模式下那是必然),場景清單與今天不同、也缺 lib/launch-browser.mjs。建置完成後把今天的截圖
          # 腳本、場景清單與 scripts/lib 蓋進參考樹(不動已建好的 storybook-static),兩次重拍才是同一支儀器。
          cp "$GITHUB_WORKSPACE/scripts/visual-audit.mjs" scripts/visual-audit.mjs
          cp "$GITHUB_WORKSPACE/scripts/visual-assertions.json" scripts/visual-assertions.json
          cp -R "$GITHUB_WORKSPACE/scripts/lib/." scripts/lib/
          # run #297:HEAD 新增的場景(區間預覽三則)參考樹根本沒有那則 story,拍到 404 → render error → 重拍模式唯一會紅的
          # 條件成立,整條紅。「HEAD 有、參考沒有」是正常的產品演進不是儀器壞掉:參考樹只拍它自己有的場景(用它建好的
          # storybook-static/index.json 過濾今天的清單),差集由歸因報告標 new-scenario。index 空或過濾後一則不剩會拒絕。
          node "$GITHUB_WORKSPACE/scripts/visual-manifest-intersect.mjs" --index storybook-static/index.json --manifest scripts/visual-assertions.json --out scripts/visual-assertions.json
          node scripts/visual-audit.mjs --static --scope=all --update-baseline 2>&1 | tail -40
          mkdir -p "$RUNNER_TEMP/reference-baseline"
          cp infra/governance/baseline/visual/curated/*.png "$RUNNER_TEMP/reference-baseline/"
          echo "reference baseline: $(ls "$RUNNER_TEMP/reference-baseline" | wc -l) files"
      - name: Recapture curated baselines(update_baseline)
        if: ${{ env.UPDATE_BASELINE == 'true' }}
        run: |
          npm run visual-audit -- --scope=all --update-baseline 2>&1 | tail -20
      - name: Instrument stability —— re-diff right after recapture must be clean
        if: ${{ env.UPDATE_BASELINE == 'true' }}
        run: |
          # 剛寫入的 baseline vs 立刻再拍一次:必須 0 張超標,否則渲染器仍在浮動,這批 baseline 不可信
          npm run visual-audit -- --scope=all 2>&1 | tail -12
      - name: Attribute recaptured baselines against the reference(same renderer)
        if: ${{ env.UPDATE_BASELINE == 'true' }}
        run: |
          node scripts/visual-baseline-diff-report.mjs --selftest
          node scripts/visual-baseline-diff-report.mjs \
            --old-dir "$RUNNER_TEMP/reference-baseline" \
            --since-ref "$REFERENCE_REF" \
            --out .git/governance-runtime/evidence/visual/baseline-diff
          cat .git/governance-runtime/evidence/visual/baseline-diff/summary.md | head -60
      - name: Upload recaptured baselines + attribution report
        if: ${{ env.UPDATE_BASELINE == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines-recaptured
          path: |
            infra/governance/baseline/visual/curated/
            .git/governance-runtime/evidence/visual/baseline-diff/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload diff artifacts(on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-diffs
          path: |
            .git/governance-runtime/evidence/visual/visual-audit/
            .git/governance-runtime/evidence/visual/visual-audit/report.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
