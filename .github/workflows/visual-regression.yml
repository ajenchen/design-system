name: Visual Regression

# Scheduled/manual monitor for curated Ubuntu pixel baselines. It is not a
# required PR check, so a truthful red result does not block the five-step
# release path.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 3'

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  visual-regression:
    name: Monitor visual regression drift(curated scenarios)
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    timeout-minutes: 45  # ~124 curated scenarios × screenshot + diff(headroom 給 scenario 增長)

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true  # neutral visual baseline authority 可能未來改 LFS — 提前 enable
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Install and audit with the lock-verified npm runtime
        run: npm run --silent setup:dependencies

      - name: Install Playwright chromium
        run: npm run --silent setup:playwright -- --with-deps

      - name: Build DS lib + types
        run: npm run build:lib 2>&1 | tail -10

      - name: Build Storybook
        run: npm run build-storybook 2>&1 | tail -5

      # 分隔線幾何是「算出來幾 px」的不變式:class 完全相同也可能算出不同長度
      # (2026-08-07 事故 — 同一條 canonical 跑出 13 / 16 / 24px)。靜態防線鎖不到,
      # 只能實際渲染量。SSOT → action-bar.spec.md「分隔線幾何」。
      - name: Measure action divider geometry
        run: |
          npx --yes http-server storybook-static -p 4173 --silent &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/index.json >/dev/null && break; sleep 2; done
          node scripts/measure-action-dividers.mjs --base http://127.0.0.1:4173

      - name: Visual regression diff(scope=all)
        run: |
          # Auto-start storybook static server inside visual-audit.mjs
          npm run visual-audit -- --scope=all 2>&1 | tail -40

      - name: Upload diff artifacts(on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-diffs
          path: |
            .git/governance-runtime/evidence/visual/visual-audit/
            .git/governance-runtime/evidence/visual/visual-audit/report.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
