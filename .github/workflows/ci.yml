name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  verify-static:
    name: Verify static(tsc + tests + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # governance-build-graph --check verifies history-bound transitions.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Install locked dependencies once
        run: npm run --silent setup:dependencies

      - name: Build publishable libraries and declarations
        run: npm run build:lib

      - name: TypeScript project check
        run: |
          npx --no-install tsc -b
          # stories 的型別檢查:tsconfig.stories.json 註解宣稱「CI gate 強制」,但 2026-09-08 盤點 grep 全 workflow 為 0 —— 本 PR 自己寫壞的
          # 4 個 story 型別錯就是這樣溜過的(agent-panel logoState / dialog 缺 Story 型別)。
          npm run typecheck:stories

      - name: Verify the shipped Storybook manifest
        run: |
          npm run build-storybook
          /usr/bin/git diff --exit-code -- packages/design-system/ds-story-manifest.json

      # DataTable pixel invariants must run where a browser exists. The local macOS sandbox cannot
      # launch Chromium (Mach lookup closed), which is exactly how the beta.100 multi-person cell
      # centering regression shipped and survived a month: the only pixel gate lived in a pre-commit
      # hook that (a) could not run in the authoring sandbox and (b) only triggered on DataTable's
      # own files while the regression came from a PeoplePicker edit. This CI step closes both gaps:
      # it runs on every PR regardless of which component changed (2026-08-20 user directive:
      # 「所有 table-cell 內容都要合規,閘門要夠通用」).
      # 這 7 組閘是 2026-09-06〜09-08 焦點／拖曳整治建的,全部含 selftest 或對照組,
      # 但**沒有任何一組被 CI 呼叫過** —— 跟上面 distribute-column-widths、pagination
      # 同一種「宣稱有閘、其實沒人跑」(2026-09-08 自己回頭盤 CI 引用時抓到:
      # `grep -rl test:focus-suppression .github` 回 0)。靜態的放前面快速失敗,
      # 需要瀏覽器的併進上一步(那裡已經有 storybook 與 chromium)。

      - name: Focus and drag invariants (static)
        run: |
          npm run test:focus-suppression
          node scripts/focus-geometry-invariant.mjs
          node scripts/focus-geometry-invariant.mjs --selftest
          npm run test:interaction-ladder
          npm run test:drag-announcements
          # 已定案條款不得被重新寫成「待拍板」。2026-09-08 我把 agent 原則 v14 已定案的
          # 「有 URL 的內容與 agent 並存」重新交回去問 user,而 memory 早有明文禁止 ——
          # 那條規則當時只是一句給人看的話,沒有機械防線。這支就是那道防線。
          npm run test:decided-clause-downgrade
          npm run test:button-variants
          # Token 建立不變式(2026-09-11;user:「為何你他媽又不照規範來建立 token?要講幾次?」)。
          # T1 前綴不得跨 family(錨:--overlay-viewport-inset 借用了顏色 token --overlay 的前綴)、
          # T2 這次新增的 token 必須登記進所屬 family 的 spec(錨:同一顆 token 加了 CSS 卻沒加 spec)。
          # 寫成 deterministic script 而不是 Claude 專屬 hook —— provider 專屬的 hook 換一個 agent 或在 CI 裡就沒人擋。
          # 同名數值常數不得在不同檔案有不同值(2026-09-12)。2026-09-12 實際踩過:出殼門檻
          # SHELL_ENGAGE_VIEWPORT_MS 在元件是 60、在閘是 120(改元件時沒改另一份),
          # 結果閘判「畫得動 → 不准出殼」、元件判「畫不動 → 該出殼」,CI 紅得莫名其妙,花一整輪才找到。
          # 同一個值只要存在第二份遲早會漂;最終修法是消滅第二份,這支是機械防線。
          # 對照組把允許清單清空 → 三筆已知的合法同名必須被抓到(證明偵測邏輯有效,不是恆綠)。
          node scripts/named-constant-drift-invariant.mjs --selftest
          node scripts/named-constant-drift-invariant.mjs
          node scripts/token-creation-invariant.mjs --selftest
          npm run test:token-creation
          # 分頁 inlineAction 的幾何:2026-09-10 抓到它對活的 DOMRect 做物件展開 → 永遠回 null,
          # 那顆鈕從 2026-07-18 起一次都沒渲染過;測試檔早就存在,但 `grep -rl check:tabs-inline-action-geometry .github`
          # 回 0 —— 又一支「宣稱有閘、沒人跑」。render-level 那一半在 test:header-tabs-slot-invariants(W3)。
          npm run check:tabs-inline-action-geometry
          # 產生器產物必須與來源同步:barrel(root index.ts)與各元件 index.ts 是 generated,
          # 只有一支 write-time hook 在顧,漏 stage 就會長期漂移 —— 2026-09-10 實測 root barrel
          # 少了 6 個匯出(代理面板斷點常數 / 面板模式型別 / 兩支 hook / 兩支 lib),沒有任何閘會紅。
          node scripts/gen-component-indexes.mjs
          node scripts/gen-design-system-barrel.mjs
          git diff --exit-code -- packages/design-system/src/index.ts 'packages/design-system/src/**/index.ts' \
            || { echo '✗ 產生器產物與來源不同步:請在本機跑 gen-component-indexes.mjs + gen-design-system-barrel.mjs 並 commit'; exit 1; }
          # hover 底色一律瞬間(user 2026-09-10 拍板「全部瞬間」)。對照組六個正反例證明它該紅時會紅。
          node scripts/hover-instant-invariant.mjs
          node scripts/hover-instant-invariant.mjs --selftest

      - name: Registered test scripts nothing was running
        run: |
          npm run test:release-consent
          npm run test:audit-coverage-tier-sync
          npm run test:ci-evidence
          npm run test:privileged-change-authorization
          npm run test:hook-evidence
          npm run test:setup-netlify
          npm run test:deterministic-deep-audit
          # 這條 meta 閘守「宣稱有閘、其實沒人跑」本身:
          # 凡註冊成 test:* 的,CI 就必須觸達得到,否則紅。
          node scripts/ci-gate-coverage.mjs
          node scripts/ci-gate-coverage.mjs --selftest

      - name: Cloud portability gates (provider config survivability)
        run: |
          node --test scripts/test-cloud-portability-invariants.mjs
          node scripts/test-claude-permission-policy.mjs

      - name: Focused governance and release SSOT checks
        run: |
          node --test infra/governance/test/ci-workflow-scope.test.mjs
          node --test --test-name-pattern='canonical GitHub profile minima' infra/governance/test/model-validation.test.mjs
          node --test infra/governance/test/workflow-identity-sync.test.mjs
          node --test infra/governance/test/release-workflow.test.mjs
          node --test scripts/test-deterministic-vite-output.mjs
          # 殘留鎖回收的三態判斷:EPERM(pid 被回收或沙箱擋訊號)原本被當成「還活著」,
          # 於是那把鎖永遠清不掉 —— 2026-09-08 連兩次提交被自己的機制擋住。
          node scripts/test-authority-generation-reaper.mjs
          node scripts/governance-build-graph.mjs --check

      - name: Build React 19 consumer template
        working-directory: apps/template
        run: npm run build

  # The governance hooks are shell, and until now nothing ever executed them on Linux — they were
  # only ever run on the maintainer's macOS. That is how BSD-only `stat -c` / `date -d` fallbacks
  # reached cloud sessions, where they silently returned 0 and made every staleness window look
  # infinitely old. Running the suite on ubuntu-24.04 turns cloud portability into a merge-time
  # invariant instead of an after-the-fact repair. Kept out of `verify` so a hook failure is legible
  # on its own, and deliberately excludes the ten-minute governance harness suite, which stays
  # outside the PR gate.

  verify-browser-datatable:
    name: Verify browser(DataTable pixel gates)
    runs-on: ubuntu-24.04
    # 15 → 25(2026-09-11):這個 job 在 06:13 那跑被 15 分鐘上限砍掉(15.4 分),
    # 原因是同一天把快速捲動閘的 --runs 2→3、感知閘重跑上限 3→5 —— 是我自己加的工作量,不是機器變慢。
    # 逾時本身不構成品質訊號,砍掉的那次其實每一項判定都是綠的。
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # governance-build-graph --check verifies history-bound transitions.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Install locked dependencies once
        run: npm run --silent setup:dependencies

      - name: Build publishable libraries and declarations
        run: npm run build:lib

      - name: Build the Storybook the browser gates load
        run: npm run build-storybook

      # 參考建置(main)——空白那條斷言唯一不受 runner 漂移影響的形式就是「同 job 交錯比 main」。
      # 為什麼一定要:**同一份元件邏輯**(git diff 去掉註解後零差異)在 CI 上量到空白中位
      # 162 / 325 / 485 / 471 / 687ms,4 倍散佈 —— 絕對門檻只是在量那台機器。
      # 試過用「每個 scroll 忙等 120ms」的固定工作量對照當分母,不行:它會飽和
      #(同期對照只從 737 走到 1198ms=1.6×,被判定那跑卻從 162 走到 687ms=4.2×),拿它當分母會把真實差距壓掉。
      - name: Build the reference (main) Storybook the blank ratio compares against
        run: |
          set -euo pipefail
          REF_SHA="$(git rev-parse origin/main)"
          echo "reference = $REF_SHA"
          git worktree add tmp/ref-src "$REF_SHA"
          (cd tmp/ref-src && npm ci --no-audit --no-fund && npm run build:lib && npm run build-storybook)
          mv tmp/ref-src/storybook-static tmp/ref-storybook
          git worktree remove --force tmp/ref-src

      - name: DataTable pixel invariants (browser)
        run: |
          npx --no-install playwright install chromium
          # 純函式單測必須跟著跑:`distributeColumnWidths` 的「撞上限凍結 → 重分配」分支在任何 story
          # 都走不到(餵進去的 maxes 是 columnDef.maxSize,TanStack 預設填 MAX_SAFE_INTEGER),
          # 只靠下面的瀏覽器斷言等於零證據。2026-09-04 抓到:它被串在 `npm run test:datatable-invariants`
          # 裡,而這裡是直接呼叫 .mjs → 單測從來沒在 CI 跑過。
          node scripts/test-distribute-column-widths.mjs
          node scripts/test-fast-scroll-gate-policy.mjs
          node scripts/data-table-invariants.mjs
          node scripts/data-table-scrollbar-visibility.mjs --quick
          node scripts/data-table-scroll-cost.mjs
          # 快速捲動「中央整片白」(2026-09-09):量合成器真正送出的每一幀(CDP screencast + 合成手勢),不是 DOM、不是預估。
          # 先跑對照組(靜態頁 0 空白 / 忙等必紅)證明儀器在該紅時會紅,再當閘:6,000px/s 手勢下中央區最長連續空白 ≤ 400ms、
          # 停手後列殼 ≤ 1000ms 補齊。門檻是本機校準的回歸線(修前 main 684–1055ms、修後 18–34ms,留 10 倍以上機器差),不是業界標準。
          node scripts/data-table-fast-scroll.mjs --mode=gesture --selftest --gesture-speed=6000
          # 這台 runner 不節流就是「慢機器」:R17 判準在這裡整片白 1,301 / 1,210ms(7aad1396),自適應判準 v8 降到 64 / 103ms(d7553067)。
          # 不在 CI 疊 CPU 節流:CDP 節流在 2 vCPU 的共享 runner 上不是線性的(d7553067 同一 job:不節流 64 / 103ms,--cpu-throttle=4 卻 1,769 / 1,585ms;
          # 本機 4× 是 167 / 167ms),數字不能跨機器搬。2× / 4× / 6× 節流當本機重現與壓力工具(AD56 / AD62),不當 CI 閘。
          # 長工與幀距**必須斷言**(2026-09-11 補):這支閘一直有量、卻只印在表上不判定 —— 一版把主執行緒最長任務
          # 從 66ms 推到 661ms 的改動因此全綠放行,而那 661ms 會把 hover / 點擊一起卡住(user 回報「hover 反應延遲很久」)。
          # 門檻 300ms:這台 runner 上 main 是 64–66ms,超過 300ms 已經是人明顯感覺得到的停頓(對齊 web.dev 對輸入延遲的量級)。
          # 判定用**中位數**不是單趟最大值(2026-09-11):同一份 build 在這台共享 runner 上跑間差很大
          # (eb5b42fc 276/282 全綠,分布相同的 c34e035c 卻是 153/415 —— 那趟 415 是雜訊不是回歸)。
          # 中位數仍抓得到真回歸(119e279f 438/476 照樣紅),另留單趟天花板 = 門檻×2 擋災難級停頓。
          # 判定政策本身由 scripts/test-fast-scroll-gate-policy.mjs 用真實 CI 數字當判定表驗(該紅的必須紅)。
          # runs 2→3:中位數要有意義至少要三趟。
          # runs 維持 3(2026-09-11:試過 5,撤回)。動機是這台共享 runner 變異極大 —— **同一份元件邏輯**
          # (去掉註解後與 4ea6a462 零差異)在四次 CI 上量到長工中位 101 / 110 / 343 / 352ms。
          # 但 5 趟的逐趟數字顯示**後兩趟自己會劣化**(空白 126/142/124/738/670、長工 352/236/116/355/369)——
          # 連跑 5 個 Chromium 的累積壓力反而讓分布更糟,取樣變多沒有換到穩定。撤回。
          # `--calibrate`(2026-09-11):判定前先跑一趟**固定工作量**的對照(每個 scroll 事件忙等 120ms,與本元件無關),
          # 用它把「runner 快慢」跟「程式碼好壞」分開。證據:同一份元件邏輯在 CI 上量到空白中位 162/325/485/471ms,
          # 而同一個 job 裡那個固定工作量對照是 957/775/1171/1082ms —— 兩者同向。
          # 靜態負對照的呈現幀數(55/55/56/55/52/56)則證明送幀本身沒壞,是機器慢。
          # 偵測力沒掉:真回歸 = 空白漲、對照不動 → 比值上升 → 紅(判定表對照組有驗)。
          # 空白改判「分支 ÷ main ≤ 1.25」(2026-09-11)。兩個建置在**同一跑之內交錯量測**,機器狀態一致,
          # 比值才有意義;`--runs=2` 是因為兩個 build 各跑 2 趟已經足夠(比值把雜訊消掉了),同時守住 job 時間預算。
          # 判定政策由 scripts/test-fast-scroll-gate-policy.mjs 的判定表驗(含「機器兩邊一起慢 → 過」與
          # 「main 沒慢而分支慢 → 紅」兩側,以及「119e279f 的骨架回歸對 main 是 0.55 → 不該誤紅」)。
          # 補齊 / 長工 / 幀距仍是絕對門檻(長工另按機器能力放大,見 lib)。
          # **目的地閘**(2026-09-12,user 原話「你知道 main 只是低標嗎」「任何情境理想上都不應該看到空白,
          # 但也不應該為了達成此目的而讓體驗和互動卡頓」)。上面那些 `--ref=main` 比值判的是「別比 main 差」=
          # 地板;`--assert-max-blank-frames=0` 是絕對的目的地:**送出的任何一幀都不得有空白帶**。
          # 它與機器速度無關,因為滿足它的機制(未掛載區預先鋪骨架底,`data-table.tsx` 的
          # `unmountedSkeletonStyle`)成本固定、由合成器搬運 —— 慢機器該退化的是「多久看到真資料」,不是「看到白的」。
          # 判每趟最大值不判中位數:空白幀是缺陷不是雜訊。
          # 本機同故事對照(gesture 6000px):改前 CPU×1 27–29 幀 / 17-17 帶 / 最長 410–511ms;
          # 改後 CPU×1 0–1 幀、×4 0–1 幀、×8 0–1 幀,最長一律 ≤ 18ms。
          # **runs 2 → 3**(2026-09-12)。上面那句「兩趟已經足夠(比值把雜訊消掉了)」對**最大值**這種
          # 重尾統計量不成立,而且被同一天的兩輪 CI 直接證偽:
          #   b491d119(綠)branch 幀距 271 / 296 → 中位 284;main 258 / 375 → 316
          #   fd90398a(紅)branch 幀距 **531** / 347 → 中位 439;main 299 / 292 → 295
          # 兩版之間**沒有任何 DataTable 程式碼改動**(只有 Combobox story 與帳本文件)。
          # 關鍵是 n=2 時「中位數」等於平均數 —— 一趟離群值直接拉著判定走,那道「中位數擋雜訊、
          # 天花板擋災難」的設計在 n=2 退化成只剩天花板。n=3 才是真的中位數(能丟掉一個離群值),
          # 而且偵測力更強不是更弱(樣本變多)。成本:本 job 實測 8 分鐘 / 上限 25,加一趟綽綽有餘。
          node scripts/data-table-fast-scroll.mjs --mode=gesture --runs=3 --gesture-speed=6000 \
            --ref=main --builds=main=tmp/ref-storybook,branch=storybook-static \
            --assert-max-blank-frames=0 \
            --assert-max-fill-ms=1000 --assert-max-long-task-ms=300 --assert-max-frame-gap-ms=600
          # 「**畫得動的機器**不准出骨架」(2026-09-11)。骨架是「真的畫不完」時的過渡手段,不是正常捲動該看到的東西;
          # 沒有這條斷言之前,一個把「要不要出殼」判準訂成**只看位移**的版本可以全綠出貨 —— 而在 user 的真實 Chrome 上,
          # 一次普通滾輪(1000px)就把整個視窗 14 列全變骨架,同一台機器的 main 是 0 骨架。
          # **為什麼用 400px 小視窗**:這台 runner 在 800px 視窗下連不節流都「畫不動」(一個視窗 174ms > 120ms),
          # 斷言會自動跳過 = 形同虛設。把視窗縮到 400px 讓它落進「畫得動」的區間,這條不變式才真的被驗到。
          # 本機以同一組參數兩側對照過:修前建置 11 幀必紅、修後 0 幀綠。
          node scripts/data-table-fast-scroll.mjs --mode=gesture --runs=2 --gesture-speed=6000 --viewport=1400x400 --assert-max-shell-frames=0
          # **滾輪路徑**(2026-09-12 補,獨立覆核抓到 `grep -c "mode=wheel" ci.yml` = 0):
          # user 的真實情境是「Chrome 開預覽、用滾輪捲」,而在這之前 CI 只跑 CDP 合成手勢(gesture),
          # 滾輪這條路一條閘都沒有。wheel 兩趟只要 8.5 秒,沒有理由不跑。
          # wheel 沒有截圖幾何(screencast 是 gesture 專屬),所以只判 long task —— 那正是「畫面卡住不動」的成因;
          # 缺的那些指標會明白印「這個模式沒有這項量測,不適用」,不會靜默當成通過。
          # 本機同機對照(n=3):long task 數 main 7 / 分支 1、合計 main 585ms / 分支 83ms、連續空白 277 → 225ms。
          node scripts/data-table-fast-scroll.mjs --mode=wheel --runs=3 \
            --ref=main --builds=main=tmp/ref-storybook,branch=storybook-static \
            --assert-max-long-task-ms=300
          # 「指標底下那一列永遠有 hover 反應」(2026-09-11 新閘;user:「游標明明到了,table row 的反應卻要等好一陣子」)。
          # 兩個根因都在腳本檔頭:殼列原本沒有 hover 底色、以及捲動中瀏覽器不重新派送 hover。先對照組再判定。
          node scripts/data-table-row-under-pointer-invariant.mjs --selftest
          node scripts/data-table-row-under-pointer-invariant.mjs
          # 列 hover 的反應延遲(2026-09-11 新閘;先跑對照組證明儀器會紅,再跑正式判定)
          node scripts/data-table-hover-latency.mjs --rows=8 --selftest
          node scripts/data-table-hover-latency.mjs --rows=10 --assert=on --assert-median=60 --assert-max=600
          # 預掛緩衝要隨機器能力自適應(2026-09-12)。TanStack 的 rangeExtractor 沒有「保留舊列」機制,
          # 緩衝固定 5 列 = 200px 而一次滾輪 1000px,結構上差 5 倍;AG Grid 預設每側 10 列,文件逐字說
          # 那是為了「on some slower machines and browsers, a blank space can be seen as the user scrolls」。
          # 我們比它多實測的每列成本,所以快機器加到 10(1× 空白 30 幀/67ms → 0–2 幀/0–17ms)、
          # 慢機器縮回下限讓列殼接手(固定 10 在 4× 反而把最長空白從 451ms 惡化到 566ms)。
          # 對照組把兩次取樣都跑同一個 CPU 檔位,自適應無從表現 → A3 必須紅。
          node scripts/data-table-overscan-adaptive-invariant.mjs --selftest
          node scripts/data-table-overscan-adaptive-invariant.mjs
          # Content readiness and still-visible fading handles need separate gates from frame cadence.
          node scripts/test-data-table-scroll-perception.mjs --out=tmp/datatable-content-controls
          # 把手捲動閂鎖(2026-09-10,data-table.spec.md「捲動與可視帶」):指標不動的捲動 → 第一個 scroll 事件後零把手;對照組 unlatch(每次 scroll 派發座標遞增的
          # 合成 pointermove = 指標真的在動)把手必須回來。--hover=follow:指標有動時可見把手貼原列中心 ±1px;對照組注入 20px 偏移必被抓到。
          node scripts/data-table-handle-position.mjs --dpr=2 --selftest --out=tmp/datatable-handle-control
          node scripts/data-table-handle-position.mjs --dpr=2 --hover=follow --selftest --out=tmp/datatable-handle-follow-control
          node scripts/data-table-handle-position.mjs --dpr=2 --hover=follow --out=tmp/datatable-handle-follow
          # 把手可視帶:整顆放得進 body client box 才顯示、不再 clip-path 切殘片;半露的列不出把手;傳統 17px 捲軸下不坐到捲軌上;對照組強制顯示必紅
          node scripts/data-table-handle-clip-invariant.mjs --selftest
          node scripts/data-table-handle-clip-invariant.mjs
          node scripts/data-table-pinned-resize-invariant.mjs --selftest
          node scripts/data-table-pinned-resize-invariant.mjs
          # dpr2 的內容延遲不在 CI 斷言(零殼 / 擷取 / 空白仍斷言):共享 2 vCPU runner 在 dpr2 是 raster 成本決定延遲,幀距正常 16ms 卻
          # p95 72 / 最長 100(8277f858);本機 2× 節流對照 main p95 83 / 117 vs 本分支 0 / 17、4× 235 / 268 vs 132 / 148 ——
          # 本分支嚴格優於 main,runner 的數字是機器不是表格。延遲在 dpr1 斷言(runner 上穩定 0);dpr2 的回歸對照用本機節流跑 main vs 分支(AD62)。
          # dpr2 那一組搬到 verify-browser-datatable-dpr2(2026-09-10:本 job 13.6 分鐘、元件 job 15 分鐘被取消 —— 兩個都貼到 AD34 釘住的 15 分鐘預算)
          for dpr in 1; do
            LAT=on
            node scripts/data-table-handle-position.mjs --dpr=$dpr --out=tmp/datatable-handle-$dpr
            for peak in 1500 3000 4500; do
              node scripts/data-table-scroll-perception.mjs --dpr=$dpr --peak=$peak --assert=on --latency-assert=$LAT --out=tmp/datatable-content-$dpr-$peak
            done
            node scripts/data-table-scroll-perception.mjs --dpr=$dpr --peak=4500 --profile=bursts --assert=on --latency-assert=$LAT --out=tmp/datatable-content-bursts-$dpr
            node scripts/data-table-scroll-perception.mjs --dpr=$dpr --peak=4500 --profile=bursts --input=wheel --assert=on --latency-assert=$LAT --out=tmp/datatable-content-wheel-$dpr
          done
          # 列/表頭元素快取的依賴完整性(靜態,TypeScript 語法樹):快取靠手列的 epochDeps,漏一個就是
          # 「舊列拿到過期資料」(2026-09-08 I2 抓到漏 resolvedWidths → 顯示↔編輯寬差 0.59px)。
          node scripts/data-table-row-cache-deps-invariant.mjs

      - name: Preserve DataTable scroll perception evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datatable-scroll-perception
          path: |
            tmp/datatable-content-*/
            tmp/datatable-handle-*/
          if-no-files-found: ignore
          retention-days: 14

  verify-browser-datatable-dpr2:
    # 2026-09-10 拆自 verify-browser-datatable(同一批 perception 在 dpr2 再跑一輪約 6 分鐘;原 job 13.6 分鐘貼到 15 分鐘預算,
    # 重跑一次停頓就會逾時)。dpr2 的內容延遲不斷言(AD62:共享 runner 在 dpr2 是 raster 成本決定),零殼 / 擷取 / 空白照斷言。
    name: Verify browser(DataTable dpr2 gates)
    runs-on: ubuntu-24.04
    # 15 → 25(2026-09-11):這個 job 在 06:13 那跑被 15 分鐘上限砍掉(15.4 分),
    # 原因是同一天把快速捲動閘的 --runs 2→3、感知閘重跑上限 3→5 —— 是我自己加的工作量,不是機器變慢。
    # 逾時本身不構成品質訊號,砍掉的那次其實每一項判定都是綠的。
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # governance-build-graph --check verifies history-bound transitions.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Install locked dependencies once
        run: npm run --silent setup:dependencies

      - name: Build publishable libraries and declarations
        run: npm run build:lib

      - name: Build the Storybook the browser gates load
        run: npm run build-storybook

      - name: DataTable dpr2 perception gates (browser)
        # DT_PERCEPTION_GAP_MS=130(2026-09-11):dpr2 每張 PNG 是 dpr1 的四倍畫素,慢 runner 上編碼一慢就整排踩線 ——
        # 50ee1d3b 五次重跑的最長送幀缺口是 114 / 110 / 116 / 103 / 109ms(預設門檻 100),而同一輪 CI 裡
        # 固定工作量的對照組顯示那台 runner 比校準點慢約 40%。這條是**擷取有效性**判定(這次量到的可不可信),
        # **不是表格的品質判定** —— 放寬它不會放過任何表格回歸;其餘覆蓋率守衛(≥10 幀、≥10 個解碼位置、
        # 涵蓋 90% 輸入區間與行程、首尾偏移準確)一條都沒動,dpr1 仍用預設 100ms。
        env:
          DT_PERCEPTION_GAP_MS: '130'
        run: |
          npx --no-install playwright install chromium
          node scripts/data-table-handle-position.mjs --dpr=2 --out=tmp/datatable-handle-2
          for peak in 1500 3000 4500; do
            node scripts/data-table-scroll-perception.mjs --dpr=2 --peak=$peak --assert=on --latency-assert=off --out=tmp/datatable-content-2-$peak
          done
          node scripts/data-table-scroll-perception.mjs --dpr=2 --peak=4500 --profile=bursts --assert=on --latency-assert=off --out=tmp/datatable-content-bursts-2
          node scripts/data-table-scroll-perception.mjs --dpr=2 --peak=4500 --profile=bursts --input=wheel --assert=on --latency-assert=off --out=tmp/datatable-content-wheel-2

      - name: Preserve DataTable dpr2 perception evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datatable-scroll-perception-dpr2
          path: |
            tmp/datatable-content-*/
            tmp/datatable-handle-*/
          if-no-files-found: ignore
          retention-days: 14

