      - name: Install locked dependencies once
        run: npm run --silent setup:dependencies

      - name: Build publishable libraries and declarations
        run: npm run build:lib

      - name: Build the Storybook the browser gates load
        run: npm run build-storybook

      - name: Overlay and theme invariants (browser)
        run: |
          npx --no-install playwright install chromium
          # Dialog 高度不變式(2026-09-11;user 重述的高度模型逐條變成斷言)。先對照組再判定。
          node scripts/dialog-height-invariant.mjs --selftest
          # H5 需要自己的對照組:上面那個 --selftest 把高度上限拿掉後 dialog 變 99904px 高,
          # 任何內容都不會溢出,H5 的條件永遠觸發不了(實測 溢出數 恆為 0)。
          # --selftest-h5 保留上限、只還原「容器 overflow-hidden」與「Tabs Root flex」兩個修法,
          # 讓 H5 面對 bug 當時的真實形狀(實測會精準抓到 展示--with-tabs-in-header)。
          node scripts/dialog-height-invariant.mjs --selftest-h5
          node scripts/dialog-height-invariant.mjs
          # 浮層快捷鍵的作用域:焦點在檢視器外時方向鍵不得切換檔案,
          # 「靜止時同色的顏色配對,hover 後必須還是同色」全 DS 掃描(2026-09-11;user 截圖:
          # Switch hover 時白色圓浮出一圈灰邊)。根因是 spec 要求 thumb 邊框「與 OFF track 同色」,
          # 而 track 2026-07-06 加了 hover 升階、邊框沒跟 → 那圈本來看不見的邊現形。
          # 這是**一整類** bug 的防線(任何「子邊框刻意等於父底色」的結構都可能重犯),不只 Switch。
          # 對照組把邊框凍回修前的值,必須抓到;掃到 0 組配對也判紅(代表什麼都沒驗到)。
          node scripts/hover-color-pair-invariant.mjs --selftest
          node scripts/hover-color-pair-invariant.mjs
          # Switch thumb 外圈必須渲染成 track 本身(2026-09-11)。這條量真實像素,因為兩次事故
          # (hover 漏升階 / dark mode 白疊白使外圈消失)在 computed style 下**都是綠的**。
          # 對照組把 background-clip 改回 border-box 並把外圈塗白 = 原樣重放 dark mode 那次事故。
          node scripts/switch-thumb-ring-invariant.mjs --selftest
          node scripts/switch-thumb-ring-invariant.mjs
          # `color-scheme` 必須跟著 theme 翻(2026-09-12;user 截圖:dark 的 DataTable 捲軸是亮色)。
          # DataTable 走原生捲軸、Chromium 又把 scrollbar-color 重設回 auto,所以捲軸長相只由
          # color-scheme 決定 —— 在這之前整個 DS 沒宣告過它,計算值是 normal → 永遠畫亮版。
          # C2 用「完全不吃 DS 樣式的原生控制項」當觀測器,確認瀏覽器真的照做,不只驗宣告存在。
          node scripts/color-scheme-invariant.mjs --selftest
          node scripts/color-scheme-invariant.mjs
          # 表單欄位垂直間距 = --layout-space-loose,全 DS 無例外(2026-09-12 user 拍板移除
          # FieldGroup 的 compact/normal/loose 三檔)。兩段式:S 靜態掃 312 個 .tsx 抓 className/prop 覆寫
          # (連 consumer 程式碼都蓋得到),R 用瀏覽器驗元件自己渲染的 computed row-gap(兩個 density)。
          # 全掃 1033 支 story 要 2 分 22 秒,但「className 蓋掉」已由 S 全面覆蓋,不需要用 6 倍瀏覽器時間再驗。
          node scripts/form-gap-token-invariant.mjs --selftest
          node scripts/form-gap-token-invariant.mjs


  verify-browser-interaction:
    name: Verify browser(component + interaction gates)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
