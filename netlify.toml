[build]
  # 2026-05-26 fix(per user 「ds repo netlify failed 那麼多次」):chain build:lib 先把
  # @qijenchen/design-system dist + @qijenchen/storybook-config dist build 出來,Storybook 才有 type
  # 之前 only `npm run build-storybook` → prebuild-storybook 只 build storybook-config 但 DS dist 缺 → tsc fail → exit 2
  command = "npm run build:lib && npm run build-storybook"
  publish = "storybook-static"

[build.environment]
  # Node 版本不在這裡寫:Netlify 讀站台 base 目錄(= repo 根)的 .node-version(唯一出處,scripts/node-version-ssot-invariant.mjs 守;
  # 官方文件 https://docs.netlify.com/build/configure-builds/manage-dependencies/ 「Add a .node-version or .nvmrc file to the site's base directory」)。
  # 這裡再寫 NODE_VERSION 就是第二份出處(2026-11-28 前是 "22",CI 是 24.14.0)。
  # 2026-11-26:PR #174 的預覽建置時好時壞(efce5630 / a94583d4 / 1e468c7d 敗,612c7097 / cc2d70a6 成;成敗都約 1.5 分)。
  # 部署 6b07d38c5bfd1e21dc11b26f 的日誌:storybook build 預覽建完後「FATAL ERROR: Ineffective mark-compacts near heap limit … JavaScript heap out of memory」,
  # 堆積用到 1955 MB —— Node 依機器記憶體自訂的預設上限(約 2 GB)。本機與 GitHub CI 機器記憶體較大、預設上限較高,所以從沒失敗。
  # 給 Node 明確的 4 GB 上限;用量貼著上限就是時好時壞的原因。
  NODE_OPTIONS = "--max-old-space-size=4096"

# Per-branch deploy previews 需在 Netlify dashboard 手動開啟(Site configuration → Build & deploy →
#   Branch deploys → Deploy all branches)—— Netlify 預設只部署 production branch,branch deploys 非預設啟用。
# Production deploy 走 main(production URL = 永遠最新 main 的 storybook)

# 2026-05-30:noindex/access-control headers(對齊 template netlify.toml parity)。
# DS Storybook 的 .storybook/main.ts glob `../apps/**/*.stories.@(tsx|mdx)` → 公開暴露 apps/** 內部 product UI;
# 無此 header 則 preview + production deploy 會被搜尋引擎收錄(內部 UI SEO leak)。
# 此 header 只防搜尋引擎索引,不擋直接訪問。
# 真擋陌生人(免費)= Netlify Edge Function 自做 HTTP Basic Auth(env var STORYBOOK_BASIC_AUTH,edge 層比對;Edge Functions 免費方案可用)。
#   Netlify 內建密碼 — Dashboard 的 Password protection 與 `_headers` 的 Basic-Auth header — 兩個都是 Pro 方案專屬
#   ($20/mo,2026-06-05 官方 docs + support forum 三重證實;且 `_headers` basic-auth 不套用到 edge function),free-tier 都沒有。
#   DS owner 要免費擋人同走 template 的 Edge Function Basic Auth(見 template/ds-product-template/netlify/edge-functions/basic-auth.ts
#   + netlify.toml [[edge_functions]] path="/*" function="basic-auth");Pro Password / Cloudflare Access 為進階選項。
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
